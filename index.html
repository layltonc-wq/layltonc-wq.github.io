  // Parte 2 (#6): definir lote/validade no medicamento. Além do rótulo no cadastro (loteAtual/validadeAtual),
  // atribui o estoque "sem lote" a esse lote via entries (mesmo formato dos lotes normais), pra aparecer
  // no detalhe do medicamento (que monta os lotes a partir dos entries) e não só na lista principal.
  function abrirLoteCad(m){var raw=medById[m.id]||{};setLcId(m.id);setLcLote(raw.loteAtual||'');setLcVal(raw.validadeAtual||'');}
  function salvarLoteCad(m){
    var lote=(lcLote||'').trim();var val=_normValidade((lcVal||'').trim());
    if(!lote){alert('Informe o número do lote.');return;}
    setLcSaving(true);
    var now=new Date().toISOString();var semLote=parseInt(m.semLote)||0;
    var ops=[db.collection('medicamentos').doc(m.id).update({loteAtual:lote,validadeAtual:val})];
    if(semLote>0){
      // reclassifica o "sem lote" para o novo lote: entrada com lote + saída sem lote (saldo total inalterado).
      // Flag origemConferencia mantém o par fora dos relatórios; o detalhe do medicamento lê pelo lote normalmente.
      ops.push(db.collection('entries').add({medicamentoId:m.id,medicamentoNome:m.nome,tipo:'entrada',quantidade:semLote,lote:lote,validade:val,observacao:'Conferência: atribuição de lote',origemConferencia:true,divergenciaTipo:'conferencia',autorNome:user.name,autorId:user.uid||'',autorCor:user.color||B,criadoEm:now,date:todayStr()}));
      ops.push(db.collection('entries').add({medicamentoId:m.id,medicamentoNome:m.nome,tipo:'saida',quantidade:semLote,lote:'',validade:'',observacao:'Conferência: atribuição de lote (reclassificação)',origemConferencia:true,divergenciaTipo:'conferencia',autorNome:user.name,autorId:user.uid||'',autorCor:user.color||B,criadoEm:now,date:todayStr()}));
    }
    Promise.all(ops).then(function(){if(semLote>0)_bumpEntriesVersion();setLcSaving(false);setLcId(null);setLcLote('');setLcVal('');setErro('');})
      .catch(function(e){setLcSaving(false);erroEscrita(e);});
  }

  // AJUSTE 1: aplica a contagem de UM medicamento no estoque imediatamente (ajuste de conferência).
  // A partir daqui, saídas normais já descontam do novo saldo (calcStock inclui o ajuste).
  function confirmarContagemMed(m){
    if(!medConferido(m)){alert('Digite a contagem de ao menos um lote deste medicamento antes de confirmar.');return;}
    setConfMedId(m.id);
    var falhou=function(e){setConfMedId(null);erroEscrita(e);try{alert('Erro ao confirmar a contagem: '+((e&&e.message)?e.message:e));}catch(_){}};
    try{
      var now=new Date().toISOString();
      var itens=[];
      m.lotes.forEach(function(l){var k=confKey(m.id,l.lote,l.validade);var raw=contagens[k];if(raw===undefined||raw==='')return;var contado=parseInt(raw)||0;if(contado-l.qty!==0)itens.push({lote:l.lote,validade:l.validade,sistema:l.qty,contado:contado,diff:contado-l.qty,novo:false});});
      if(m.semLote>0){var ks=confKey(m.id,'__SEMLOTE__','');var rawS=contagens[ks];if(rawS!==undefined&&rawS!==''){var cs=parseInt(rawS)||0;if(cs-m.semLote!==0)itens.push({lote:'',validade:'',sistema:m.semLote,contado:cs,diff:cs-m.semLote,novo:false});}}
      novosLotes.filter(function(nl){return nl.medId===m.id;}).forEach(function(nl){if((parseInt(nl.qty)||0)>0)itens.push({lote:nl.lote,validade:nl.validade||'',sistema:0,contado:parseInt(nl.qty)||0,diff:parseInt(nl.qty)||0,novo:true});});
      // saldo final deste medicamento após aplicar a contagem
      var resultante=0;
      m.lotes.forEach(function(l){var k=confKey(m.id,l.lote,l.validade);var raw=contagens[k];resultante+=(raw!==undefined&&raw!=='')?(parseInt(raw)||0):l.qty;});
      if(m.semLote>0){var ks2=confKey(m.id,'__SEMLOTE__','');var rawS2=contagens[ks2];resultante+=(rawS2!==undefined&&rawS2!=='')?(parseInt(rawS2)||0):m.semLote;}
      novosLotes.forEach(function(nl){if(nl.medId===m.id)resultante+=(parseInt(nl.qty)||0);});
      var batch=db.batch();
      itens.forEach(function(it){
        var ref=db.collection('entries').doc();
        var obs='Ajuste de conferência ('+todayStr()+'): '+m.nome+(it.novo?' — lote novo':'')+' (era '+it.sistema+', passou a '+it.contado+')';
        batch.set(ref,{medicamentoId:m.id,medicamentoNome:m.nome,tipo:it.diff>0?'entrada':'saida',quantidade:Math.abs(it.diff),lote:it.lote||'',validade:it.validade||'',observacao:obs,isAjuste:true,origemConferencia:true,divergenciaTipo:'conferencia',conferencia:todayStr(),conferenciaCat:m.cat,criadoEm:now,date:todayStr(),autorId:user.uid||'',autorNome:user.name,autorCargo:user.role||'',autorColor:user.color||B});
      });
      batch.commit().then(function(){
        // limpa a contagem deste medicamento no doc (já aplicada) — não some da lista, só zera os campos
        var del=firebase.firestore.FieldValue.delete();var upd={};
        medKeys(m).forEach(function(k){if(contagens[k]!==undefined){upd['contagens.'+k]=del;upd['contadoPor.'+k]=del;}});
        var nlKeep=novosLotes.filter(function(nl){return nl.medId!==m.id;});
        var rcKeep=recontagens.filter(function(rc){return (rc.key||'').split('--')[0]!==m.id;});
        if(nlKeep.length!==novosLotes.length)upd['novosLotes']=nlKeep;
        if(rcKeep.length!==recontagens.length)upd['recontagens']=rcKeep;
        upd['confirmados.'+m.id]={em:now,por:user.name};// marca como aplicado (mantém o ✅ verde)
        upd['atualizadoEm']=now;upd['atualizadoPor']=user.name;
        return docRef().update(upd);
      }).then(function(){
        // se o medicamento zerou, apaga lote/validade do cadastro (best-effort)
        var rawm=medById[m.id]||{};
        if(resultante===0&&(rawm.loteAtual||rawm.validadeAtual))db.collection('medicamentos').doc(m.id).update({loteAtual:'',validadeAtual:''}).catch(function(){});
        setContagens(function(p){var n=Object.assign({},p);medKeys(m).forEach(function(k){delete n[k];});return n;});
        setContadoPor(function(p){var n=Object.assign({},p);medKeys(m).forEach(function(k){delete n[k];});return n;});
        setNovosLotes(function(p){return p.filter(function(nl){return nl.medId!==m.id;});});
        setRecontagens(function(p){return p.filter(function(rc){return (rc.key||'').split('--')[0]!==m.id;});});
        setConfirmados(function(p){var n=Object.assign({},p);n[m.id]={em:now,por:user.name};return n;});
        setConfMedId(null);setErro('');
        mostrarToast('✅ '+m.nome+' — contagem aplicada no estoque');
      }).catch(falhou);
    }catch(e){falhou(e);}
  }

  // Computa lotes por medicamento (mesma lógica da aba Estoque)
  var medList=useMemo(function(){
    return medications.map(function(m){
      var me=entries.filter(function(e){return e.medicamentoId===m.id&&e.tipo==='entrada'&&e.lote;});
      var loteMap={};me.forEach(function(e){if(!e.lote)return;var lk=e.lote;if(!loteMap[lk])loteMap[lk]={lote:e.lote,validade:e.validade||'',entrada:0,saida:0};loteMap[lk].entrada+=(e.quantidade||0);if(e.validade&&!loteMap[lk].validade)loteMap[lk].validade=e.validade;});
      var saidas=entries.filter(function(e){return e.medicamentoId===m.id&&e.tipo==='saida'&&e.lote;});
      saidas.forEach(function(e){var lk=e.lote;if(loteMap[lk])loteMap[lk].saida+=(e.quantidade||0);});
      var lotes=Object.keys(loteMap).map(function(k){var l=loteMap[k];return {lote:l.lote,validade:l.validade,qty:Math.max(0,l.entrada-l.saida)};}).filter(function(l){return l.qty>0;});
      var est=stock[m.id]||0;
      var totalLotado=lotes.reduce(function(s,l){return s+l.qty;},0);
      var semLote=Math.max(0,est-totalLotado);
      return {id:m.id,nome:m.nome,cat:m.categoria||'medicamento',est:est,lotes:lotes,semLote:semLote};
    });
  },[medications,entries,stock]);

  function medKeys(m){var ks=[];m.lotes.forEach(function(l){ks.push(confKey(m.id,l.lote,l.validade));});if(m.semLote>0)ks.push(confKey(m.id,'__SEMLOTE__',''));return ks;}
  function medConferido(m){
    var ks=medKeys(m);
    for(var i=0;i<ks.length;i++){if(contagens[ks[i]]!==undefined&&contagens[ks[i]]!=='')return true;}
    for(var j=0;j<novosLotes.length;j++){if(novosLotes[j].medId===m.id)return true;}
    return false;
  }
  // "Verde": conferido (contagem em aberto) OU já confirmado/aplicado nesta conferência — mantém o ✅ visual.
  function medVerde(m){return medConferido(m)||!!confirmados[m.id];}

  // Resumo de divergências: compara contado x sistema, lote a lote (só o que foi contado)
  var resumo=useMemo(function(){
    var catById={};medList.forEach(function(m){catById[m.id]=m.cat;});
    var itens=[];
    medList.forEach(function(m){
      m.lotes.forEach(function(l){
        var key=confKey(m.id,l.lote,l.validade);var raw=contagens[key];
        if(raw===undefined||raw==='')return;
        var contado=parseInt(raw)||0;var rc=recByKey[key]?recByKey[key].total:0;
        itens.push({medId:m.id,medNome:m.nome,cat:m.cat,lote:l.lote,validade:l.validade,sistema:l.qty,contado:contado,diff:contado-l.qty,novo:false,semLote:false,recontagem:rc});
      });
      if(m.semLote>0){
        var keyS=confKey(m.id,'__SEMLOTE__','');var rawS=contagens[keyS];
        if(rawS!==undefined&&rawS!==''){var contadoS=parseInt(rawS)||0;var rcS=recByKey[keyS]?recByKey[keyS].total:0;itens.push({medId:m.id,medNome:m.nome,cat:m.cat,lote:'',validade:'',sistema:m.semLote,contado:contadoS,diff:contadoS-m.semLote,novo:false,semLote:true,recontagem:rcS});}
      }
    });
    novosLotes.forEach(function(nl){
      itens.push({medId:nl.medId,medNome:nl.medNome,cat:catById[nl.medId]||'medicamento',lote:nl.lote,validade:nl.validade||'',sistema:0,contado:nl.qty,diff:nl.qty,novo:true,semLote:false,recontagem:0});
    });
    // divergências primeiro, depois por nome
    itens.sort(function(a,b){var da=a.diff===0?1:0,db2=b.diff===0?1:0;if(da!==db2)return da-db2;return a.medNome.localeCompare(b.medNome);});
    var ajustes=itens.filter(function(i){return i.diff!==0;});
    return {itens:itens,total:itens.length,bateram:itens.length-ajustes.length,divergiram:ajustes.length,ajustes:ajustes};
  },[medList,contagens,novosLotes,recByKey]);

  function aplicarAjustes(){
    var lista=resumo.ajustes;
    if(lista.length===0){setShowResumo(false);return;}
    setAplicando(true);
    var now=new Date().toISOString();
    var batch=db.batch();
    lista.forEach(function(it){
      var ref=db.collection('entries').doc();
      // observação com "balanç" e "(era X, passou a Y)" + isAjuste => fora do ranking (ver _ehSaidaNaoReal)
      var obs='Balanço (conferência '+todayStr()+'): '+(it.novo?'lote novo encontrado — ':'')+'(era '+it.sistema+', passou a '+it.contado+')'+(it.recontagem>0?' — inclui '+it.recontagem+' un. encontrada(s) em recontagem':'');
      batch.set(ref,{
        medicamentoId:it.medId,medicamentoNome:it.medNome,
        tipo:it.diff>0?'entrada':'saida',quantidade:Math.abs(it.diff),
        lote:it.lote||'',validade:it.validade||'',
        observacao:obs,isAjuste:true,conferencia:todayStr(),
        criadoEm:now,date:todayStr(),
        autorId:user.uid||'',autorNome:user.name,autorCargo:user.role||'',autorColor:user.color||B
      });
    });
    batch.commit().then(function(){
      // Zera a conferência ativa: os ajustes já corrigiram o estoque (evita reaplicar lotes novos)
      return docRef().set({contagens:{},contadoPor:{},novosLotes:[],aplicadoEm:now,aplicadoPor:user.name,atualizadoEm:now,atualizadoPor:user.name});
    }).then(function(){
      // Só limpa o estado local após a gravação confirmar no banco
      setContagens({});setNovosLotes([]);setContadoPor({});setRecontagens([]);pendingRef.current={};
      setAplicando(false);setShowResumo(false);setErro('');
      alert('✅ '+lista.length+' ajuste(s) de estoque aplicado(s). Estoque atualizado.');
    }).catch(function(e){setAplicando(false);erroEscrita(e);alert('Erro ao aplicar ajustes: '+e.message+'\n\nNenhuma alteração foi confirmada. Verifique as permissões do Firestore.');});
  }

  // Finaliza APENAS a categoria ativa: aplica os ajustes dela, marca como finalizada e limpa só as contagens dessa categoria.
  function aplicarAjustesCategoria(){
    var cat=catAtiva;if(!cat)return;
    setAplicando(true);
    // Qualquer falha (síncrona ou na gravação) precisa DESTRAVAR o botão (senão fica "Finalizando..." pra sempre).
    var falhou=function(e){setAplicando(false);erroEscrita(e);try{alert('Erro ao finalizar a categoria: '+((e&&e.message)?e.message:e)+'\n\nVerifique as permissões do Firestore e tente de novo.');}catch(_){}};
    try{
      var lista=resumo.ajustes.filter(function(it){return it.cat===cat;});
      var now=new Date().toISOString();
      var catLabel=TIPOS[cat]?TIPOS[cat].label:cat;
      var catMedIds={};medList.forEach(function(m){if(m.cat===cat)catMedIds[m.id]=1;});
      // Medicamentos cujo saldo final ficou 0 -> apagar lote/validade do cadastro (best-effort, fora do batch).
      var zerar=[];
      medList.filter(function(m){return m.cat===cat;}).forEach(function(m){
        if(!medConferido(m))return;
        var resultante=0;
        m.lotes.forEach(function(l){var k=confKey(m.id,l.lote,l.validade);var raw=contagens[k];resultante+=(raw!==undefined&&raw!=='')?(parseInt(raw)||0):l.qty;});
        if(m.semLote>0){var ks=confKey(m.id,'__SEMLOTE__','');var rawS=contagens[ks];resultante+=(rawS!==undefined&&rawS!=='')?(parseInt(rawS)||0):m.semLote;}
        novosLotes.forEach(function(nl){if(nl.medId===m.id)resultante+=(parseInt(nl.qty)||0);});
        var rawm=medById[m.id]||{};
        if(resultante===0&&(rawm.loteAtual||rawm.validadeAtual))zerar.push(m.id);
      });
      // 1) Ajustes de estoque (entries novos) — sempre funcionam (são criações).
      var batch=db.batch();
      lista.forEach(function(it){
        var ref=db.collection('entries').doc();
        var obs='Balanço (conferência '+todayStr()+' · '+catLabel+'): '+(it.novo?'lote novo encontrado — ':'')+'(era '+it.sistema+', passou a '+it.contado+')'+(it.recontagem>0?' — inclui '+it.recontagem+' un. encontrada(s) em recontagem':'');
        batch.set(ref,{medicamentoId:it.medId,medicamentoNome:it.medNome,tipo:it.diff>0?'entrada':'saida',quantidade:Math.abs(it.diff),lote:it.lote||'',validade:it.validade||'',observacao:obs,isAjuste:true,origemConferencia:true,divergenciaTipo:'conferencia',conferencia:todayStr(),conferenciaCat:cat,criadoEm:now,date:todayStr(),autorId:user.uid||'',autorNome:user.name,autorCargo:user.role||'',autorColor:user.color||B});
      });
      batch.commit().then(function(){
        // 2) Marca a categoria como finalizada (set+merge cria o doc se preciso e mescla finalizadas de outras categorias).
        var finMap={};finMap[cat]={em:now,por:user.name,ajustes:lista.length};
        return docRef().set({finalizadas:finMap,atualizadoEm:now,atualizadoPor:user.name},{merge:true});
      }).then(function(){
        // 3) Limpa só as contagens/lotes/recontagens desta categoria (doc já existe -> update seguro).
        var del=firebase.firestore.FieldValue.delete();var upd={};
        Object.keys(contagens).forEach(function(k){if(catMedIds[k.split('--')[0]]){upd['contagens.'+k]=del;upd['contadoPor.'+k]=del;}});
        var nlKeep=novosLotes.filter(function(nl){return !catMedIds[nl.medId];});
        var rcKeep=recontagens.filter(function(rc){return !catMedIds[(rc.key||'').split('--')[0]];});
        if(nlKeep.length!==novosLotes.length)upd['novosLotes']=nlKeep;
        if(rcKeep.length!==recontagens.length)upd['recontagens']=rcKeep;
        if(Object.keys(upd).length){upd['atualizadoEm']=now;upd['atualizadoPor']=user.name;return docRef().update(upd);}
      }).then(function(){
        // 4) Best-effort: apaga lote/validade do cadastro dos medicamentos zerados (não trava a finalização se falhar).
        zerar.forEach(function(mid){db.collection('medicamentos').doc(mid).update({loteAtual:'',validadeAtual:''}).catch(function(){});});
        setContagens(function(p){var n=Object.assign({},p);Object.keys(n).forEach(function(k){if(catMedIds[k.split('--')[0]])delete n[k];});return n;});
        setContadoPor(function(p){var n=Object.assign({},p);Object.keys(n).forEach(function(k){if(catMedIds[k.split('--')[0]])delete n[k];});return n;});
        setNovosLotes(function(p){return p.filter(function(nl){return !catMedIds[nl.medId];});});
        setRecontagens(function(p){return p.filter(function(rc){return !catMedIds[(rc.key||'').split('--')[0]];});});
        setFinalizadas(function(p){var n=Object.assign({},p);n[cat]={em:now,por:user.name,ajustes:lista.length};return n;});
        setAplicando(false);setShowResumo(false);setErro('');setCatAtiva(null);
        alert('✅ Categoria "'+catLabel+'" finalizada. '+lista.length+' ajuste(s) de estoque aplicado(s).'+(zerar.length>0?'\n🏷️ '+zerar.length+' medicamento(s) zerado(s): lote e validade apagados do cadastro.':''));
      }).catch(falhou);
    }catch(e){falhou(e);}
  }

  var buscaLc=busca.trim().toLowerCase();
  // Na conferência por categoria, só entram os medicamentos da categoria ativa (vazio na tela de seleção).
  var medListVis=catAtiva?medList.filter(function(m){return (m.cat||'medicamento')===catAtiva;}):[];
  var filtrada=buscaLc?medListVis.filter(function(m){return m.nome.toLowerCase().indexOf(buscaLc)>=0;}):medListVis;
  var totalItens=filtrada.length;
  var conferidos=filtrada.filter(medVerde).length;
  var pct=totalItens>0?Math.round((conferidos/totalItens)*100):0;

  var cats=Object.keys(TIPOS);
  var grupos=cats.map(function(cat){return {cat:cat,meds:filtrada.filter(function(m){return (m.cat||'medicamento')===cat;}).sort(function(a,b){return a.nome.localeCompare(b.nome);})};}).filter(function(g){return g.meds.length>0;});

  // Progresso por categoria (sobre todos os medicamentos, não filtrado pela busca)
  var catStats={};cats.forEach(function(c){catStats[c]={total:0,conf:0};});
  medList.forEach(function(m){var c=m.cat||'medicamento';if(!catStats[c])catStats[c]={total:0,conf:0};catStats[c].total++;if(medVerde(m))catStats[c].conf++;});
  // Resumo restrito à categoria ativa (para o modal e o botão "Finalizar categoria")
  var resumoCat=(function(){
    if(!catAtiva)return resumo;
    var itens=resumo.itens.filter(function(it){return it.cat===catAtiva;});
    var ajustes=itens.filter(function(i){return i.diff!==0;});
    return {itens:itens,total:itens.length,bateram:itens.length-ajustes.length,divergiram:ajustes.length,ajustes:ajustes};
  })();
  // Status de cada categoria para a tela de seleção
  function catStatus(cat){if(finalizadas[cat])return'finalizada';var st=catStats[cat]||{conf:0,total:0};return st.conf>0?'andamento':'nova';}
  var catsDisponiveis=cats.filter(function(c){return (catStats[c]&&catStats[c].total>0);});
  // Participantes online (heartbeat < 45s) e quem está em cada categoria
  var agoraMs=Date.now();
  var online=Object.keys(participantes).map(function(uid){return Object.assign({uid:uid},participantes[uid]);}).filter(function(p){return p.em&&(agoraMs-new Date(p.em).getTime())<45000;}).sort(function(a,b){return (a.entrou||'').localeCompare(b.entrou||'');});
  var donoCat={};online.forEach(function(p){if(p.cat){if(!donoCat[p.cat])donoCat[p.cat]=[];donoCat[p.cat].push(p);}});
  var meuP=participantes[user.uid];var minhaCat=meuP?(meuP.cat||null):null;
  var catsComMeds=grupos.map(function(g){return g.cat;});
  function pegarCategoria(){
    var ocupadas={};online.forEach(function(p){if(p.uid!==user.uid&&p.cat)ocupadas[p.cat]=true;});
    var livres=catsComMeds.filter(function(c){return !ocupadas[c];});
    var pref=livres.filter(function(c){return (catStats[c]?catStats[c].conf:0)<(catStats[c]?catStats[c].total:0);});// não concluídas primeiro
    var escolha=pref[0]||livres[0]||catsComMeds[0];
    if(!escolha){setErro('Nenhuma categoria com itens para distribuir.');return;}
    definirMinhaCat(escolha);
  }
  function escolherCategoria(cat){
    var outros=(donoCat[cat]||[]).filter(function(p){return p.uid!==user.uid;});
    if(outros.length>0&&!confirm(outros[0].nome+' já está contando '+(TIPOS[cat]?TIPOS[cat].label:cat)+'. Quer contar junto mesmo assim?'))return;
    definirMinhaCat(cat);
  }

  // Renderiza uma linha de lote com campo de contagem, histórico de recontagem e botão "Achei mais"
  function loteRow(o){
    var key=o.key;var val=contagens[key];var cont=val===undefined?'':val;
    var diff=cont!==''?(parseInt(cont)||0)-o.sistema:null;
    var rc=recByKey[key];var jaContado=cont!=='';
    var por=contadoPor[key];var porOutro=jaContado&&por&&por.nome&&por.nome!==user.name;
    return(<div key={key} style={{padding:'8px 0',borderTop:o.topBorder?'1px solid #F1F5F9':'none'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:12,fontWeight:700,color:'#334155'}}>{o.titulo}</div>
          <div style={{fontSize:10,color:'#94A3B8'}}>{o.sub}{!cega&&' · sistema: '+o.sistema+' un.'}{!cega&&diff!==null&&diff!==0&&<span style={{color:diff>0?'#0C6B3E':'#DC2626',fontWeight:700}}>{' · '+(diff>0?'+':'')+diff}</span>}</div>
          {jaContado&&por&&por.nome&&<div style={{fontSize:9,color:porOutro?'#B45309':'#94A3B8',fontWeight:porOutro?700:400}}>✍️ {por.nome}{por.em?' · '+fmtT(por.em):''}</div>}
        </div>
        <input data-tour={o.tourMark?'conf-contagem':undefined} value={cont} onChange={function(e){onCount(key,e.target.value);}} inputMode="numeric" placeholder="0" style={{width:66,padding:'8px 6px',border:'1.5px solid '+(cont!==''?'#1351B4':'#CBD5E1'),borderRadius:8,fontSize:16,fontWeight:700,textAlign:'center',outline:'none'}}/>
      </div>
      {rc&&rc.total>0&&<div style={{marginTop:6,background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:8,padding:'6px 9px'}}>
        {rc.list.map(function(r,ri){return(<div key={ri} style={{fontSize:10,color:'#92400E'}}>🔎 +{r.qty} un. em recontagem · {r.por}{r.em?' · '+fmtD(r.em)+' '+fmtT(r.em):''}</div>);})}
      </div>}
      {jaContado&&(acheiForm===key
        ?<div style={{marginTop:6,display:'flex',gap:8,alignItems:'center'}}>
          <input value={acheiQty} onChange={function(e){setAcheiQty(e.target.value.replace(/[^0-9]/g,''));}} inputMode="numeric" placeholder="Qtd encontrada" style={{flex:1,padding:'8px',borderRadius:7,border:'1.5px solid #F59E0B',fontSize:14,fontWeight:700,textAlign:'center',boxSizing:'border-box'}}/>
          <button onClick={function(){setAcheiForm(null);setAcheiQty('');}} style={{padding:'8px 10px',background:'#F1F5F9',border:'none',borderRadius:7,fontSize:12,fontWeight:600,cursor:'pointer'}}>✕</button>
          <button onClick={function(){acheiMais(key,o.med,o.lote,o.validade);}} style={{padding:'8px 12px',background:'#F59E0B',border:'none',borderRadius:7,color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer'}}>+ Somar</button>
        </div>
        :<button onClick={function(){setAcheiForm(key);setAcheiQty('');}} style={{marginTop:6,background:'none',border:'none',color:'#B45309',fontSize:11,fontWeight:700,cursor:'pointer',padding:'2px 0'}}>🔎 Achei mais</button>
      )}
    </div>);
  }

  return(<div style={{maxWidth:700,margin:'0 auto',padding:'16px 14px'}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,marginBottom:12}}>
      <div>
        <div style={{fontWeight:800,fontSize:18,color:'#1E293B'}}>🧾 Conferência de Estoque</div>
        <div style={{fontSize:11,color:'#94A3B8'}}>Contagem física · {todayStr().split('-').reverse().join('/')}</div>
      </div>
      <button onClick={toggleCega} style={{display:'flex',alignItems:'center',gap:6,background:cega?'#1351B4':'#F1F5F9',border:'1.5px solid '+(cega?'#1351B4':'#E2E8F0'),borderRadius:20,padding:'7px 12px',cursor:'pointer'}}>
        <span style={{fontSize:14}}>{cega?'🙈':'👁️'}</span>
        <span style={{fontSize:11,fontWeight:700,color:cega?'#fff':'#64748B'}}>Às cegas</span>
      </button>
    </div>

    {erro&&<div style={{background:'#FEF2F2',border:'1.5px solid #FECACA',borderRadius:12,padding:'11px 14px',marginBottom:12,display:'flex',alignItems:'flex-start',gap:8}}>
      <span style={{fontSize:15,lineHeight:1.3}}>🚫</span>
      <div style={{flex:1,fontSize:12,color:'#991B1B',lineHeight:1.5}}>{erro}</div>
      <button onClick={function(){setErro('');}} style={{background:'none',border:'none',color:'#991B1B',cursor:'pointer',fontSize:15,lineHeight:1,padding:0}}>✕</button>
    </div>}

    {movAviso&&<div style={{background:'#EFF6FF',border:'1.5px solid #BFDBFE',borderRadius:12,padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:8}}>
      <span style={{fontSize:15}}>🔄</span>
      <div style={{flex:1,fontSize:12,color:'#1E40AF',lineHeight:1.4}}>Houve novas movimentações no estoque agora. Os valores do <strong>sistema</strong> já foram atualizados automaticamente — confira se alguma contagem mudou.</div>
      <button onClick={function(){setMovAviso(false);}} style={{background:'none',border:'none',color:'#1E40AF',cursor:'pointer',fontSize:15,lineHeight:1,padding:0}}>✕</button>
    </div>}

    {toast&&<div style={{position:'fixed',top:14,left:'50%',transform:'translateX(-50%)',zIndex:12000,background:'#0C6B3E',color:'#fff',borderRadius:12,padding:'11px 18px',fontSize:13,fontWeight:700,boxShadow:'0 8px 28px rgba(12,107,62,0.35)',maxWidth:'92vw',textAlign:'center'}}>{toast}</div>}

    {/* Painel de colaboração — equipe na conferência e distribuição de categorias */}
    <div style={{background:'#fff',borderRadius:14,padding:'12px 14px',marginBottom:14,border:'1.5px solid #E2E8F0'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <span style={{fontSize:13,fontWeight:800,color:'#1E293B'}}>👥 Equipe na conferência ({online.length})</span>
        {catAtiva
          ?<button onClick={function(){setCatAtiva(null);}} style={{background:'#EFF6FF',border:'1px solid #BFDBFE',borderRadius:8,padding:'5px 10px',fontSize:11,fontWeight:700,color:'#1351B4',cursor:'pointer'}}>← Trocar categoria</button>
          :<span style={{fontSize:11,color:'#94A3B8'}}>Escolha uma categoria abaixo</span>
        }
      </div>
      {online.length===0&&<div style={{fontSize:11,color:'#94A3B8'}}>Ninguém online no momento.</div>}
      {online.map(function(p){
        var isMe=p.uid===user.uid;var ct=p.cat?catStats[p.cat]:null;var tl=p.cat&&TIPOS[p.cat]?TIPOS[p.cat].label:null;
        return(<div key={p.uid} style={{display:'flex',alignItems:'center',gap:9,padding:'6px 0'}}>
          <div style={{width:26,height:26,borderRadius:'50%',background:p.cor||'#1351B4',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:'#fff',flexShrink:0}}>{p.nome?p.nome.charAt(0).toUpperCase():'?'}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:12,fontWeight:700,color:'#1E293B'}}>{p.nome}{isMe?' (você)':''} <span style={{color:'#22C55E',fontSize:9}}>●</span></div>
            <div style={{fontSize:10,color:p.cat?'#475569':'#94A3B8'}}>{p.cat?(tl+': '+(ct?ct.conf:0)+' de '+(ct?ct.total:0)):'escolhendo categoria...'}</div>
          </div>
          {p.cat&&<span style={{fontSize:15}}>{TIPOS[p.cat]?TIPOS[p.cat].icon:''}</span>}
        </div>);
      })}
      <div style={{fontSize:10,color:'#94A3B8',marginTop:8,lineHeight:1.5,borderTop:'1px solid #F1F5F9',paddingTop:8}}>💡 Cada contagem é salva por item, em tempo real. Se duas pessoas contarem o mesmo item, vale a última — o app registra quem contou.</div>
    </div>

    {/* ===== TELA DE SELEÇÃO DE CATEGORIA (mini-conferências independentes) ===== */}
    {!catAtiva&&<div data-tour="conf-categorias" style={{marginBottom:14}}>
      <div style={{fontWeight:800,fontSize:15,color:'#1E293B',marginBottom:4}}>Escolha uma categoria para conferir</div>
      <div style={{fontSize:12,color:'#94A3B8',marginBottom:12}}>Cada categoria é uma conferência independente. Você confere e finaliza uma de cada vez.</div>
      {catsDisponiveis.length===0&&<div style={{textAlign:'center',padding:28,color:'#94A3B8',fontSize:13}}>Nenhum medicamento cadastrado para conferir.</div>}
      {catsDisponiveis.map(function(c,ci){
        var t=TIPOS[c]||TIPOS.medicamento;var cor=CCOR[c]||'#1351B4';var st=catStats[c]||{conf:0,total:0};
        var status=catStatus(c);var fin=finalizadas[c];
        return(<button key={c} data-tour={ci===0?'conf-primeira-cat':undefined} onClick={function(){setCatAtiva(c);definirMinhaCat(c);}} style={{width:'100%',display:'flex',alignItems:'center',gap:12,textAlign:'left',background:'#fff',border:'1.5px solid '+(status==='finalizada'?'#BBF7D0':status==='andamento'?'#FDE68A':'#E2E8F0'),borderLeft:'5px solid '+cor,borderRadius:12,padding:'12px 14px',marginBottom:8,cursor:'pointer'}}>
          <span style={{fontSize:24}}>{t.icon}</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:800,fontSize:14,color:'#1E293B'}}>{t.label}</div>
            <div style={{fontSize:11,color:'#64748B',marginTop:2}}>{st.total} medicamento(s){status!=='nova'?' · '+st.conf+' conferido(s)':''}{fin&&fin.por?' · por '+fin.por:''}</div>
          </div>
          <span style={{fontSize:11,fontWeight:800,padding:'4px 10px',borderRadius:20,whiteSpace:'nowrap',color:status==='finalizada'?'#0C6B3E':status==='andamento'?'#B45309':'#64748B',background:status==='finalizada'?'#DCFCE7':status==='andamento'?'#FEF3C7':'#F1F5F9'}}>{status==='finalizada'?'✓ Finalizada':status==='andamento'?'Em andamento':'Iniciar'}</span>
        </button>);
      })}
    </div>}

    {catAtiva&&<div style={{background:CCOR[catAtiva]+'12',border:'1.5px solid '+CCOR[catAtiva]+'40',borderRadius:12,padding:'10px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:10}}>
      <span style={{fontSize:20}}>{(TIPOS[catAtiva]||TIPOS.medicamento).icon}</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:800,color:'#1E293B'}}>Conferindo: {(TIPOS[catAtiva]||TIPOS.medicamento).label}</div>
        {finalizadas[catAtiva]&&<div style={{fontSize:11,color:'#0C6B3E',fontWeight:600}}>✓ Já finalizada hoje{finalizadas[catAtiva].por?' por '+finalizadas[catAtiva].por:''} — recontar gera nova finalização.</div>}
      </div>
      <button onClick={function(){setCatAtiva(null);}} style={{flexShrink:0,background:'#fff',border:'1.5px solid '+CCOR[catAtiva]+'55',borderRadius:8,padding:'7px 12px',fontSize:12,fontWeight:700,color:CCOR[catAtiva],cursor:'pointer'}}>← Trocar</button>
    </div>}

    {/* Barra de progresso */}
    {catAtiva&&<React.Fragment>
    <div style={{background:'#fff',borderRadius:14,padding:'14px 16px',marginBottom:14,border:'1.5px solid #E2E8F0'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:8}}>
        <span style={{fontSize:13,fontWeight:700,color:'#1E293B'}}>{conferidos} de {totalItens} itens conferidos</span>
        <span style={{fontSize:13,fontWeight:800,color:pct===100&&totalItens>0?'#0C6B3E':'#1351B4'}}>{pct}%</span>
      </div>
      <div style={{height:10,background:'#F1F5F9',borderRadius:99,overflow:'hidden'}}>
        <div style={{height:'100%',width:pct+'%',background:pct===100&&totalItens>0?'linear-gradient(90deg,#0C6B3E,#22C55E)':'linear-gradient(90deg,#1351B4,#3B82F6)',borderRadius:99,transition:'width .3s ease'}}/>
      </div>
      <button data-tour="conf-finalizar" onClick={function(){setShowResumo(true);}} disabled={resumoCat.total===0} style={{marginTop:12,width:'100%',padding:'11px',background:resumoCat.total===0?'#E2E8F0':'#0C6B3E',border:'none',borderRadius:10,color:resumoCat.total===0?'#94A3B8':'#fff',fontWeight:700,fontSize:13,cursor:resumoCat.total===0?'default':'pointer'}}>✅ Finalizar categoria{resumoCat.divergiram>0?' — '+resumoCat.divergiram+' diverg.':''}</button>
    </div>

    <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
      <input value={busca} onChange={function(e){setBusca(e.target.value);}} placeholder="🔍 Buscar medicamento..." className="inp" style={{marginBottom:0,flex:1,minWidth:180}}/>
      <button onClick={abrirCadastro} style={{whiteSpace:'nowrap',padding:'0 14px',background:'#0C6B3E',border:'none',borderRadius:10,color:'#fff',fontWeight:700,fontSize:13,cursor:'pointer'}}>+ Cadastrar medicamento</button>
    </div>

    {grupos.length===0&&<div style={{textAlign:'center',padding:32,color:'#94A3B8',fontSize:13}}>Nenhum medicamento encontrado.</div>}

    {grupos.map(function(g){
      var t=TIPOS[g.cat]||TIPOS.medicamento;var cor=CCOR[g.cat]||'#1351B4';
      var confCat=g.meds.filter(medVerde).length;
      var open=catAberta[g.cat];
      var donos=donoCat[g.cat]||[];var euAqui=g.cat===minhaCat;
      return(<div key={g.cat} style={{marginBottom:12}}>
        <button onClick={function(){setCatAberta(function(p){var n=Object.assign({},p);n[g.cat]=!open;return n;});}} style={{width:'100%',display:'flex',alignItems:'center',gap:10,background:cor,border:euAqui?'2px solid #FBBF24':'none',borderRadius:open?'12px 12px 0 0':'12px',padding:'11px 14px',cursor:'pointer',textAlign:'left'}}>
          <span style={{fontSize:19}}>{t.icon}</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:700,fontSize:14,color:'#fff'}}>{t.label}</div>
            {donos.length>0&&<div style={{fontSize:10,color:'rgba(255,255,255,.9)',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>👤 {donos.map(function(p){return p.uid===user.uid?'você':p.nome;}).join(', ')}</div>}
          </div>
          <span style={{fontSize:11,fontWeight:700,color:'#fff',background:'rgba(255,255,255,.22)',borderRadius:99,padding:'2px 9px'}}>{confCat}/{g.meds.length}</span>
          <span style={{fontSize:13,color:'#fff'}}>{open?'▲':'▼'}</span>
        </button>
        {open&&<div style={{border:'1.5px solid '+cor,borderTop:'none',borderRadius:'0 0 12px 12px',padding:'8px',background:'#F8FAFC'}}>
          {g.meds.map(function(m,mi){
            var conf=medVerde(m);var exp=abertos[m.id];var aplicado=!!confirmados[m.id]&&!medConferido(m);
            var nlDoMed=novosLotes.filter(function(x){return x.medId===m.id;});
            return(<div key={m.id} style={{marginBottom:6,background:aplicado?'#F0FDF4':'#fff',borderRadius:10,border:'1.5px solid '+(aplicado?'#86EFAC':conf?'#BBF7D0':'#E2E8F0'),overflow:'hidden'}}>
              <div style={{display:'flex',alignItems:'stretch'}}>
                <button data-tour={mi===0?'conf-primeiro-med':undefined} onClick={function(){setAbertos(function(p){var n=Object.assign({},p);n[m.id]=!exp;return n;});}} style={{flex:1,minWidth:0,display:'flex',alignItems:'center',gap:10,background:'none',border:'none',padding:'11px 12px',cursor:'pointer',textAlign:'left'}}>
                  <span style={{fontSize:16}}>{conf?'✅':'⬜'}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:13,color:aplicado?'#065F46':'#1E293B',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{m.nome}</div>
                    {aplicado
                      ?<div style={{fontSize:10,color:'#059669',fontWeight:700}}>✓ contagem aplicada no estoque</div>
                      :<div style={{fontSize:10,color:'#94A3B8'}}>{m.lotes.length+(m.semLote>0?1:0)} lote(s){!cega&&' · sistema: '+m.est+' un.'}</div>
                    }
                  </div>
                  <span style={{fontSize:13,color:'#94A3B8'}}>{exp?'▲':'▼'}</span>
                </button>
                {podeGerir&&<button onClick={function(){abrirRename(m);}} title="Renomear medicamento" style={{flexShrink:0,alignSelf:'center',background:'#EFF6FF',color:'#1351B4',border:'none',borderRadius:8,padding:'6px 9px',fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>✏️</button>}
                {podeGerir&&<button onClick={function(){excluirMed(m);}} title="Excluir do cadastro" style={{flexShrink:0,alignSelf:'center',marginLeft:6,marginRight:8,background:delMedId===m.id?'#DC2626':'#FEE2E2',color:delMedId===m.id?'#fff':'#DC2626',border:'none',borderRadius:8,padding:'6px 10px',fontSize:11,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>{delMedId===m.id?'Confirmar?':'🗑'}</button>}
              </div>
              {podeGerir&&renId===m.id&&<div style={{background:'#EFF6FF',borderTop:'1px solid #BFDBFE',padding:'10px 12px'}}>
                <div style={{fontSize:11,fontWeight:700,color:'#1351B4',marginBottom:6}}>✏️ Renomear no cadastro</div>
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  <input value={renNome} onChange={function(e){setRenNome(e.target.value);}} placeholder="Novo nome" style={{flex:1,minWidth:0,padding:'8px 10px',borderRadius:8,border:'1.5px solid #BFDBFE',fontSize:13,boxSizing:'border-box'}}/>
                  <button onClick={function(){setRenId(null);}} style={{flexShrink:0,background:'#F1F5F9',border:'none',borderRadius:7,padding:'8px 10px',fontSize:12,fontWeight:600,cursor:'pointer',color:'#64748B'}}>✕</button>
                  <button onClick={function(){salvarRename(m);}} disabled={renSaving||!renNome.trim()} style={{flexShrink:0,background:(renSaving||!renNome.trim())?'#94A3B8':'#1351B4',border:'none',borderRadius:7,padding:'8px 12px',color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer'}}>{renSaving?'...':'Salvar'}</button>
                </div>
              </div>}

// Calcula a posição (fixed) do balão do tour a partir do retângulo do elemento destacado.
// Usa a porção VISÍVEL do elemento (interseção com a viewport) — não a altura bruta — para decidir
// "acima"/"abaixo": um elemento maior que a tela (ex.: a aba inteira, com scroll) antes fazia o balão
// ficar quase todo fora da viewport. Sem espaço em nenhum dos dois lados, cai pro centro da tela.
function _tourBalloonStyle(rect,posicao,vw,vh){
  var balloonW=Math.min(300,vw-32),gap=14,padE=12;
  if(!rect)return{left:'50%',top:'50%',transform:'translate(-50%,-50%)'};
  var visTop=Math.max(0,rect.top),visBottom=Math.min(vh,rect.top+rect.height);
  var pos=posicao||'abaixo';
  var podeAcima=visTop>=170,podeAbaixo=(visBottom+180)<=vh;
  if(pos==='abaixo'&&!podeAbaixo)pos=podeAcima?'acima':'centro';
  else if(pos==='acima'&&!podeAcima)pos=podeAbaixo?'abaixo':'centro';
  if(pos==='centro')return{left:'50%',top:'50%',transform:'translate(-50%,-50%)'};
  var cx=rect.left+rect.width/2;
  var clampX=Math.max(padE,Math.min(cx-balloonW/2,vw-balloonW-padE));
  if(pos==='acima')return{left:clampX,bottom:(vh-visTop+gap)};
  if(pos==='abaixo')return{left:clampX,top:(visBottom+gap)};
  if(pos==='esquerda')return{right:(vw-rect.left+gap),top:Math.max(padE,Math.min(visTop,vh-180))};
  return{left:(rect.left+rect.width+gap),top:Math.max(padE,Math.min(visTop,vh-180))};
}

// ===== Motor de tours guiados (tooltip/balão com destaque + overlay escurecido) =====
function TourEngine(props){
  var user=props.user;
  var _vistos=useState(null);var vistos=_vistos[0];var setVistos=_vistos[1]; // null = carregando
  var _ativos=useState(null);var ativos=_ativos[0];var setAtivos=_ativos[1]; // null = carregando
  var _local=useState([]);var localVistos=_local[0];var setLocalVistos=_local[1]; // marca instantânea (evita re-exibir no meio)
  var _tid=useState(null);var tourAtivoId=_tid[0];var setTourAtivoId=_tid[1];
  var _step=useState(0);var step=_step[0];var setStep=_step[1];
  var _rect=useState(null);var rect=_rect[0];var setRect=_rect[1];
  var _pronto=useState(-1);var pronto=_pronto[0];var setPronto=_pronto[1]; // índice do passo já preparado (ação concluída) e pronto p/ exibir

  // Executa cliques reais nos elementos de navegação (que já têm data-tour) para preparar a tela do passo
  function tourClicar(sel){var el=null;try{el=document.querySelector(sel);}catch(e){el=null;}if(el&&el.click)el.click();}
  function menuPanelAberto(){var p=document.querySelector('[data-tour="menu-panel"]');if(!p||!p.getBoundingClientRect)return false;var r=p.getBoundingClientRect();return r.left<window.innerWidth-20;}
  function executarAcao(acao){
    var lista=Array.isArray(acao)?acao:[acao];
    lista.forEach(function(a){
      if(!a||!a.tipo)return;
      if(a.tipo==='menu'){if(!menuPanelAberto())tourClicar('[data-tour="nav-menu"]');}
      else if(a.tipo==='aba'){tourClicar('[data-tour="nav-'+a.aba+'"]');}
      else if(a.tipo==='clicar'){tourClicar(a.seletor);}
    });
  }

  // Assina o doc do próprio usuário (tutoriaisVistos) e o config/tours (ativos)
  useEffect(function(){
    if(!user||!user.uid)return;
    var u1=db.collection('users').doc(user.uid).onSnapshot(function(s){var d=s.exists?s.data():{};setVistos(d.tutoriaisVistos||[]);},function(){setVistos([]);});
    var u2=db.collection('config').doc('tours').onSnapshot(function(s){var d=s.exists?s.data():{};setAtivos(d.ativos||{});},function(){setAtivos({});});
    return function(){try{u1();}catch(e){}try{u2();}catch(e){}};
  },[user&&user.uid]);

  var vistosAll=(vistos||[]).concat(localVistos);
  var carregado=vistos!==null&&ativos!==null;
  var pendentes=carregado?TOURS.filter(function(t){return ativos[t.id]&&vistosAll.indexOf(t.id)<0;}):[];
  var pendentesKey=pendentes.map(function(t){return t.id;}).join(',');

  // Trava um tour por vez: mantém o atual até concluir/pular; depois puxa o próximo pendente
  useEffect(function(){
    if(tourAtivoId){
      if(!pendentes.some(function(t){return t.id===tourAtivoId;})){setTourAtivoId(null);setStep(0);}
      return;
    }
    if(pendentes.length>0){setTourAtivoId(pendentes[0].id);setStep(0);}
  },[pendentesKey,tourAtivoId]);

  var tour=tourAtivoId?TOURS.find(function(t){return t.id===tourAtivoId;}):null;

  // Prepara o passo: (1) executa a ação, (2) espera ~500ms a tela renderizar, (3) mede o elemento e mostra o balão.
  // Depois segue medindo (resize/scroll/animações). Passos sem ação começam a medir imediatamente.
  useEffect(function(){
    if(!tour){setRect(null);setPronto(-1);return;}
    var passo=tour.passos[step];
    if(!passo){setRect(null);setPronto(-1);return;}
    var cancelado=false,iv=null,timer=null;
    setRect(null);setPronto(-1); // esconde o balão enquanto prepara
    function medir(){
      if(cancelado)return;
      var el=null;try{el=document.querySelector(passo.seletor);}catch(e){el=null;}
      if(el&&el.getBoundingClientRect){var r=el.getBoundingClientRect();if((r.width>0||r.height>0)&&r.bottom>0&&r.top<window.innerHeight){setRect({top:r.top,left:r.left,width:r.width,height:r.height});return;}}
      setRect(null); // ausente/oculto -> balão centralizado, sem recorte (fallback)
    }
    function iniciarMedicao(){
      if(cancelado)return;
      setPronto(step);
      medir();
      window.addEventListener('resize',medir);window.addEventListener('scroll',medir,true);
      iv=setInterval(medir,400);
    }
    if(passo.acao){
      try{executarAcao(passo.acao);}catch(e){}
      timer=setTimeout(iniciarMedicao,500); // aguarda a tela renderizar após a ação
    }else{
      iniciarMedicao();
    }
    return function(){cancelado=true;if(iv)clearInterval(iv);if(timer)clearTimeout(timer);window.removeEventListener('resize',medir);window.removeEventListener('scroll',medir,true);};
  },[tour&&tour.id,step]);

  if(!tour)return null;
  var passo=tour.passos[step];if(!passo)return null;
  var total=tour.passos.length;var ultimo=step>=total-1;

  function marcarVisto(){
    var id=tour.id;
    setLocalVistos(function(p){return p.indexOf(id)<0?p.concat([id]):p;});
    db.collection('users').doc(user.uid).set({tutoriaisVistos:firebase.firestore.FieldValue.arrayUnion(id)},{merge:true}).catch(function(){});
  }
  function proximo(){if(ultimo)marcarVisto();else setStep(step+1);}

  var vw=window.innerWidth,vh=window.innerHeight;
  var balloonW=Math.min(300,vw-32);
  var bStyle=_tourBalloonStyle(rect,passo.posicao,vw,vh);
  var balloon=Object.assign({position:'fixed',width:balloonW,background:'#fff',borderRadius:16,padding:16,boxShadow:'0 12px 40px rgba(0,0,0,0.35)',zIndex:20002,transition:'top .25s ease,left .25s ease,bottom .25s ease,right .25s ease'},bStyle);

  var preparando=pronto!==step; // ação em andamento / aguardando a tela renderizar
  return(<div>
    {/* Camada que bloqueia interação com o app durante o tour. Quando não há recorte, escurece tudo. */}
    <div style={{position:'fixed',inset:0,zIndex:20000,background:(rect&&!preparando)?'transparent':'rgba(15,23,42,0.72)'}}/>
    {/* Enquanto prepara (executa a ação e aguarda a tela), mostra só o overlay — o balão aparece depois. */}
    {!preparando&&<div>
      {/* Recorte (spotlight): box-shadow gigante escurece o resto e deixa o elemento visível */}
      {rect&&<div style={{position:'fixed',top:rect.top-6,left:rect.left-6,width:rect.width+12,height:rect.height+12,borderRadius:12,boxShadow:'0 0 0 9999px rgba(15,23,42,0.72)',border:'2px solid #3B82F6',zIndex:20001,pointerEvents:'none',transition:'all .3s cubic-bezier(.4,0,.2,1)'}}/>}
      <div style={balloon}>
        <div style={{fontSize:11,fontWeight:800,color:'#1351B4',marginBottom:6,textTransform:'uppercase',letterSpacing:'.02em'}}>{tour.titulo}</div>
        <div style={{fontSize:14,color:'#1E293B',lineHeight:1.5,marginBottom:14}}>{passo.texto}</div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10}}>
          <span style={{fontSize:11,color:'#94A3B8',fontWeight:700}}>Passo {step+1} de {total}</span>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <button onClick={marcarVisto} style={{background:'none',border:'none',color:'#94A3B8',fontSize:12,fontWeight:600,cursor:'pointer',padding:0}}>Pular tutorial</button>
            <button onClick={proximo} style={{background:'#1351B4',border:'none',borderRadius:10,padding:'9px 18px',color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer'}}>{ultimo?'Entendi':'Próximo'}</button>
          </div>
        </div>
      </div>
    </div>}
  </div>);
}

// ===== Módulo de Recebimento e Conciliação Fiscal =====
var _recSeq=0;var _nfSeq=0;var _pdfItSeq=0;

// Reconstrói as linhas VISUAIS de um PDF a partir do texto posicional do pdf.js. O pdf.js não devolve
// quebras de linha — cada página vira um monte de fragmentos de texto com coordenadas (transform[4]=x,
// transform[5]=y). Sem isso, uma tabela inteira virava UM parágrafo só e o regex de item nunca casava
// (era a causa raiz de "não lista os medicamentos"). Agrupamos por Y (mesma linha visual, tolerância de
// poucos pontos) e ordenamos por X dentro da linha (ordem de leitura esquerda→direita).
async function _extrairLinhasPDF(pdf){
  var linhas=[];
  for(var pg=1;pg<=pdf.numPages;pg++){
    var page=await pdf.getPage(pg);
    var tc=await page.getTextContent();
    var grupos=[];
    tc.items.forEach(function(it){
      var y=Math.round((it.transform&&it.transform[5])||0);
      var g=null;
      for(var gi=0;gi<grupos.length;gi++){if(Math.abs(grupos[gi].y-y)<=2){g=grupos[gi];break;}}
      if(!g){g={y:y,itens:[]};grupos.push(g);}
      g.itens.push({x:(it.transform&&it.transform[4])||0,str:it.str});
    });
    grupos.sort(function(a,b){return b.y-a.y;});
    grupos.forEach(function(g){
      g.itens.sort(function(a,b){return a.x-b.x;});
      var linha=g.itens.map(function(i){return i.str;}).join(' ').replace(/\s+/g,' ').trim();
      if(linha)linhas.push(linha);
    });
  }
  return linhas;
}

// Fallback para PDF de nota escaneada (imagem, sem texto embutido): renderiza cada página num canvas e
// lê com Tesseract.js — mesma biblioteca de OCR já usada em outras telas do app (Conferência de Notas,
// leitor de documento). Só é chamado quando a extração de texto normal vem vazia/curta demais.
async function _ocrPaginasPDF(pdf,onProgresso){
  var Tesseract=window.Tesseract;
  if(!Tesseract)return[];
  var linhas=[];
  for(var pg=1;pg<=pdf.numPages;pg++){
    if(onProgresso)onProgresso('OCR: página '+pg+'/'+pdf.numPages+'...');
    var page=await pdf.getPage(pg);
    var viewport=page.getViewport({scale:2});
    var canvas=document.createElement('canvas');
    canvas.width=viewport.width;canvas.height=viewport.height;
    var ctx=canvas.getContext('2d');
    await page.render({canvasContext:ctx,viewport:viewport}).promise;
    var result=await Tesseract.recognize(canvas,['por','eng']);
    (result&&result.data&&result.data.text||'').split('\n').forEach(function(l){if(l.trim())linhas.push(l.trim());});
  }
  return linhas;
}

// Extrai número/data/valor da nota (do texto completo) e os itens — descrição, quantidade, unidade,
// CEAN/EAN (se houver) e valor unitário — a partir das linhas já reconstruídas (visão de tabela real).
function _parsearPDFNotaConciliacao(linhas){
  var texto=linhas.join('\n');
  var nNFm=texto.match(/N[uU][mM][eE][rR][oO]\s*:?\s*(\d{1,9})/)||texto.match(/NF[\s\-e]*n?[\s\.]*[oO°]?[\s\.]*:?\s*(\d{6,9})/i)||texto.match(/\b(\d{6,9})\b/);
  var nNF=nNFm?nNFm[1]:'';
  var dtm=texto.match(/emiss[ao][oa][:\s]*(\d{2}[\/\-]\d{2}[\/\-]\d{4})/i)||texto.match(/(\d{2}\/\d{2}\/\d{4})/);
  var dataEmissao='';
  if(dtm){var pts=dtm[1].split(/[\/\-]/);dataEmissao=pts[2]+'-'+pts[1]+'-'+pts[0];}
  var vtm=texto.match(/VALOR\s*TOTAL\s*[:\s]*(R\$\s*)?([\d.,]+)/i)||texto.match(/TOTAL\s*[:\s]*(R\$\s*)?([\d.,]+)/i);
  var valorTotal=vtm?String(_numBR(vtm[2]||vtm[1]||'')||''):'';
  var itens=[];
  var unidadesArr=['UN','UNID','AMP','AMPOLA','FR','FRASCO','CX','CAIXA','CP','CPR','COMP','ML','KG','G','VD','PC','PCT','BIS','CAP','SER','BCA','FAR','SAC','TB','TUBO','BLISTER','BL'];
  var unidadesSet={};unidadesArr.forEach(function(u){unidadesSet[u]=true;});
  var unidades=unidadesArr.join('|');
  // Número em formato brasileiro: vírgula = separador decimal, ponto = separador de milhar (nunca o
  // contrário). Sem isso, "15.000" (quinze mil) virava 15 — o ponto era lido como ponto decimal.
  // Só quando NÃO há vírgula e o padrão é claramente milhar (grupos de 3 dígitos, ex. "15.000",
  // "1.234.567") os pontos são removidos; um único ponto com 1-2 dígitos (ex. "15.5") continua decimal.
  function _numBR(tok){
    var t=String(tok||'').trim();
    if(t.indexOf(',')>=0)return parseFloat(t.replace(/\./g,'').replace(',','.'))||0;
    if(/^\d{1,3}(?:\.\d{3})+$/.test(t))return parseFloat(t.replace(/\./g,''))||0;
    return parseFloat(t)||0;
  }
  var NUM_BR_RE='\\d{1,3}(?:\\.\\d{3})*(?:,\\d+)?|\\d+(?:[.,]\\d+)?';
  // DANFE às vezes traz o valor unitário com até 10 casas decimais (campo vUnCom da NF-e) — não só 2.
  function achaValorMonetario(toks){for(var j=0;j<toks.length;j++){if(new RegExp('^(?:'+NUM_BR_RE+')$').test(toks[j])&&/[.,]/.test(toks[j]))return _numBR(toks[j]);}return 0;}
  // Lote/validade: nem sempre estão na mesma linha da tabela — em muitas DANFEs vêm em "Dados Adicionais
  // do Produto" logo abaixo do item (rastreabilidade ANVISA). Procura primeiro na própria linha do item,
  // senão espia a linha seguinte (best-effort — o campo continua editável na tela se não achar nada).
  // Aceita as abreviações comuns de validade/vencimento (VAL/VENC/VENCTO/VENCIMENTO/VALIDADE) — \b nos dois
  // lados evita casar "VAL" dentro de "VALOR". Aceita MM/AAAA (guarda direto) ou DD/MM/AAAA (descarta o dia).
  function achaLoteValidade(linhaAtual,linhaSeguinte){
    var alvo=linhaAtual+' '+(linhaSeguinte||'');
    var loteM=alvo.match(/LOTE[:\s]*([A-Z0-9][A-Z0-9\-\.]{1,19})/i);
    var rotulo='\\b(?:VALIDADE|VENCIMENTO|VENCTO|VENC|VAL)\\b[.:\\s]*';
    // Tenta DD/MM/AAAA primeiro (3 grupos, ano com 4 dígitos); só cai pra MM/AAAA ou MM/AA (2 grupos) se
    // não achar — testar os dois juntos numa regex só era ambíguo e cortava o ano de "08/2027" ao meio.
    var validDMA=alvo.match(new RegExp(rotulo+'(\\d{2})[\\/\\-](\\d{2})[\\/\\-](\\d{4})\\b','i'));
    var validMA=!validDMA&&alvo.match(new RegExp(rotulo+'(\\d{2})[\\/\\-](\\d{2,4})\\b','i'));
    var validade='';
    if(validDMA)validade=validDMA[2]+'/'+validDMA[3];
    else if(validMA)validade=validMA[1]+'/'+validMA[2];
    return{lote:loteM?loteM[1]:'',validade:validade};
  }
  for(var li=0;li<linhas.length;li++){
    var lRaw=linhas[li];
    var l=(lRaw||'').trim();
    if(!l||l.length<5)continue;
    if(/^(item|descri|produto|c[oó]digo|quant|unidade|valor|total|cest|cean|ncm)\b/i.test(l))continue; // linha de cabeçalho da tabela
    // CEAN/EAN: sequência de 12-14 dígitos (código de barras); retira da linha antes de procurar qtd/unidade
    // pra não confundir o código com a quantidade.
    var ceanM=l.match(/\b(\d{12,14})\b/);
    var cean=ceanM?ceanM[1]:'';
    var lBusca=cean?l.replace(cean,' '):l;
    var desc='',qtd=0,unidade='',vUnit=0,achou=false;
    // TENTATIVA 1 (preferida): ordem real da DANFE — CÓDIGO/DESCRIÇÃO/NCM/CST/CFOP/UNID/QUANT/V.UNIT/V.TOTAL.
    // Busca o token de UNIDADE (bate com a lista conhecida) seguido de um NÚMERO — como CFOP/NCM vêm
    // ANTES da unidade (nunca depois), isso evita ler o CFOP como se fosse a quantidade (bug reportado:
    // quantidade sempre saindo como um CFOP comum, ex. "5102").
    var toks=lBusca.split(/\s+/).filter(Boolean);
    for(var i=0;i<toks.length-1;i++){
      var tUp=toks[i].toUpperCase().replace(/[^A-Z]/g,'');
      if(unidadesSet[tUp]&&/^\d+(?:[.,]\d+)?$/.test(toks[i+1])){
        var q1=_numBR(toks[i+1]);
        if(!(q1>0)||q1>=1000000)continue;
        var descToks=toks.slice(0,i);
        while(descToks.length>1&&/^\d{1,8}$/.test(descToks[descToks.length-1]))descToks.pop(); // descarta código/NCM/CST/CFOP colados antes da unidade
        var d1=descToks.join(' ').trim();
        if(d1.length<4||/^(TOTAL|VALOR|PESO|FRETE|DESCONTO|SUBTOTAL)/i.test(d1))continue;
        desc=d1;qtd=q1;unidade=tUp;vUnit=achaValorMonetario(toks.slice(i+2));achou=true;break;
      }
    }
    // TENTATIVA 2 (fallback): layouts simples sem códigos fiscais — "descrição qtd unidade" (ordem antiga).
    if(!achou){
      var m1=lBusca.match(new RegExp('(.{4,70}?)\\s+(\\d+(?:[.,]\\d+)?)\\s*('+unidades+')\\b','i'));
      if(m1){
        var d2=m1[1].replace(/^\d+\s+/,'').replace(/\s{2,}/g,' ').trim();
        var q2=_numBR(m1[2]);
        if(d2.length>=4&&q2>0&&q2<1000000&&!/^(TOTAL|VALOR|PESO|FRETE|DESCONTO|SUBTOTAL)/i.test(d2)){
          desc=d2;qtd=q2;unidade=m1[3].toUpperCase();
          vUnit=achaValorMonetario(lBusca.slice(m1.index+m1[0].length).split(/\s+/).filter(Boolean));
          achou=true;
        }
      }
    }
    if(!achou)continue;
    var lv=achaLoteValidade(l,linhas[li+1]);
    itens.push({descricao:desc.toUpperCase(),qtd:qtd,unidade:unidade,cean:cean,vUnit:vUnit||0,lote:lv.lote,validade:lv.validade});
  }
  return{nNF:nNF,dataEmissao:dataEmissao,valorTotal:valorTotal,itens:itens};
}

// ---- Parte 2: comparação automática recebimento × nota fiscal (pura, testável) ----
// Ao conciliar, o estoque passa a refletir a quantidade da NOTA FISCAL.
// A diferença (divergência) fica registrada como pendente — só rastreia, não bloqueia.
function conciliarRecebimentoNota(recebidos,faturados){
  function agg(list){var m={};(list||[]).forEach(function(it){var id=it.medicamentoId;if(!id)return;if(!m[id])m[id]={medicamentoId:id,medicamentoNome:it.medicamentoNome||'',qtd:0,lote:it.lote||''};m[id].qtd+=parseInt(it.quantidade)||0;if(!m[id].lote&&it.lote)m[id].lote=it.lote;});return m;}
  var R=agg(recebidos),F=agg(faturados);var rows=[];
  // 1) medicamentos presentes nos dois -> comparação de quantidade (cenários 1,2,3)
  Object.keys(R).forEach(function(id){
    if(F[id]){var qr=R[id].qtd,qf=F[id].qtd;var st=qr===qf?'conciliado':(qf>qr?'fiscal_superior':'recebido_superior');
      rows.push({medicamentoId:id,medicamentoNome:R[id].medicamentoNome,notaMedicamentoNome:F[id].medicamentoNome,qtdRecebida:qr,qtdFaturada:qf,status:st,lote:R[id].lote||'',justificativa:'',acaoTomada:''});}
  });
  var soRec=Object.keys(R).filter(function(id){return !F[id];});
  var soFat=Object.keys(F).filter(function(id){return !R[id];});
  var fatRest=soFat.slice();
  // 2) sobra recebida: pareia por LOTE com sobra faturada -> Produto Divergente (cenário 6); senão Não Faturado (cenário 5)
  soRec.forEach(function(rid){
    var lote=R[rid].lote;
    var par=lote?fatRest.find(function(fid){return F[fid].lote&&F[fid].lote===lote;}):null;
    if(par){rows.push({medicamentoId:rid,medicamentoNome:R[rid].medicamentoNome,notaMedicamentoId:par,notaMedicamentoNome:F[par].medicamentoNome,qtdRecebida:R[rid].qtd,qtdFaturada:F[par].qtd,status:'divergente',lote:lote,justificativa:'',acaoTomada:''});
      fatRest=fatRest.filter(function(fid){return fid!==par;});}
    else{rows.push({medicamentoId:rid,medicamentoNome:R[rid].medicamentoNome,notaMedicamentoNome:'',qtdRecebida:R[rid].qtd,qtdFaturada:0,status:'nao_faturado',lote:R[rid].lote||'',justificativa:'',acaoTomada:''});}
  });
  // 3) sobra faturada restante: Produto Faturado Não Recebido (cenário 4)
  fatRest.forEach(function(fid){rows.push({medicamentoId:fid,medicamentoNome:F[fid].medicamentoNome,notaMedicamentoNome:F[fid].medicamentoNome,qtdRecebida:0,qtdFaturada:F[fid].qtd,status:'nao_recebido',lote:F[fid].lote||'',justificativa:'',acaoTomada:''});});
  return rows;
}
function _concStatusGeral(rows){
  var divs=(rows||[]).filter(function(r){return r.status!=='conciliado';});
  if(divs.length===0)return'conciliado';

function _concAcoes(s){

var _ACAO_STATUS_FLUXO={

function _fDsimples(d){if(!d)return'';var p=String(d).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d;}

// ---- Parte 3: Painel de Divergências — linhas puras (pendentes de conciliação + itens de todas as conciliações) ----
function _buildLinhasDivergencias(recs,concs){
  var linhas=[];
  (recs||[]).filter(function(r){return (r.status||'pendente')==='pendente';}).forEach(function(r){
    (r.itens||[]).forEach(function(it,i){
      linhas.push({key:'rec_'+r.id+'_'+i,data:r.data||'',fornecedor:r.fornecedor||'',notaFiscal:'',produto:it.medicamentoNome||'',tipo:'—',responsavel:r.responsavel||r.criadoPor||'',statusFluxo:'pendente_conciliacao'});
    });
  });
  (concs||[]).forEach(function(cc){
    (cc.itens||[]).forEach(function(it,i){

// ===== Novo fluxo de Recebimento + Conciliação (redesenho) =====
// Motor de matching — função PURA e testável (sem Firestore): agrega a quantidade FÍSICA pendente de
// conciliação (por medicamento, somando todos os recebimentos ainda não conciliados) e a quantidade que
// aparece nas notas fiscais importadas (por medicamento, casando a descrição da nota ao cadastro via
// _matchItemMeds quando o item ainda não tem medId resolvido), e classifica cada medicamento em:
//  - conciliado: recebido bate exatamente com a nota
//  - divergência de quantidade: recebido e nota são do mesmo medicamento mas quantidades diferentes
//  - não encontrado: a nota cita um medicamento que não tem NENHUM recebimento pendente correspondente
// Medicamentos recebidos que ainda não têm nenhuma nota (aguardando a nota chegar) NÃO entram em nenhuma
// lista — continuam simplesmente pendentes, sem gerar "divergência" — só se torna um problema quando as
// DUAS pontas existem e não batem, ou quando a nota aponta algo que nunca foi recebido.
function _matchNotasRecebimentos(recebimentosPendentes,notasPendentes,medications){
  var recebidoPorMed={};
  (recebimentosPendentes||[]).forEach(function(rec){
    (rec.itens||[]).forEach(function(it,idx){
      if(!it.medicamentoId||it.conciliado)return;
      var q=parseInt(it.quantidade)||0;if(q<=0)return;
      if(!recebidoPorMed[it.medicamentoId])recebidoPorMed[it.medicamentoId]={qtd:0,nome:it.medicamentoNome||'',fontes:[]};
      recebidoPorMed[it.medicamentoId].qtd+=q;
      recebidoPorMed[it.medicamentoId].fontes.push({recId:rec.id,itemIdx:idx});
    });
  });
  var notaPorMed={};
  (notasPendentes||[]).forEach(function(nota){
    (nota.itens||[]).forEach(function(it,idx){
      if(it.status==='conciliado'||it.status==='divergencia'||it.status==='nao_encontrado')return;
      var medId=it.medId;
      if(!medId){var cand=_matchItemMeds(it.descricao,medications,1)[0];if(cand&&cand.score>=45)medId=cand.m.id;}
      var q=Math.round(it.qtd)||0;if(q<=0)return;
      if(!medId){notaPorMed['__semmatch_'+nota.id+'_'+idx]={qtd:q,nome:it.descricao,semMatch:true,fontes:[{notaId:nota.id,itemIdx:idx}]};return;}
      if(!notaPorMed[medId])notaPorMed[medId]={qtd:0,nome:it.descricao,fontes:[]};
      notaPorMed[medId].qtd+=q;
      notaPorMed[medId].fontes.push({notaId:nota.id,itemIdx:idx,medId:medId});
    });
  });
  var conciliados=[],divergencias=[],naoEncontrados=[];
  var medIds={};
  Object.keys(recebidoPorMed).forEach(function(k){medIds[k]=true;});
  Object.keys(notaPorMed).forEach(function(k){if(k.indexOf('__semmatch_')!==0)medIds[k]=true;});
  Object.keys(medIds).forEach(function(medId){
    var rec=recebidoPorMed[medId],nf=notaPorMed[medId];
    var qtdRecebida=rec?rec.qtd:0,qtdNota=nf?nf.qtd:0;
    var nome=(rec&&rec.nome)||(nf&&nf.nome)||'';
    if(qtdRecebida>0&&qtdNota>0){
      if(qtdRecebida===qtdNota)conciliados.push({medicamentoId:medId,medicamentoNome:nome,qtd:qtdRecebida,recFontes:rec.fontes,notaFontes:nf.fontes});
      else divergencias.push({medicamentoId:medId,medicamentoNome:nome,qtdRecebida:qtdRecebida,qtdNota:qtdNota,diferenca:qtdNota-qtdRecebida,recFontes:rec.fontes,notaFontes:nf.fontes});
    }else if(qtdRecebida===0&&qtdNota>0){
      naoEncontrados.push({medicamentoNome:nome,qtdNota:qtdNota,notaFontes:nf.fontes});
    }
  });
  Object.keys(notaPorMed).forEach(function(k){
    if(k.indexOf('__semmatch_')!==0)return;
    var x=notaPorMed[k];
    naoEncontrados.push({medicamentoNome:x.nome,qtdNota:x.qtd,notaFontes:x.fontes});
  });
  return{conciliados:conciliados,divergencias:divergencias,naoEncontrados:naoEncontrados};
}

function ImportarNotas(props){
  var user=props.user;var medications=props.medications||[];
  var B='#1351B4';
  var _notas=useState([]);var notas=_notas[0];var setNotas=_notas[1];
  var _recs=useState([]);var recs=_recs[0];var setRecs=_recs[1];
  var _processando=useState(false);var processando=_processando[0];var setProcessando=_processando[1];
  var _progresso=useState('');var progresso=_progresso[0];var setProgresso=_progresso[1];
  var _erro=useState('');var erro=_erro[0];var setErro=_erro[1];
  var _resumo=useState(null);var resumo=_resumo[0];var setResumo=_resumo[1];// último resultado do matching (Passo 4)
  var _rodandoMatch=useState(false);var rodandoMatch=_rodandoMatch[0];var setRodandoMatch=_rodandoMatch[1];

  useEffect(function(){
    var u1=db.collection('notas_fiscais').orderBy('criadoEm','desc').limit(100).onSnapshot(function(sn){setNotas(sn.docs.map(function(d){return Object.assign({id:d.id},d.data());}));},function(){});
    var u2=db.collection('recebimentos').orderBy('criadoEm','desc').limit(200).onSnapshot(function(sn){setRecs(sn.docs.map(function(d){return Object.assign({id:d.id},d.data());}));},function(){});
    return function(){try{u1();}catch(e){}try{u2();}catch(e){}};
  },[]);

  function logAcao(acao,det){try{db.collection('logs_acesso').add({uid:user.uid||'',nome:user.name||'',cargo:user.role||'',acao:acao,detalhe:det||'',criadoEm:new Date().toISOString()}).catch(function(){});}catch(_){}}

  async function processarUmPDF(file){
    var pdfLib=window.pdfjsLib;
    if(!pdfLib)throw new Error('Biblioteca de leitura de PDF não carregada. Recarregue a página.');
    pdfLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var buf=await file.arrayBuffer();
    var pdf=await pdfLib.getDocument({data:buf}).promise;
    var linhas=await _extrairLinhasPDF(pdf);
    var textoExtraido=linhas.join(' ').trim();
    if(textoExtraido.length<30){
      if(!window.Tesseract)throw new Error('"'+file.name+'": parece uma nota escaneada e o OCR não carregou.');
      setProgresso('"'+file.name+'": sem texto — lendo por OCR...');
      linhas=await _ocrPaginasPDF(pdf,function(p){setProgresso('"'+file.name+'": '+p);});
    }
    var parsed=_parsearPDFNotaConciliacao(linhas);
    if(parsed.itens.length===0)throw new Error('"'+file.name+'": nenhum medicamento identificado.');
    var itensComMatch=parsed.itens.map(function(it){
      var cand=_matchItemMeds(it.descricao,medications,1)[0];
      var med=(cand&&cand.score>=80)?cand.m:null;
      return{descricao:it.descricao,qtd:it.qtd,unidade:it.unidade,cean:it.cean||'',vUnit:it.vUnit||0,lote:it.lote||'',validade:it.validade||'',medId:med?med.id:'',medNome:med?med.nome:'',status:'pendente'};
    });
    return{nfNumero:parsed.nNF,dataEmissao:parsed.dataEmissao,valorTotal:parsed.valorTotal,itens:itensComMatch,nomeArquivo:file.name,status:'pendente',criadoEm:new Date().toISOString(),criadoPor:user.name||'',criadoPorId:user.uid||''};
  }

  async function importarPDFs(e){
    var files=Array.from((e.target.files)||[]);
    if(!files.length)return;
    setErro('');setResumo(null);setProcessando(true);
    var novasNotas=[];var falhas=[];
    for(var i=0;i<files.length;i++){
      var f=files[i];
      setProgresso('Lendo '+(i+1)+'/'+files.length+': '+f.name+'...');
      try{novasNotas.push(await processarUmPDF(f));}catch(ex){falhas.push((ex&&ex.message)||String(ex));}
    }
    var notasComId=[];
    if(novasNotas.length){
      setProgresso('Salvando '+novasNotas.length+' nota(s)...');
      var batch=db.batch();
      novasNotas.forEach(function(n){var ref=db.collection('notas_fiscais').doc();batch.set(ref,n);notasComId.push(Object.assign({id:ref.id},n));});
      await batch.commit();
      logAcao('notas_importadas_lote',novasNotas.length+' nota(s) importada(s) em lote'+(falhas.length?(' — '+falhas.length+' falha(s)'):''));
    }
    if(falhas.length)setErro(falhas.length+' arquivo(s) não importado(s): '+falhas.join(' · '));
    setProgresso('');setProcessando(false);e.target.value='';
    // Passa as notas recém-criadas direto (não espera o listener do Firestore atualizar o estado —
    // rodar o matching aqui embaixo veria a lista velha, sem as notas que acabaram de ser salvas).
    if(notasComId.length)await executarMatching(notasComId);
  }

  // Passo 3+4: roda o matching automático contra TODOS os recebimentos/notas ainda pendentes (não só os
  // recém-importados — permite reprocessar depois que uma divergência antiga foi corrigida, por exemplo).
  // notasExtras: notas recém-importadas nesta mesma chamada, que ainda não chegaram pelo listener.
  async function executarMatching(notasExtras){
    setRodandoMatch(true);setErro('');
    try{
      var todasNotas=notas.concat(notasExtras||[]);
      var recebimentosPendentes=recs.filter(function(r){return (r.status||'pendente')!=='conciliado';});
      var notasPendentes=todasNotas.filter(function(n){return (n.status||'pendente')!=='processada';});
      var resultado=_matchNotasRecebimentos(recebimentosPendentes,notasPendentes,medications);
      var now=new Date().toISOString();
      var batch=db.batch();
      var recPatches={};// recId -> {itemIdx: 'conciliado'|'divergencia'} — o TIPO de resultado, não só "processado"
      var notaPatches={};// notaId -> {itemIdx: {status,medId,medNome}}
      function marcarRec(fontes,tipo){fontes.forEach(function(f){if(!recPatches[f.recId])recPatches[f.recId]={};recPatches[f.recId][f.itemIdx]=tipo;});}
      function marcarNota(fontes,status,medId,medNome){fontes.forEach(function(f){if(!notaPatches[f.notaId])notaPatches[f.notaId]={};notaPatches[f.notaId][f.itemIdx]={status:status,medId:medId||'',medNome:medNome||''};});}
      resultado.conciliados.forEach(function(c){marcarRec(c.recFontes,'conciliado');marcarNota(c.notaFontes,'conciliado',c.medicamentoId,c.medicamentoNome);});
      resultado.divergencias.forEach(function(d){
        marcarRec(d.recFontes,'divergencia');marcarNota(d.notaFontes,'divergencia',d.medicamentoId,d.medicamentoNome);
        batch.set(db.collection('divergencias').doc(),{medicamentoId:d.medicamentoId,medicamentoNome:d.medicamentoNome,qtdRecebida:d.qtdRecebida,qtdNota:d.qtdNota,diferenca:d.diferenca,tipo:'quantidade',status:'pendente',origem:'matching_notas',criadoEm:now,criadoPor:user.name||''});
      });
      resultado.naoEncontrados.forEach(function(x){
        marcarNota(x.notaFontes,'nao_encontrado','','');
        batch.set(db.collection('divergencias').doc(),{medicamentoId:'',medicamentoNome:x.medicamentoNome,qtdRecebida:0,qtdNota:x.qtdNota,diferenca:x.qtdNota,tipo:'nao_encontrado',status:'pendente',origem:'matching_notas',criadoEm:now,criadoPor:user.name||''});
      });
      // conciliado=true no item só quer dizer "já processado nesta ou numa rodada anterior" (evita
      // reprocessar) — o TIPO do resultado (resultadoMatching) é que decide o status do recebimento; uma
      // única divergência no meio de vários itens não pode virar "conciliado" só porque todos foram processados.
      Object.keys(recPatches).forEach(function(recId){
        var rec=recs.find(function(r){return r.id===recId;});if(!rec)return;
        var novosItens=(rec.itens||[]).map(function(it,idx){var tipo=recPatches[recId][idx];return tipo?Object.assign({},it,{conciliado:true,resultadoMatching:tipo}):it;});
        var temDivergencia=novosItens.some(function(it){return it.resultadoMatching==='divergencia';});
        var todosProcessados=novosItens.length>0&&novosItens.every(function(it){return it.conciliado;});
        var statusNovo=temDivergencia?'divergencia':(todosProcessados?'conciliado':(rec.status||'pendente'));
        batch.update(db.collection('recebimentos').doc(recId),{itens:novosItens,status:statusNovo,statusLabel:temDivergencia?'Divergência Aberta':(todosProcessados?'Conciliado':(rec.statusLabel||'Pendente de Conciliação Fiscal'))});
      });
      Object.keys(notaPatches).forEach(function(notaId){
        var nota=todasNotas.find(function(n){return n.id===notaId;});if(!nota)return;
        var novosItens=(nota.itens||[]).map(function(it,idx){var p=notaPatches[notaId][idx];return p?Object.assign({},it,{status:p.status,medId:p.medId||it.medId,medNome:p.medNome||it.medNome}):it;});
        var todosProcessados=novosItens.length>0&&novosItens.every(function(it){return it.status&&it.status!=='pendente';});
        batch.update(db.collection('notas_fiscais').doc(notaId),{itens:novosItens,status:todosProcessados?'processada':(nota.status||'pendente')});
      });
      await batch.commit();
      setResumo(resultado);
      logAcao('matching_executado','Matching: '+resultado.conciliados.length+' conciliado(s), '+resultado.divergencias.length+' divergência(s), '+resultado.naoEncontrados.length+' não encontrado(s)');

      </label>
      {processando&&progresso&&<div style={{background:'#EFF6FF',border:'1px solid #BFDBFE',borderRadius:10,padding:'10px 12px',fontSize:12,color:B,fontWeight:600,marginBottom:8}}>⏳ {progresso}</div>}
      {erro&&<div style={{background:'#FEE2E2',border:'1px solid #FCA5A5',borderRadius:10,padding:'10px 12px',fontSize:13,color:'#DC2626',fontWeight:600,marginBottom:8,whiteSpace:'pre-wrap'}}>{erro}</div>}
      <button data-tour="notas-matching-btn" onClick={executarMatching} disabled={rodandoMatch||processando} style={{width:'100%',padding:'11px',background:rodandoMatch?'#94A3B8':'#F1F5F9',border:'none',borderRadius:10,color:rodandoMatch?'#fff':'#334155',fontWeight:700,fontSize:12,cursor:rodandoMatch?'default':'pointer'}}>{rodandoMatch?'Rodando...':'🔄 Rodar matching de novo'}</button>
    </div>

    {/* PASSO 4: relatório visual do último matching */}
    {resumo&&<div style={{background:'#fff',borderRadius:16,padding:16,boxShadow:'0 2px 12px rgba(0,0,0,.06)',border:'1px solid #F1F5F9',marginBottom:16}}>
