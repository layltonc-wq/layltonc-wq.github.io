  var leitesCadastrados=medications.filter(function(m){return m.categoria==='leite'||m.cat==='leite';});
  var materiaisCadastrados=medications.filter(function(m){return m.categoria==='penso'||m.cat==='penso'||m.categoria==='material'||m.cat==='material';});

  // Compat: retorna SOMENTE os leites PRINCIPAIS (entregues). Nunca inclui o opcional/alternativo.
  // Pacientes novos usam p.leites[]; pacientes antigos caem no leite único p.leiteId/qtdMensal.
  function pacienteLeites(p){
    if(p&&p.leites&&p.leites.length){
      return p.leites.map(function(l){return{leiteId:l.leiteId||'',nome:l.nome||'',qtd:l.qtd||0};});
    }
    var out=[];
    if(p&&(p.leiteId||p.leiteNome))out.push({leiteId:p.leiteId||'',nome:p.leiteNome||'',qtd:p.qtdMensal||0});
    return out;
  }

  function resetForm(){setFNome('');setFResp('');setFLeites([{leiteId:'',qtd:''}]);setFLeiteAlt('');setFMats([]);setFObs('');setEditing(null);}

  function abrirNovo(){resetForm();setShowForm(true);}
  function abrirEditar(p){
    setEditing(p);
    setFNome(p.nome||'');setFResp(p.responsavel||'');
    var pl=pacienteLeites(p).map(function(l){return{leiteId:l.leiteId||'',qtd:String(l.qtd||'')};});
    setFLeites(pl.length?pl:[{leiteId:'',qtd:''}]);
    setFLeiteAlt(p.leiteAltId||'');
    setFMats((p.materiais||[]).map(function(m){return Object.assign({},m);}));
    setFObs(p.observacao||'');
    setShowForm(true);
  }

  function salvarPaciente(){
    if(!fNome.trim()){alert2('Informe o nome do paciente.');return;}
    var leitesLimpos=fLeites.filter(function(l){return l.leiteId&&parseInt(l.qtd)>0;}).map(function(l){var m=leitesCadastrados.find(function(x){return x.id===l.leiteId;});return{leiteId:l.leiteId,nome:m?m.nome:'',qtd:parseInt(l.qtd)};});
    if(leitesLimpos.length===0){alert2('Adicione pelo menos um leite principal com quantidade.');return;}
    var leiteAltMed=fLeiteAlt?leitesCadastrados.find(function(m){return m.id===fLeiteAlt;}):null;
    var primeiro=leitesLimpos[0];
    var obj={
      nome:fNome.trim(),
      responsavel:fResp.trim(),
      leites:leitesLimpos,
      // Campos legados (1º leite) para compatibilidade com dados/telas antigas:
      leiteId:primeiro.leiteId,
      leiteNome:primeiro.nome,
      qtdMensal:primeiro.qtd,
      // Opcional (substituto) — NÃO é entregue automaticamente:
      leiteAltId:fLeiteAlt||'',
      leiteAltNome:leiteAltMed?leiteAltMed.nome:'',
      materiais:fMats.filter(function(m){return m.medId&&m.qtd>0;}).map(function(m){return{medId:m.medId,nome:m.nome,qtd:parseInt(m.qtd)||0};}),
      observacao:fObs.trim(),
      atualizadoEm:new Date().toISOString(),
      atualizadoPor:user.name||user.email
    };
    setSaving(true);
    var op;
    if(editing){
      op=db.collection('pacientes_leite').doc(editing.id).update(obj);
    }else{
      obj.status='falta';
      obj.criadoEm=new Date().toISOString();
      obj.criadoPor=user.name||user.email;
      op=db.collection('pacientes_leite').add(obj);
    }
    op.then(function(){setSaving(false);setShowForm(false);resetForm();alert2(editing?'Paciente atualizado!':'Paciente cadastrado!');})
      .catch(function(e){setSaving(false);alert2('Erro: '+(e&&e.message?e.message:'verifique a conexão'));});
  }

  function excluirPaciente(p){
    confirm2('Excluir paciente','Excluir '+p.nome+' do cadastro? O histórico de retiradas será mantido.',function(){
      db.collection('pacientes_leite').doc(p.id).delete().then(function(){
        alert2('Paciente excluído.');
      }).catch(function(e){
        var msg=e&&e.code==='permission-denied'
          ?'Não foi possível excluir: você não tem permissão para excluir pacientes (permission-denied). Peça a um administrador.'
          :'Não foi possível excluir: '+(e&&e.message?e.message:'verifique a conexão')+(e&&e.code?' ('+e.code+')':'');
        alert2(msg);
      });
    },'perigo','Excluir');
  }

  function mudarStatus(p,novo){
    db.collection('pacientes_leite').doc(p.id).update({status:novo,atualizadoEm:new Date().toISOString(),atualizadoPor:user.name||user.email}).catch(function(){});
  }

  function abrirBaixa(p){
    setShowBaixa(p);
    // Uma linha por leite PRINCIPAL. Cada linha pode: entregar o principal, ou substituir pelo opcional (usarAlt).
    var linhas=pacienteLeites(p).map(function(l){return{leiteId:l.leiteId,nome:l.nome,qtdPrescrita:l.qtd,qtdEntregue:String(l.qtd||''),usarAlt:false,avulsa:false};});
    setBLeites(linhas);
    setBMats((p.materiais||[]).map(function(m){return{medId:m.medId,nome:m.nome,qtdPrescrita:m.qtd,qtdEntregue:String(m.qtd)};}));
    setBData(todayStr());
  }

  function confirmarBaixa(){
    if(!showBaixa)return;
    var altId=showBaixa.leiteAltId||'';
    var altNome=showBaixa.leiteAltNome||'';
    // Resolve o leite efetivo de cada linha (substituto se usarAlt).
    var linhas=bLeites.map(function(l){
      var usaAlt=l.usarAlt&&altId&&!l.avulsa;
      return{
        leiteId:usaAlt?altId:l.leiteId,
        nome:usaAlt?altNome:l.nome,
        qtdPrescrita:l.avulsa?0:(parseInt(l.qtdPrescrita)||0),
        qtdEntregue:parseInt(l.qtdEntregue)||0,
        substituto:!!usaAlt,
        avulsa:!!l.avulsa
      };
    });
    var entregas=linhas.filter(function(l){return l.leiteId&&l.qtdEntregue>0;});
    if(entregas.length===0){alert2('Informe ao menos um leite com quantidade entregue (maior que zero).');return;}
    var bloqueios=[];
    entregas.forEach(function(l){
      var disp=stock[l.leiteId]||0;
      if(disp<=0)bloqueios.push(l.nome+': estoque zerado (0 disponível)');
      else if(l.qtdEntregue>disp)bloqueios.push(l.nome+': quantidade ('+l.qtdEntregue+') maior que disponível ('+disp+')');
    });
    var matsBaixa=bMats.map(function(m){return{medId:m.medId,nome:m.nome,qtdPrescrita:m.qtdPrescrita,qtdEntregue:parseInt(m.qtdEntregue)||0};});
    matsBaixa.forEach(function(m){
      if(m.qtdEntregue>0){
        var disp=stock[m.medId]||0;
        if(disp<=0)bloqueios.push(m.nome+': estoque zerado (0 disponível)');
        else if(m.qtdEntregue>disp)bloqueios.push(m.nome+': quantidade ('+m.qtdEntregue+') maior que disponível ('+disp+')');
      }
    });
    if(bloqueios.length>0){alert2('Estoque insuficiente:\n'+bloqueios.join('\n')+'\n\nAjuste as quantidades para no máximo o disponível.');return;}
    setBSaving(true);
    // Compat: primeiro leite (para telas antigas que leem leiteNome/qtdLeiteEntregue).
    var principal=entregas[0];
    // 1. cria registro de retirada
    var retObj={
      pacienteId:showBaixa.id,
      pacienteNome:showBaixa.nome,
      responsavelPaciente:showBaixa.responsavel||'',
      leites:entregas.map(function(l){return{leiteId:l.leiteId,nome:l.nome,qtdPrescrita:l.qtdPrescrita,qtdEntregue:l.qtdEntregue,substituto:l.substituto,avulsa:l.avulsa};}),
      leiteId:principal.leiteId,
      leiteNome:principal.nome,
      leiteAlternativo:principal.substituto,
      qtdLeitePrescrita:principal.qtdPrescrita,
      qtdLeiteEntregue:principal.qtdEntregue,
      materiais:matsBaixa,
      data:bData,
      liberadoPor:user.name||user.email,
      liberadoPorUid:user.uid,
      criadoEm:new Date().toISOString()
    };
    db.collection('retiradas_leite').add(retObj).then(function(){
      // 2. cria entries de saida (um por leite entregue + materiais >0)
      var promises=[];
      var obsBase='Entrega paciente: '+showBaixa.nome+(showBaixa.responsavel?' (resp: '+showBaixa.responsavel+')':'');
      entregas.forEach(function(l){
        var extra=l.avulsa?' — leite AVULSO ('+l.qtdEntregue+')':(l.substituto?' — leite substituto ('+l.qtdEntregue+'/'+l.qtdPrescrita+')':' — leite ('+l.qtdEntregue+'/'+l.qtdPrescrita+')');
        promises.push(onSave({medicamentoId:l.leiteId,medicamentoNome:l.nome,tipo:'saida',quantidade:l.qtdEntregue,observacao:obsBase+extra,viaLeitePac:true,pacienteLeiteId:showBaixa.id,leiteAvulso:l.avulsa}));
      });
      matsBaixa.forEach(function(m){
        if(m.qtdEntregue>0){
          promises.push(onSave({medicamentoId:m.medId,medicamentoNome:m.nome,tipo:'saida',quantidade:m.qtdEntregue,observacao:obsBase+' — material ('+m.qtdEntregue+'/'+m.qtdPrescrita+')',viaLeitePac:true,pacienteLeiteId:showBaixa.id}));
        }
      });
      return Promise.all(promises);
    }).then(function(){
      // 3. paciente volta pra "falta" (NÃO altera o cadastro de leites)
      return db.collection('pacientes_leite').doc(showBaixa.id).update({status:'falta',ultimaRetirada:bData,atualizadoEm:new Date().toISOString(),atualizadoPor:user.name||user.email});
    }).then(function(){
      setBSaving(false);setShowBaixa(null);alert2('Baixa registrada! Paciente voltou para "Falta Separar".');
    }).catch(function(e){setBSaving(false);alert2('Erro: '+(e&&e.message?e.message:'verifique a conexão'));});
  }

  function addMatForm(){setFMats(fMats.concat([{medId:'',nome:'',qtd:''}]));}
  function updMatForm(i,campo,valor){var novo=fMats.slice();novo[i]=Object.assign({},novo[i]);if(campo==='medId'){var m=materiaisCadastrados.find(function(x){return x.id===valor;});novo[i].medId=valor;novo[i].nome=m?m.nome:'';}else{novo[i][campo]=valor;}setFMats(novo);}
  function delMatForm(i){setFMats(fMats.filter(function(_,j){return j!==i;}));}

  // Leites principais no cadastro (lista):
  function addLeiteForm(){setFLeites(fLeites.concat([{leiteId:'',qtd:''}]));}
  function updLeiteForm(i,campo,valor){var novo=fLeites.slice();novo[i]=Object.assign({},novo[i]);novo[i][campo]=valor;setFLeites(novo);}
  function delLeiteForm(i){setFLeites(fLeites.length<=1?[{leiteId:'',qtd:''}]:fLeites.filter(function(_,j){return j!==i;}));}

  function updMatBaixa(i,valor){var novo=bMats.slice();novo[i]=Object.assign({},novo[i],{qtdEntregue:valor});setBMats(novo);}

  // Linhas de leite na baixa (principais + avulsas):
  function updLeiteBaixa(i,campo,valor){var novo=bLeites.slice();novo[i]=Object.assign({},novo[i]);if(campo==='leiteId'){var m=leitesCadastrados.find(function(x){return x.id===valor;});novo[i].leiteId=valor;novo[i].nome=m?m.nome:'';}else{novo[i][campo]=valor;}setBLeites(novo);}
  function toggleAltBaixa(i){var novo=bLeites.slice();novo[i]=Object.assign({},novo[i],{usarAlt:!novo[i].usarAlt});setBLeites(novo);}
  function addAvulsaBaixa(){setBLeites(bLeites.concat([{leiteId:'',nome:'',qtdPrescrita:0,qtdEntregue:'',usarAlt:false,avulsa:true}]));}
  function delLeiteBaixa(i){setBLeites(bLeites.filter(function(_,j){return j!==i;}));}

  var q=search.toLowerCase().trim();
  var filtrarPor=function(status){
    return pacientes.filter(function(p){
      if(p.status!==status&&status!=='todos')return false;
      if(q){var alvo=(p.nome+' '+(p.responsavel||'')+' '+(p.leiteNome||'')).toLowerCase();if(alvo.indexOf(q)===-1)return false;}
      return true;
    });
  };
  var cFalta=filtrarPor('falta').length;
  var cAguard=filtrarPor('aguardando').length;
  var cSep=filtrarPor('separado').length;
  var cCad=pacientes.filter(function(p){if(!q)return true;var alvo=(p.nome+' '+(p.responsavel||'')+' '+(p.leiteNome||'')).toLowerCase();return alvo.indexOf(q)!==-1;}).length;

  var subs=[
    {id:'falta',label:'Falta Separar'+(cFalta>0?' ('+cFalta+')':''),cor:'#B45309'},
    {id:'aguardando',label:'Aguardando'+(cAguard>0?' ('+cAguard+')':''),cor:'#1351B4'},
    {id:'separado',label:'Separados'+(cSep>0?' ('+cSep+')':''),cor:'#0C6B3E'},
    {id:'cadastro',label:'Cadastrados ('+cCad+')',cor:'#64748B'}
  ];

  function renderCard(p,contexto){
    var ret=retiradas.filter(function(r){return r.pacienteId===p.id;});
    var ultima=ret[0];
    return(<div key={p.id} className="card" style={{padding:14,marginBottom:10,borderLeft:'4px solid '+(p.status==='separado'?'#0C6B3E':p.status==='aguardando'?'#1351B4':'#B45309')}}>
      <div style={{display:'flex',gap:8,justifyContent:'space-between',alignItems:'flex-start'}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:800,fontSize:15,color:'#1E293B',wordBreak:'break-word'}}>{p.nome}</div>
          {p.responsavel&&<div style={{fontSize:12,color:'#64748B',marginTop:2}}>👤 Resp: {p.responsavel}</div>}
          {pacienteLeites(p).map(function(l,li){return(<div key={li} style={{fontSize:13,color:'#1351B4',fontWeight:600,marginTop:li===0?6:2}}>🍼 {l.nome||'—'}<span style={{color:'#64748B',fontWeight:500}}> · {l.qtd||0} un./mês</span></div>);})}
          {p.leiteAltNome&&<div style={{fontSize:12,color:'#7C3AED',fontWeight:500,marginTop:2}}>🔄 Opcional: {p.leiteAltNome}</div>}
          {p.materiais&&p.materiais.length>0&&<div style={{fontSize:12,color:'#64748B',marginTop:4}}>📦 Materiais: {p.materiais.map(function(m){return m.nome+' ('+m.qtd+')';}).join(', ')}</div>}
          {p.observacao&&<div style={{fontSize:12,color:'#B45309',marginTop:4,background:'#FFFBEB',borderRadius:6,padding:'4px 8px'}}>📝 {p.observacao}</div>}
          {ultima&&<div style={{fontSize:11,color:'#94A3B8',marginTop:6}}>Última retirada: {ultima.data} · {ultima.qtdLeiteEntregue}/{ultima.qtdLeitePrescrita} un.</div>}
        </div>
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:12,paddingTop:10,borderTop:'1px solid #F1F5F9'}}>
        {p.status!=='falta'&&<button onClick={function(){mudarStatus(p,'falta');}} style={{background:'#FEF3C7',border:'none',borderRadius:8,padding:'8px 12px',fontSize:11,fontWeight:700,color:'#92400E',cursor:'pointer'}}>↩️ Falta Separar</button>}
        {p.status!=='aguardando'&&<button onClick={function(){mudarStatus(p,'aguardando');}} style={{background:'#EFF6FF',border:'none',borderRadius:8,padding:'8px 12px',fontSize:11,fontWeight:700,color:'#1351B4',cursor:'pointer'}}>⏳ Aguardando</button>}
        {p.status!=='separado'&&<button onClick={function(){mudarStatus(p,'separado');}} style={{background:'#DCFCE7',border:'none',borderRadius:8,padding:'8px 12px',fontSize:11,fontWeight:700,color:'#0C6B3E',cursor:'pointer'}}>✅ Separado</button>}
        {p.status==='separado'&&can(user.role,'saida')&&<button onClick={function(){abrirBaixa(p);}} style={{background:'#0C6B3E',border:'none',borderRadius:8,padding:'8px 14px',fontSize:12,fontWeight:800,color:'#fff',cursor:'pointer',marginLeft:'auto'}}>♻️ Dar Baixa</button>}
        <button onClick={function(){setShowHist(p);}} title="Histórico" style={{background:'#F1F5F9',border:'none',borderRadius:8,padding:'8px 10px',fontSize:12,cursor:'pointer'}}>📜</button>
        <button onClick={function(){abrirEditar(p);}} title="Editar" style={{background:'#EFF6FF',border:'none',borderRadius:8,padding:'8px 10px',fontSize:12,cursor:'pointer'}}>✏️</button>
        <button onClick={function(){excluirPaciente(p);}} title="Excluir" style={{background:'#FEE2E2',border:'none',borderRadius:8,padding:'8px 10px',fontSize:12,cursor:'pointer'}}>🗑</button>
      </div>
    </div>);
  }

  var listaAtual=sub==='cadastro'?filtrarPor('todos'):filtrarPor(sub);
  var histRetiradas=showHist?retiradas.filter(function(r){return r.pacienteId===showHist.id;}):[];

  return(<div style={{maxWidth:900,margin:'0 auto',padding:'16px 14px'}}>
    <div style={{display:'flex',gap:10,marginBottom:12,flexWrap:'wrap'}}>
      <input value={search} onChange={function(e){setSearch(e.target.value);}} placeholder="Buscar paciente, responsável ou leite..." className="inp" style={{marginBottom:0,flex:1,minWidth:200}}/>
      <button onClick={abrirNovo} className="bp" style={{whiteSpace:'nowrap',padding:'0 16px',width:'auto'}}>+ Novo Paciente</button>
    </div>
    <div className="tab-sw" style={{flexWrap:'wrap'}}>
      {subs.map(function(s){return(<button key={s.id} onClick={function(){setSub(s.id);}} className={sub===s.id?'on':''}>{s.label}</button>);})}
    </div>
    {leitesCadastrados.length===0&&<div className="card" style={{padding:14,marginBottom:12,background:'#FFFBEB',border:'1.5px solid #FCD34D',color:'#92400E',fontSize:13}}>
      ⚠️ Nenhum leite cadastrado no estoque. Cadastre primeiro em Estoque com categoria <strong>Leite</strong> antes de vincular a pacientes.
    </div>}
    {listaAtual.length===0
      ?<div className="card" style={{padding:40,textAlign:'center',color:'#94A3B8'}}>
        <div style={{fontSize:40,marginBottom:8}}>🍼</div>
        <div style={{fontWeight:600}}>{sub==='cadastro'?'Nenhum paciente cadastrado':'Nenhum paciente aqui'}</div>
      </div>
      :listaAtual.map(function(p){return renderCard(p,sub);})
    }
    {showForm&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:9000,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:'#fff',borderRadius:20,padding:20,maxWidth:520,width:'100%',maxHeight:'92vh',overflowY:'auto'}}>
        <div style={{fontWeight:800,fontSize:17,color:'#1E293B',marginBottom:14}}>{editing?'✏️ Editar Paciente':'➕ Novo Paciente'}</div>
        <div style={{marginBottom:10}}>
          <div style={{fontWeight:700,fontSize:12,color:'#1E293B',marginBottom:4}}>Nome do paciente *</div>
          <input value={fNome} onChange={function(e){setFNome(e.target.value);}} className="inp" placeholder="Ex: João da Silva"/>
        </div>
        <div style={{marginBottom:10}}>
          <div style={{fontWeight:700,fontSize:12,color:'#1E293B',marginBottom:4}}>Nome do responsável</div>
          <input value={fResp} onChange={function(e){setFResp(e.target.value);}} className="inp" placeholder="Ex: Maria da Silva"/>
        </div>
        <div style={{marginBottom:10}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
            <div style={{fontWeight:700,fontSize:12,color:'#1E293B'}}>Leites prescritos * <span style={{fontWeight:400,color:'#94A3B8'}}>(todos são entregues)</span></div>
            <button onClick={addLeiteForm} style={{background:'#EFF6FF',border:'none',borderRadius:8,padding:'6px 12px',fontSize:11,fontWeight:700,color:'#1351B4',cursor:'pointer'}}>+ Adicionar leite</button>
          </div>
          {fLeites.map(function(l,i){return(<div key={i} style={{display:'flex',gap:6,marginBottom:6}}>
            <select value={l.leiteId} onChange={function(e){updLeiteForm(i,'leiteId',e.target.value);}} className="inp" style={{marginBottom:0,flex:2}}>
              <option value="">Selecione o leite...</option>
              {leitesCadastrados.map(function(m){return(<option key={m.id} value={m.id}>{m.nome}</option>);})}
            </select>
            <input value={l.qtd} onChange={function(e){updLeiteForm(i,'qtd',e.target.value.replace(/[^0-9]/g,''));}} className="inp" style={{marginBottom:0,width:90,textAlign:'center'}} placeholder="Qtd/mês" inputMode="numeric"/>
            {fLeites.length>1&&<button onClick={function(){delLeiteForm(i);}} style={{background:'#FEE2E2',border:'none',borderRadius:8,width:36,cursor:'pointer',fontSize:14}}>🗑</button>}
          </div>);})}
        </div>
        <div style={{marginBottom:10}}>
          <div style={{fontWeight:700,fontSize:12,color:'#1E293B',marginBottom:4}}>Leite opcional (substituto)</div>
          <select value={fLeiteAlt} onChange={function(e){setFLeiteAlt(e.target.value);}} className="inp">
            <option value="">Nenhum</option>
            {leitesCadastrados.filter(function(m){return !fLeites.some(function(l){return l.leiteId===m.id;});}).map(function(m){return(<option key={m.id} value={m.id}>{m.nome}</option>);})}
          </select>
          <div style={{fontSize:11,color:'#94A3B8',marginTop:4}}>ℹ️ NÃO é entregue automaticamente. Serve para substituir um leite principal caso ele falte, na hora da baixa.</div>
        </div>
        <div style={{marginBottom:10}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
            <div style={{fontWeight:700,fontSize:12,color:'#1E293B'}}>Materiais (opcional)</div>
            <button onClick={addMatForm} style={{background:'#EFF6FF',border:'none',borderRadius:8,padding:'6px 12px',fontSize:11,fontWeight:700,color:'#1351B4',cursor:'pointer'}}>+ Adicionar</button>
          </div>
          {fMats.length===0&&<div style={{fontSize:12,color:'#94A3B8',padding:'8px 0'}}>Nenhum material vinculado.</div>}

          itens.push({xProd:xProd,cProd:cProd,qCom:qCom,uCom:uCom,vUnCom:vUnCom,vProd:vProd,lote:lote,dFab:dFab,dVal:dVal,incluir:true,tipo:'xml'});
        });

  async function lerPDF(e){
    var file=e.target.files&&e.target.files[0];
    if(!file)return;
    if(!file.name.toLowerCase().endsWith('.pdf')){setErro('Selecione um arquivo .pdf!');return;}
    setErro('');setLoading(true);
    var pdfLib=window.pdfjsLib;
    if(!pdfLib){setErro('Biblioteca PDF não carregada.');setLoading(false);return;}
    pdfLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    try{
      var buf=await file.arrayBuffer();
      var pdf=await pdfLib.getDocument({data:buf}).promise;
      var texto='';
      for(var pg=1;pg<=pdf.numPages;pg++){
        var page=await pdf.getPage(pg);var tc=await page.getTextContent();
        texto+=tc.items.map(function(i){return i.str;}).join(' ')+'\n';
      }
      parsearPDF(texto,file.name);
    }catch(ex){setErro('Erro ao ler PDF: '+ex.message);}
    setLoading(false);e.target.value='';
  }

  function parsearPDF(texto,filename){
    var ehFoto=filename.startsWith('foto_nota');
    var tipo=ehFoto?'foto':'pdf';
    var nNFm=texto.match(/N[uU][mM][eE][rR][oO]\s*:?\s*(\d{1,9})/)||texto.match(/NF[\s\-e]*n?[\s\.]*[oO°]?[\s\.]*:?\s*(\d{6,9})/i)||texto.match(/\b(\d{6,9})\b/);
    var nNF=nNFm?nNFm[1]:'(verificar)';
    var dtm=texto.match(/emiss[ao][oa][:\s]*(\d{2}[\/\-]\d{2}[\/\-]\d{4})/i)||texto.match(/(\d{2}\/\d{2}\/\d{4})/);
    var dataEmissao='';
    if(dtm){var pts=dtm[1].split(/[\/\-]/);dataEmissao=pts[2]+'-'+pts[1]+'-'+pts[0];}
    var cnpjs=texto.match(/\d{2}\.?\d{3}\.?\d{3}[\/]?\d{4}[-]?\d{2}/g)||[];
    var fornecedorCNPJ=cnpjs[0]||'';
    var fornecedorNome='(Verificar na nota)';
    var vtm=texto.match(/VALOR\s*TOTAL\s*[:\s]*(R\$\s*)?([\d.,]+)/i)||texto.match(/TOTAL\s*[:\s]*(R\$\s*)?([\d.,]+)/i);
    var vTotal=vtm?(vtm[2]||vtm[1]||'0').replace(/[R$\s]/g,'').replace('.','').replace(',','.').trim():'0';
    var itens=[];
    var unidades='UN|UNID|AMP|AMPOLA|FR|FRASCO|CX|CAIXA|CP|COMP|ML|KG|G|VD|PC|PCT|BIS|CAP|SER|BCA|FAR|SAC|TB|TUBO';
    var linhas=texto.split('\n');
    for(var i=0;i<linhas.length;i++){
      var l=linhas[i].trim();
      if(!l||l.length<5)continue;
      // Padrão 1: descrição + qtd + unidade na mesma linha
      var m1=l.match(new RegExp('(.{4,60}?)\\s+(\\d+(?:[.,]\\d+)?)\\s+('+unidades+')\\b','i'));
      if(m1){
        var desc=m1[1].replace(/^\d+\s+/,'').trim();
        var qtd=parseFloat(m1[2].replace(',','.'));
        if(desc.length>=4&&qtd>0&&qtd<100000&&!/^(TOTAL|VALOR|PESO|FRETE|DESCONTO)/i.test(desc)){
          itens.push({xProd:desc.toUpperCase(),cProd:'',qCom:qtd,uCom:m1[3].toUpperCase(),vUnCom:0,vProd:0,lote:'',dFab:'',dVal:'',incluir:true,tipo:tipo});
          continue;
        }
      }
      // Padrão 2: linha com apenas nome de medicamento conhecido (para OCR fragmentado)
      var m2=l.match(/^([A-Z][A-Za-z]{3,}(?:\s+[A-Za-z0-9]+){1,4})\s+(\d{1,5})\s*$/);
      if(m2){
        var desc2=m2[1].trim();var qtd2=parseFloat(m2[2]);
        if(qtd2>0&&qtd2<10000)itens.push({xProd:desc2.toUpperCase(),cProd:'',qCom:qtd2,uCom:'UN',vUnCom:0,vProd:0,lote:'',dFab:'',dVal:'',incluir:true,tipo:tipo});
      }
    }
    var com=aplicarVinculos(itens);
    setPreview({nNF:nNF,dataEmissao:dataEmissao,fornecedorNome:fornecedorNome,fornecedorCNPJ:fornecedorCNPJ,chaveAcesso:'',vTotal:vTotal,nomeArquivo:filename,tipo:tipo,textoOCR:texto.substring(0,3000)});
    setItemsEdit(com.map(function(it,i){return Object.assign({},it,{idx:i});}));
  }

  function fD(d){if(!d)return'';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
  function hojeStrF(){return new Date().toISOString().split('T')[0];}
  function dpd(t){return Math.max(1,parseInt(t&&t.dosesPorDia)||1);} // doses por dia (posologia). Padrão 1 (compat. com tratamentos antigos)
  function totalDosesT(t){return (parseInt(t.diasTratamento)||0)*dpd(t);}
  function dosesReais(t){return (t.doses||[]).filter(function(d){return!d.retroativo;}).length;}
  function dosesNoDia(t,dia){return (t.doses||[]).filter(function(d){return d.data===dia;}).length;} // conta reais + "já tomava"
  // Agenda: uma linha por dia do tratamento, do início até hoje (limitado à duração). pendentes = doses/dia ainda não registradas.
  function agenda(t){
    if(!t||!t.dataInicio)return[];
    var D=dpd(t);var N=parseInt(t.diasTratamento)||0;if(N<=0)return[];
    var hoje=hojeStrF();var out=[];
    var cur=new Date(t.dataInicio+'T12:00:00');var lim=new Date(hoje+'T12:00:00');var count=0;
    while(cur<=lim&&count<N){
      var ds=cur.toISOString().split('T')[0];
      var reg=Math.min(dosesNoDia(t,ds),D);
      out.push({data:ds,total:D,feitas:reg,pendentes:Math.max(0,D-reg),ehHoje:ds===hoje,atrasado:ds<hoje});
      cur.setDate(cur.getDate()+1);count++;
    }
    return out;
  }
  function dosesAtrasadas(t){return agenda(t).reduce(function(s,d){return s+(d.atrasado?d.pendentes:0);},0);} // pendentes de dias anteriores a hoje
  function cSt(t){
    if(t.status==='dose_ataque')return'dose_ataque';
    if(t.status==='espera')return'espera';
    if(t.status==='desistiu')return'desistiu';
    if(t.status==='finalizado')return'finalizado';
    if(dosesReais(t)>=totalDosesT(t)&&totalDosesT(t)>0)return'concluido';
    return'ativo';
  }
  function dEsp(t){if(!t.criadoEm)return 0;return Math.floor((new Date()-new Date(t.criadoEm))/(86400000));}
  function dRest(t){return Math.max(0,totalDosesT(t)-dosesReais(t));}
  function dHj(t){var hj=hojeStrF();return dosesNoDia(t,hj)>=dpd(t);} // hoje totalmente concluído?
  function pHj(t){return cSt(t)==='ativo'&&!dHj(t);}
  function diasFaltou(t){
    if(cSt(t)!=='ativo')return 0;
    var doses=t.doses||[];
    var doasReais=doses.filter(function(d){return!d.retroativo;});
    if(doasReais.length===0)return 0;
    var ultima=doasReais.reduce(function(a,b){return a.data>b.data?a:b;});
    var dataUltima=new Date(ultima.data+'T12:00:00');
    var hoje=new Date();hoje.setHours(12,0,0,0);
    var diff=Math.floor((hoje-dataUltima)/86400000);
    return diff>1?diff-1:0;
  }
  function isInterrompido(t){return cSt(t)==='ativo'&&diasFaltou(t)>=1;}
  // Quantos dias o tratamento durou antes de interromper: do início até a última dose (ou desistência), inclusivo.
  function diasDurou(t){
    if(!t||!t.dataInicio)return 1;
    var ds=(t.doses||[]).filter(function(d){return d.data;}).map(function(d){return d.data;});
    var ref;
    if(ds.length)ref=ds.reduce(function(a,b){return a>b?a:b;});
    else if(t.desistiuEm)ref=String(t.desistiuEm).split('T')[0];
    else ref=t.dataInicio;
    var ini=new Date(t.dataInicio+'T12:00:00');var r=new Date(ref+'T12:00:00');
    var d=Math.floor((r-ini)/86400000)+1;
    return Math.max(1,d);
  }
  // Estatísticas p/ o gráfico de rosca: concluídos (verde) + interrompidos por faixa de dias.
  function statsATB(){
    var concl=0,b12=0,b34=0,b56=0,b7=0;
    (tratamentos||[]).forEach(function(t){
      var s=cSt(t);
      if(s==='concluido'||s==='finalizado'){concl++;return;}
      var interr=(s==='desistiu')||isInterrompido(t);
      if(!interr)return;
      var d=diasDurou(t);
      if(d<=2)b12++;else if(d<=4)b34++;else if(d<=6)b56++;else b7++;
    });
    var slices=[
      {key:'concl',label:'Concluídos',cor:'#10B981',count:concl},
      {key:'b12',label:'Interrompidos em 1-2 dias',cor:'#EF4444',count:b12},
      {key:'b34',label:'Interrompidos em 3-4 dias',cor:'#F59E0B',count:b34},

      {key:'b7',label:'Interrompidos em 7+ dias',cor:'#FEF08A',count:b7}
    ];
    var total=slices.reduce(function(a,x){return a+x.count;},0);
    return{total:total,slices:slices};
  }

function useModal(){
  var _modal=React.useState(null);var modal=_modal[0];var setModal=_modal[1];
  function confirm2(titulo,msg,onConfirm,tipo,confirmTxt){
    setModal({type:'confirm',titulo:titulo,msg:msg,onConfirm:function(){setModal(null);onConfirm();},onCancel:function(){setModal(null);},tipo:tipo,confirmTxt:confirmTxt});
  }
  function alert2(msg,titulo,tipo){
    setModal({type:'alert',titulo:titulo||'Atenção',msg:msg,onClose:function(){setModal(null);},tipo:tipo||'warning'});
  }
  function ModalRender(){
    if(!modal)return null;
    if(modal.type==='confirm')return React.createElement(ModalConfirm,modal);
    return React.createElement(ModalAlert,modal);
  }
  return {confirm2:confirm2,alert2:alert2,ModalRender:ModalRender,modal:modal};
}

class ErrBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return {err:e};}
  componentDidCatch(e,info){console.error('ErrBoundary caught:',e,info);}
  render(){
    if(this.state.err){
      return(<div style={{padding:24,textAlign:'center',color:'#DC2626'}}>
        <div style={{fontSize:32,marginBottom:8}}>⚠️</div>
        <div style={{fontWeight:700,marginBottom:4}}>Erro ao carregar</div>
        <div style={{fontSize:12,color:'#64748B'}}>{String(this.state.err.message||this.state.err)}</div>
        <button onClick={function(){window.location.reload();}} style={{marginTop:12,padding:'8px 16px',background:'#1351B4',color:'#fff',border:'none',borderRadius:8,cursor:'pointer',fontWeight:600}}>Recarregar</button>
      </div>);
    }
    return this.props.children;
  }
}

  var _editItens=useState(null);var editItens=_editItens[0];var setEditItens=_editItens[1];// rascunho dos itens da ata (medicamentoId por item), p/ atas importadas

  },[editAta,medications,atas]);

  var COR={medicamento:'#1351B4',controlado:'#DC2626',injetavel:'#7C3AED',leite:'#D97706',penso:'#0C6B3E'};

  // Carregar atas do Firebase
  useEffect(function(){
    if(!db)return;
    var u=db.collection('atas').onSnapshot(function(s){
      var list=s.docs.map(function(d){var o={id:d.id};var data=d.data();for(var k in data)o[k]=data[k];return o;});
      list.sort(function(a,b){return (a.nome||'').localeCompare(b.nome||'');});
      setAtas(list);
    },function(){});

  },[]);

  // ── CÁLCULO DE PREVISÃO ──────────────────────────────────────
  // Índice de consumo REAL por medicamento, calculado UMA única vez por mudança de entries.
  // Percorre o histórico uma só vez e agrega, por medicamento: a primeira saída real (para
  // diasHistorico) e o total consumido nos últimos 30 e 60 dias (para média/tendência).
  // Só conta dispensação real (via _ehSaidaNaoReal): descartes, ajustes, balanços etc. ficam de fora.
  // Antes, cada medicamento varria o histórico inteiro várias vezes (consumoPeriodo 30/60 + diasHistorico),
  // dezenas de vezes por render — o que travava o celular. Agora é uma passada + consultas O(1).
  var consumoIndex=useMemo(function(){
    var lim30=new Date();lim30.setDate(lim30.getDate()-30);
    var lim60=new Date();lim60.setDate(lim60.getDate()-60);
    var idx={};var primeiraGlobal=null;
    (entries||[]).forEach(function(e){
      if(e.tipo!=='saida')return;
      if(_ehSaidaNaoReal(e))return;
      var ds=e.date||(e.criadoEm||'').slice(0,10);
      if(!ds)return;
      if(primeiraGlobal===null||ds<primeiraGlobal)primeiraGlobal=ds;// histórico global (diasHistorico() sem medId)
      var medId=e.medicamentoId;if(!medId)return;
      var o=idx[medId];if(!o){o=idx[medId]={primeira:ds,cons30:0,cons60:0};}
      if(ds<o.primeira)o.primeira=ds;
      var d=new Date(ds+'T12:00:00');var q=Number(e.quantidade)||0;
      if(d>=lim60){o.cons60+=q;if(d>=lim30)o.cons30+=q;}
    });
    return {idx:idx,primeiraGlobal:primeiraGlobal};
  },[entries]);

  // Dias de histórico de consumo real. Com medId, do próprio medicamento; sem medId, global. O(1) no índice.
  function diasHistorico(medId){
    var pg=medId?(consumoIndex.idx[medId]?consumoIndex.idx[medId].primeira:null):consumoIndex.primeiraGlobal;
    if(!pg)return 0;
    return Math.max(1,Math.round((Date.now()-new Date(pg+'T12:00:00').getTime())/(1000*60*60*24)));
  }

  // Núcleo do cálculo de previsão (puro). Lê os agregados já indexados — mesma lógica/números de antes.
  function calcularPrevisaoCore(med){
    var info=consumoIndex.idx[med.id];
    var dias=diasHistorico(med.id);// histórico de consumo real DESTE medicamento (O(1) no índice)
    var estoqueAtual=stock[med.id]||0;
    var minimo=Number(med.minEstoque||med.estoqueMin||0);
    var consEstim=Number(med.consumoEstimado||0);
    var projEstim=consEstim>0?Math.ceil((consEstim/30)*diasPrev):0;// consumo estimado (manual) projetado p/ o horizonte

    // Rede de segurança: a sugestão nunca pode deixar o estoque final abaixo do mínimo cadastrado,
    // qualquer que seja o método/fase. Também nunca é negativa.
    function finalizar(pedirCalc,extra){
      var pedir=Math.max(0,Math.round(pedirCalc));
      if(minimo>0)pedir=Math.max(pedir,minimo-estoqueAtual);
      pedir=Math.max(0,pedir);
      // Dias até acabar no ritmo de consumo REAL. Sem consumo real => não dá para prever (null).
      var crm=(extra&&extra.consumoRealMes)||0;
      var diasParaAcabar=crm>0?Math.floor(estoqueAtual*30/crm):null;
      return Object.assign({pedir:pedir,diasParaAcabar:diasParaAcabar},extra);
    }

    // FASE 1: pouco histórico real (<25 dias) → usa consumo mensal estimado (ou o mínimo)
    if(dias<25){
      if(consEstim>0){
        var margemE=Math.ceil(projEstim*0.15);
        return finalizar(projEstim+margemE-estoqueAtual,{metodo:'estimado',detalhe:'Estimado '+consEstim+'/mês → '+projEstim+' em '+diasPrev+'d + margem '+margemE+' − estoque '+estoqueAtual,fase:1,consumoMes:projEstim,consumoRealMes:0});
      }
      return finalizar(minimo-estoqueAtual,{metodo:'minimo',detalhe:minimo>0?('Alvo mínimo '+minimo+' − estoque '+estoqueAtual):'Defina o consumo estimado ou o mínimo deste item',fase:1,consumoMes:null,consumoRealMes:0});
    }

    // Consumo REAL dos últimos 30 dias (só dispensação; via índice)
    var cons30=info?info.cons30:0;
    var consDiario=cons30/Math.min(dias,30);
    var realMes=Math.round(consDiario*30);// consumo real ~mensal (p/ exibição)

    // FASE 2: 25-55 dias → média diária projetada, com PISO no consumo estimado configurado
    if(dias<55){
      var projReal=Math.ceil(consDiario*diasPrev);
      var proj=Math.max(projReal,projEstim);// nunca abaixo do que o farmacêutico configurou (evita subestimar consumo alto)
      var usouEstim=projEstim>projReal;
      var margem=minimo>0?Math.ceil(minimo*0.2):Math.ceil(proj*0.15);
      var det2=usouEstim?('Estimado '+consEstim+'/mês (≥ real ~'+realMes+'/mês) → '+proj):('Consumo real ~'+consDiario.toFixed(1)+'/dia × '+diasPrev+'d = '+proj);
      return finalizar(proj+margem-estoqueAtual,{metodo:usouEstim?'estimado':'media',detalhe:det2+' + margem '+margem+' − estoque '+estoqueAtual,fase:2,consumoMes:proj,consumoRealMes:realMes});
    }

    // FASE 3: 55+ dias → tendência (últimos 30d vs 30d anteriores), com PISO no estimado
    var consRecente=cons30;
    var consAnterior=(info?info.cons60:0)-consRecente;
    var tendencia=0;
    if(consAnterior>0)tendencia=(consRecente-consAnterior)/consAnterior;
    var fatorTend=1+Math.max(-0.3,Math.min(0.5,tendencia));
    var projTendReal=Math.ceil((consRecente/30)*diasPrev*fatorTend);
    var projT=Math.max(projTendReal,projEstim);// piso no estimado
    var usouEstim3=projEstim>projTendReal;
    var margem3=minimo>0?Math.ceil(minimo*0.2):Math.ceil(projT*0.15);
    var tendStr=tendencia>0.05?('alta +'+Math.round(tendencia*100)+'%'):(tendencia<-0.05?('queda '+Math.round(tendencia*100)+'%'):'estável');
    var det3=usouEstim3?('Estimado '+consEstim+'/mês (≥ tendência) → '+projT):('Tendência '+tendStr+' · proj '+projT);
    return finalizar(projT+margem3-estoqueAtual,{metodo:usouEstim3?'estimado':'tendencia',detalhe:det3+' + margem '+margem3+' − estoque '+estoqueAtual,fase:3,consumoMes:projT,consumoRealMes:realMes});

  // Resultado memoizado por medicamento — evita recomputar em valorPedido/sort/filter/render/export.

  // PERF: mapa ataId -> [medicamentos] memoizado. Antes medsDaAta fazia 2x medications.filter +

  var medsPorAta=useMemo(function(){

  function valorPedido(med){
    var p=calcularPrevisao(med);
    var aj=ajustes[med.id];
    return aj!==undefined?(parseInt(aj)||0):p.pedir;
  }
  // Valor unitário EFETIVO de um medicamento no pedido: preferência para o valor digitado manualmente
  // (estado precos), depois o vUnit do item da ata (se houver), senão 0 (exibido como "—").
  function valorUnit(medId,item){
    var pm=precos[medId];
    if(pm!==undefined&&pm!==''){var n=parseFloat(String(pm).replace(',','.'));if(!isNaN(n))return n;}
    return item&&item.vUnit?item.vUnit:0;
  }
  // FONTE ÚNICA das linhas de pedido de uma ATA — usada por PDF consolidado, PDF por ATA e Excel.
  // Corrige o bug em que só os medicamentos presentes em ata.itens eram considerados: aqui percorremos
  // TODOS os medicamentos vinculados (medsDaAta = união de ataId + itens), casando cada um ao seu item
  // da ata (por medicamentoId) para herdar descrição/unidade/vUnit. A quantidade vem SEMPRE de
  // valorPedido (ajuste manual quando existe, senão a sugestão automática). Filtra qtd>0.
  function linhasPedidoAta(ata){

    if(ata&&ata.itens)ata.itens.forEach(function(it){if(it.medicamentoId)itensPorMed[it.medicamentoId]=it;});

              desc:(item&&item.descricao)||med.nome,unidade:(item&&item.unidade)||'UN',num:(item&&item.num)||'',naoVinculado:false};
    }).filter(function(x){return x.qtd>0;});
    // Mudança 4: itens da ATA SEM medicamento vinculado (sem medicamentoId ou vínculo órfão) também entram

      var uKey=itemAtaKey(ata.id,idx);
      var aj=ajustes[uKey];
      var qtd=aj!==undefined?(parseInt(aj)||0):0;
      if(qtd<=0)return;
      var pm=precos[uKey];var vU=(pm!==undefined&&pm!=='')?(parseFloat(String(pm).replace(',','.'))||0):(it.vUnit||0);
      linhas.push({med:null,item:it,qtd:qtd,vUnit:vU,vTotal:qtd*vU,
        desc:it.descricao||'(sem descrição)',unidade:it.unidade||'UN',num:it.num||'',naoVinculado:true});
    });

  function itemAtaKey(ataId,idx){return 'ITEM__'+ataId+'__'+idx;}

  // ── AÇÕES ────────────────────────────────────────────────────
  function importarAtaDocx(file){
    if(!file)return;
    setImportando(true);
    var reader=new FileReader();
    reader.onload=function(ev){
      var ab=ev.target.result;
      if(typeof mammoth==='undefined'){setMsg('e:Biblioteca não carregou. Recarregue.');setImportando(false);return;}
      mammoth.convertToHtml({arrayBuffer:ab}).then(function(res){
        var div=document.createElement('div');div.innerHTML=res.value;
        var tabs=div.querySelectorAll('table');
        var itens=[];
        var loteAtual='';
        tabs.forEach(function(tab){
          // Detectar número do lote no cabeçalho da tabela (ex: "Lote 1", "Lote 25")
          var primeiraLinha=tab.querySelector('tr');
          if(primeiraLinha){
            var txt=primeiraLinha.textContent.trim();
            var mLote=txt.match(/^Lote\s*(\d+)/i);
            if(mLote)loteAtual=mLote[1];
          }
          tab.querySelectorAll('tr').forEach(function(tr){
            var cs=tr.querySelectorAll('td,th');
            if(cs.length<2)return;
            var tx=function(i){return cs[i]?cs[i].textContent.trim():'';}; 
            var col0=tx(0);
            // Ignorar linhas de cabeçalho
            if(col0.toLowerCase().indexOf('descri')>=0||col0.toLowerCase().indexOf('item')>=0)return;
            if(col0.toLowerCase().indexOf('lote')>=0||col0.toLowerCase().indexOf('marca')>=0||col0.toLowerCase().indexOf('total')>=0)return;

            var n='',desc='',marca='',qtd='',unid='',vU='';

            // FORMATO SERRA MAR / contratos: num | desc | marca | qtd | unid | vUnit | vTotal
            if(/^\d+$/.test(col0)&&cs.length>=5){
              n=col0;
              if(cs.length>=7){desc=tx(1);marca=tx(2);qtd=tx(3);unid=tx(4);vU=tx(5);}
              else if(cs.length===6){desc=tx(1);marca=tx(2);qtd=tx(3);unid=tx(4);vU=tx(5);}
              else if(cs.length===5){desc=tx(1);qtd=tx(2);unid=tx(3);vU=tx(4);}
              else{desc=tx(1);qtd=tx(2);}
            }
            // FORMATO ATAs novas: desc | qtd | unid | vUnit | subTotal (sem número no início)
            else if(col0&&col0.length>3&&!(/^\d+$/.test(col0))){
              // É uma linha de item sem número — o número vem do Lote
              n=loteAtual||'';
              if(cs.length>=5){desc=tx(0);qtd=tx(1);unid=tx(2);vU=tx(3);}
              else if(cs.length===4){desc=tx(0);qtd=tx(1);unid=tx(2);vU=tx(3);}
              else if(cs.length===3){desc=tx(0);qtd=tx(1);unid=tx(2);}
              else{desc=tx(0);qtd=tx(1);}
              // Linha de marca — pular
              if(desc.toLowerCase().indexOf('marca:')>=0||desc.toLowerCase().indexOf('fabricante:')>=0)return;
              // Linha de valor total — pular
              if(desc.toLowerCase().indexOf('total')>=0&&qtd===''&&cs.length<4)return;
            } else return;

            var qN=parseInt((qtd||'').replace(/[^0-9]/g,''))||0;
            if(!desc||qN===0)return;
            var vUN=parseFloat((vU||'').replace(/[^0-9,]/g,'').replace(',','.'))||0;
            itens.push({num:n,descricao:desc,marca:marca,qtdTeto:qN,unidade:unid,vUnit:vUN,pedidoAcumulado:0,medicamentoId:''});
          });
        });
        if(itens.length===0){setMsg('e:Nenhum item encontrado na tabela. Verifique o arquivo.');setImportando(false);return;}
        setImportPreview(itens);
        if(!importNome)setImportNome(file.name.replace(/\.docx?$/i,''));
        setImportando(false);
        setMsg('ok:'+itens.length+' itens lidos! Confira abaixo e salve.');
        setTimeout(function(){setMsg('');},4000);
      }).catch(function(e){setMsg('e:Erro ao ler: '+e.message);setImportando(false);});
    };
    reader.onerror=function(){setMsg('e:Erro ao abrir arquivo');setImportando(false);};
    reader.readAsArrayBuffer(file);
  }

    if(!importPreview||!importNome.trim()){setMsg('e:Dê um nome à ata antes de salvar');return;}
    var vTot=importPreview.reduce(function(a,it){return a+(it.vUnit*it.qtdTeto);},0);

      setTimeout(function(){setMsg('');},4000);

  function atualizarItemAta(ataId,itens,novoItem,idxIt){
    var novos=itens.map(function(x,j){return j===idxIt?Object.assign({},x,novoItem):x;});
    var p=[db.collection('atas').doc(ataId).update({itens:novos})];
    // Sincronizar ataId no medicamento
    if(novoItem.medicamentoId!==undefined){
      var antigo=itens[idxIt]&&itens[idxIt].medicamentoId;
      if(novoItem.medicamentoId){
        // Vinculando: salvar ataId no medicamento
        p.push(db.collection('medicamentos').doc(novoItem.medicamentoId).update({ataId:ataId}));
      }
      if(antigo&&antigo!==novoItem.medicamentoId){
        // Desvinculando o anterior: remover ataId
        p.push(db.collection('medicamentos').doc(antigo).update({ataId:''}));
      }
    }
    return Promise.all(p);
  }
  // Mudança 4: vincula automaticamente um item de ATA sem medicamento — cria um cadastro novo usando
  // EXATAMENTE o nome que consta na ATA (descricao) e já vincula o item a ele.
  function vincularItemAutomatico(ata,idx){
    var it=(ata.itens||[])[idx];if(!it)return;
    var nome=(it.descricao||'').trim();
    if(!nome){setMsg('e:Item sem descrição — não é possível cadastrar.');setTimeout(function(){setMsg('');},2800);return;}
    var uKey=itemAtaKey(ata.id,idx);
    setVincItemLoading(uKey);
    db.collection('medicamentos').add({nome:nome,categoria:ata.categoria||'medicamento',ean:'',minEstoque:0,ataId:ata.id,criadoEm:new Date().toISOString(),criadoPor:user.name||''})
      .then(function(ref){
        return atualizarItemAta(ata.id,ata.itens,{medicamentoId:ref.id},idx).then(function(){
          // Preserva a quantidade/valor digitados na chave sintética, migrando para a chave do novo med.
          var ajV=ajustes[uKey];var prV=precos[uKey];
          if(ajV!==undefined)setAjustes(function(pp){var n=Object.assign({},pp);n[ref.id]=ajV;delete n[uKey];return n;});
          if(prV!==undefined)setPrecos(function(pp){var n=Object.assign({},pp);n[ref.id]=prV;delete n[uKey];return n;});
          setVincItemLoading(null);setMsg('ok:"'+nome+'" cadastrado e vinculado!');setTimeout(function(){setMsg('');},2800);
        });
      }).catch(function(e){setVincItemLoading(null);setMsg('e:'+((e&&e.message)||e));setTimeout(function(){setMsg('');},3000);});
  }

  // ── EDIÇÃO DE ATA EM RASCUNHO (não grava no Firestore até clicar Salvar) ──
  // Abre o editor copiando os medicamentos atuais da ata para o rascunho local.
  function abrirEditAta(ata){
    setEditAta(ata.id);
    setEditDraft(medsDaAta(ata.id).map(function(m){return m.id;}));
    setEditItens(ata.itens&&ata.itens.length?ata.itens.map(function(it){return Object.assign({},it);}):null);
    setEditBusca('');
  }
  // Fecha o editor DESCARTANDO o rascunho (não grava nada).
  function fecharEditAta(){setEditAta(null);setEditDraft(null);setEditItens(null);setEditBusca('');}
  // Adiciona um medicamento ao rascunho (só estado local). Bloqueia duplicata.
  function addMedDraft(med){
    if((editDraft||[]).indexOf(med.id)>=0){setMsg('e:"'+med.nome+'" já está nesta ata.');setTimeout(function(){setMsg('');},2500);return;}
    setEditDraft(function(prev){return (prev||[]).concat([med.id]);});
    setEditBusca('');
  }
  // Remove um medicamento do rascunho (só estado local). Também limpa vínculos de itens que apontam pra ele.
  function removeMedDraft(medId){
    setEditDraft(function(prev){return (prev||[]).filter(function(id){return id!==medId;});});
    setEditItens(function(prev){return prev?prev.map(function(it){return it.medicamentoId===medId?Object.assign({},it,{medicamentoId:''}):it;}):prev;});
  }
  // Vincula um item da ata (índice) a um medicamento — no rascunho (editItens + editDraft).
  function confirmarItem(idx,medId){
    setEditItens(function(prev){if(!prev)return prev;var arr=prev.map(function(it){return Object.assign({},it);});if(arr[idx])arr[idx].medicamentoId=medId;return arr;});
    setEditDraft(function(prev){var s=(prev||[]).slice();if(s.indexOf(medId)<0)s.push(medId);return s;});
  }
  // Desvincula um item da ata (rascunho).
  function desvincularItem(idx){
    var medId=editItens&&editItens[idx]?editItens[idx].medicamentoId:'';
    setEditItens(function(prev){if(!prev)return prev;var arr=prev.map(function(it){return Object.assign({},it);});if(arr[idx])arr[idx].medicamentoId='';return arr;});
    if(medId)setEditDraft(function(prev){return (prev||[]).filter(function(id){return id!==medId;});});
  }
  // Confirma de uma vez TODOS os itens com match único ainda não vinculados (rascunho).
  function confirmarTodosItens(){
    if(!autoMatches||!editItens){setMsg('e:Nada a confirmar.');setTimeout(function(){setMsg('');},2000);return;}
    var arr=editItens.map(function(it){return Object.assign({},it);});
    var novos=[];
    autoMatches.forEach(function(am,idx){
      if(arr[idx]&&!arr[idx].medicamentoId&&am.cands.length===1){
        arr[idx].medicamentoId=am.cands[0].m.id;
        if(novos.indexOf(am.cands[0].m.id)<0)novos.push(am.cands[0].m.id);
      }
    });
    if(!novos.length){setMsg('e:Nenhum match único pendente.');setTimeout(function(){setMsg('');},2500);return;}
    setEditItens(arr);
    setEditDraft(function(prev){var s=(prev||[]).slice();novos.forEach(function(id){if(s.indexOf(id)<0)s.push(id);});return s;});
    setMsg('ok:'+novos.length+' item(ns) vinculado(s) no rascunho. Toque em ✅ Salvar para gravar.');setTimeout(function(){setMsg('');},3000);
  }
  // Grava o rascunho inteiro no Firestore de uma vez: itens (medicamentoId) + reconcilia ataId dos medicamentos.
  function salvarEditAta(ata){
    var original=medsDaAta(ata.id).map(function(m){return m.id;});
    var draft=editDraft||[];
    var adicionar=draft.filter(function(id){return original.indexOf(id)<0;});
    var remover=original.filter(function(id){return draft.indexOf(id)<0;});
    var ops=[];
    if(editItens){ops.push(db.collection('atas').doc(ata.id).update({itens:editItens}));}
    adicionar.forEach(function(id){ops.push(db.collection('medicamentos').doc(id).update({ataId:ata.id}));});
    remover.forEach(function(id){ops.push(db.collection('medicamentos').doc(id).update({ataId:''}));});
    Promise.all(ops).then(function(){
      fecharEditAta();
      setMsg('ok:Ata atualizada! ('+adicionar.length+' incluído(s), '+remover.length+' removido(s))');setTimeout(function(){setMsg('');},2800);
    }).catch(function(){setMsg('e:Erro ao salvar. Tente de novo.');});
  }

  // ── EXPORTAÇÃO ───────────────────────────────────────────────
  // atasFiltro (opcional): array de ATAs para exportar SÓ elas (pedido unitário por ata).
  // Sem filtro = consolidado (todas as atas + medicamentos sem ata). Mesmo formato/colunas.
  function exportarExcel(atasFiltro){
    var filtrando=Array.isArray(atasFiltro);
    var listaAtas=filtrando?atasFiltro:atas;
    var wb=XLSX.utils.book_new();
    // Só entram itens com quantidade a pedir > 0; colunas de valor unitário e total incluídas.
    var dadosGeral=[['ATA','Categoria','Medicamento','Estoque Atual','Estoque Mín.','Qtd. Pedir','V. Unit.','V. Total','Método']];
    var grandTotal=0;
    listaAtas.forEach(function(ata){
      linhasPedidoAta(ata).forEach(function(x){
        grandTotal+=x.vTotal;
        if(x.naoVinculado){
          // Item da ATA sem medicamento vinculado (Mudança 4): nome da ATA + aviso, sem estoque/método.
          dadosGeral.push([ata.nome,LBL[ata.categoria]||ata.categoria,x.desc+' ⚠️ NÃO VINCULADO','','',x.qtd,x.vUnit>0?x.vUnit:'',x.vTotal>0?x.vTotal:'','não vinculado']);
        }else{
          var p=calcularPrevisao(x.med);
          dadosGeral.push([ata.nome,LBL[ata.categoria]||ata.categoria,x.med.nome,stock[x.med.id]||0,x.med.minEstoque||0,x.qtd,x.vUnit>0?x.vUnit:'',x.vTotal>0?x.vTotal:'',p.metodo]);
        }
      });
    });
    if(!filtrando)medsSemAta.forEach(function(m){
      var q=valorPedido(m);if(q<=0)return;
      var vU=valorUnit(m.id,null);var vT=q*vU;grandTotal+=vT;
      var p=calcularPrevisao(m);
      dadosGeral.push(['(sem ata)','—',m.nome,stock[m.id]||0,m.minEstoque||0,q,vU>0?vU:'',vT>0?vT:'',p.metodo]);
    });
    if(dadosGeral.length===1){setMsg('e:Nenhum medicamento com pedido > 0'+(filtrando?' nesta ata.':'.')+' Ajuste as quantidades.');return;}
    if(grandTotal>0)dadosGeral.push(['','','','','','','TOTAL GERAL',grandTotal,'']);
    var ws=XLSX.utils.aoa_to_sheet(dadosGeral);
    XLSX.utils.book_append_sheet(wb,ws,'Pedido');
    var hoje=new Date().toLocaleDateString('pt-BR').replace(/\//g,'-');
    var slug=filtrando?(listaAtas[0].nome||'ata').replace(/[^a-zA-Z0-9]+/g,'_').slice(0,40)+'_':'';
    XLSX.writeFile(wb,'Previsao_Pedido_'+slug+hoje+'.xlsx');
    setMsg('ok:Excel exportado!');setTimeout(function(){setMsg('');},2500);
  }

  // atasFiltro (opcional): array de ATAs para gerar o pedido SÓ delas (pedido unitário por ata),

  var dias=diasHistorico();

        {/* Lista de medicamentos por categoria */}
        {(function(){

          var secoes=categorias.map(function(catKey){
            // Medicamentos desta categoria. Regra de exibição no fechamento de pedido:

                semAta.push(m);

              var excede=saldoAta!==null&&val>saldoAta;

                  <div style={{fontSize:9,color:'#94A3B8',whiteSpace:'nowrap'}}>tot: {(function(){var vt=val*valorUnit(m.id,item);return vt>0?'R$ '+vt.toFixed(2).replace('.',','):'—';})()}</div>

                {/* Sub-pastas por ATA */}

  }
  function onCount(key,raw){
