}

// Passo 5: Divergências — lista simples do que sobrou de problema no matching (coleção 'divergencias'),
// com resolução manual (checkbox "Confirmar") ou automática (some sozinha quando o estoque do medicamento
// chega a zero, mesmo mecanismo já usado na importação de PDF anterior).
function PainelDivergenciasV2(props){
  var user=props.user;var stock=props.stock||{};
  var _divs=useState([]);var divs=_divs[0];var setDivs=_divs[1];
  var _resolvendo=useState(null);var resolvendo=_resolvendo[0];var setResolvendo=_resolvendo[1];
  var _lastAuto=useRef({});

  useEffect(function(){
    return db.collection('divergencias').where('status','==','pendente').orderBy('criadoEm','desc').limit(200).onSnapshot(function(sn){
      setDivs(sn.docs.map(function(d){return Object.assign({id:d.id},d.data());}));
    },function(){
      // fallback sem índice composto (where+orderBy pode exigir índice): busca tudo e filtra local.
      db.collection('divergencias').orderBy('criadoEm','desc').limit(200).onSnapshot(function(sn){
        setDivs(sn.docs.map(function(d){return Object.assign({id:d.id},d.data());}).filter(function(d){return (d.status||'pendente')==='pendente';}));
      });
    });
  },[]);

  // Auto-clear: quando o estoque do medicamento chega a zero, a divergência de quantidade some sozinha
  // (a de "não encontrado" não tem medicamentoId — só resolve manual).
  useEffect(function(){
    divs.forEach(function(d){
      if(!d.medicamentoId)return;
      if((stock[d.medicamentoId]||0)>0)return;
      var last=_lastAuto.current[d.id]||0;
      if(Date.now()-last<4000)return;
      _lastAuto.current[d.id]=Date.now();
      db.collection('divergencias').doc(d.id).update({status:'resolvido',resolvidoEm:new Date().toISOString(),resolvidoPor:'auto (estoque zerado)'}).catch(function(){});
    });
  },[divs,stock]);

  function confirmar(d){
    setResolvendo(d.id);
    db.collection('divergencias').doc(d.id).update({status:'resolvido',resolvidoEm:new Date().toISOString(),resolvidoPor:user.name||''})
      .then(function(){setResolvendo(null);}).catch(function(e){alert('Erro: '+((e&&e.message)||e));setResolvendo(null);});
  }

  return(<div>
    <div data-tour="div-painel" style={{background:'#fff',borderRadius:16,padding:16,boxShadow:'0 2px 12px rgba(0,0,0,.06)',border:'1px solid #F1F5F9'}}>
      <div style={{fontWeight:800,fontSize:15,color:'#1E293B',marginBottom:4}}>🚨 Divergências</div>
      <div style={{fontSize:11,color:'#94A3B8',marginBottom:14}}>Some sozinha quando o estoque do medicamento zerar, ou confirme manualmente abaixo.</div>
      {divs.length===0?<div style={{textAlign:'center',color:'#94A3B8',padding:24,fontSize:13}}><div style={{fontSize:36,marginBottom:6}}>✅</div>Nenhuma divergência pendente.</div>:
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {divs.map(function(d){var naoEncontrado=d.tipo==='nao_encontrado';return(
          <div key={d.id} style={{border:'1px solid '+(naoEncontrado?'#FCA5A5':'#FDE68A'),background:naoEncontrado?'#FEF2F2':'#FFFBEB',borderRadius:12,padding:'10px 12px'}}>
            <div style={{fontWeight:700,fontSize:13,color:'#1E293B',marginBottom:4}}>{naoEncontrado?'❌':'⚠️'} {d.medicamentoNome}</div>
            {naoEncontrado?
              <div style={{fontSize:12,color:'#991B1B'}}>Na nota, sem recebimento correspondente · qtd nota: {d.qtdNota}</div>
              :<div style={{fontSize:12,color:'#92400E'}}>Recebeu {d.qtdRecebida}, nota diz {d.qtdNota} (divergência: {d.diferenca>0?'+':''}{d.diferenca})</div>}
            <button onClick={function(){confirmar(d);}} disabled={resolvendo===d.id} style={{marginTop:8,padding:'7px 14px',background:resolvendo===d.id?'#94A3B8':'#0C6B3E',border:'none',borderRadius:8,color:'#fff',fontWeight:700,fontSize:12,cursor:resolvendo===d.id?'default':'pointer'}}>{resolvendo===d.id?'Confirmando...':'✅ Confirmar'}</button>
          </div>
        );})}
      </div>}
    </div>
  </div>);
}

function ConciliacaoFiscal(props){
  var user=props.user;var medications=props.medications||[];var B='#1351B4';
  function blankNfItem(){_nfSeq++;return{key:'nf'+_nfSeq,medId:'',medNome:'',busca:'',qtd:'',lote:'',validade:''};}
  var _num=useState('');var notaNumero=_num[0];var setNotaNumero=_num[1];
  var _serie=useState('');var notaSerie=_serie[0];var setNotaSerie=_serie[1];
  var _emis=useState('');var notaEmissao=_emis[0];var setNotaEmissao=_emis[1];
  var _forn=useState('');var fornecedor=_forn[0];var setFornecedor=_forn[1];
  var _valor=useState('');var valorTotal=_valor[0];var setValorTotal=_valor[1];
  var _anexo=useState('');var anexo=_anexo[0];var setAnexo=_anexo[1];
  var _recSel=useState('');var recSel=_recSel[0];var setRecSel=_recSel[1];
  var _nfItens=useState([blankNfItem()]);var nfItens=_nfItens[0];var setNfItens=_nfItens[1];
  var _foco=useState(null);var focoItem=_foco[0];var setFocoItem=_foco[1];
  var _saving=useState(false);var saving=_saving[0];var setSaving=_saving[1];
  var _recs=useState([]);var recs=_recs[0];var setRecs=_recs[1];
  var _concs=useState([]);var concs=_concs[0];var setConcs=_concs[1];
  var _concAtual=useState(null);var concAtual=_concAtual[0];var setConcAtual=_concAtual[1];// {id, itens, statusGeral,...}
  var _det=useState(null);var detalhe=_det[0];var setDetalhe=_det[1];
  // Importação de PDF da nota fiscal — fluxo independente do "Conciliar" manual acima: registra a nota
  // direto (soma ao estoque), sem depender de já existir um Recebimento Físico pendente pra vincular.
  var _pdfItens=useState([]);var pdfItens=_pdfItens[0];var setPdfItens=_pdfItens[1];
  var _pdfFoco=useState(null);var pdfFoco=_pdfFoco[0];var setPdfFoco=_pdfFoco[1];
  var _pdfProcessando=useState(false);var pdfProcessando=_pdfProcessando[0];var setPdfProcessando=_pdfProcessando[1];
  var _pdfSaving=useState(false);var pdfSaving=_pdfSaving[0];var setPdfSaving=_pdfSaving[1];
  var _pdfErro=useState('');var pdfErro=_pdfErro[0];var setPdfErro=_pdfErro[1];
  var _pdfOk=useState('');var pdfOk=_pdfOk[0];var setPdfOk=_pdfOk[1];
  var _pdfNumero=useState('');var pdfNumero=_pdfNumero[0];var setPdfNumero=_pdfNumero[1];
  var _pdfEmissao=useState('');var pdfEmissao=_pdfEmissao[0];var setPdfEmissao=_pdfEmissao[1];
  var _pdfForn=useState('');var pdfForn=_pdfForn[0];var setPdfForn=_pdfForn[1];
  var _pdfValor=useState('');var pdfValor=_pdfValor[0];var setPdfValor=_pdfValor[1];
  var _pdfProgresso=useState('');var pdfProgresso=_pdfProgresso[0];var setPdfProgresso=_pdfProgresso[1];

  useEffect(function(){
    var u1=db.collection('recebimentos').orderBy('criadoEm','desc').limit(200).onSnapshot(function(sn){setRecs(sn.docs.map(function(d){return Object.assign({id:d.id},d.data());}));},function(){});
    var u2=db.collection('conciliacoes').orderBy('criadoEm','desc').limit(200).onSnapshot(function(sn){setConcs(sn.docs.map(function(d){return Object.assign({id:d.id},d.data());}));},function(){});
    return function(){try{u1();}catch(e){}try{u2();}catch(e){}};
  },[]);

  function fD(d){if(!d)return'';var p=String(d).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d;}
  // Auditoria: toda ação loga usuário/data/hora/ação + valor anterior/novo. Logs em logs_acesso NUNCA são apagados (sem UI de exclusão).
  function logAcao(acao,det,valorAnterior,valorNovo){try{db.collection('logs_acesso').add({uid:user.uid||'',nome:user.name||'',cargo:user.role||'',acao:acao,detalhe:det||'',valorAnterior:(valorAnterior===undefined?null:valorAnterior),valorNovo:(valorNovo===undefined?null:valorNovo),criadoEm:new Date().toISOString()}).catch(function(){});}catch(_){}}
  function setNf(key,patch){setNfItens(function(arr){return arr.map(function(it){return it.key===key?Object.assign({},it,patch):it;});});}
  function addNf(){setNfItens(function(arr){return arr.concat([blankNfItem()]);});}
  function delNf(key){setNfItens(function(arr){return arr.length<=1?arr:arr.filter(function(it){return it.key!==key;});});}
  function escolherMed(key,m){setNf(key,{medId:m.id,medNome:m.nome,busca:''});setFocoItem(null);}

  // ---- Importação de PDF da nota fiscal ----
  function setPdfItem(key,patch){setPdfItens(function(arr){return arr.map(function(it){return it.key===key?Object.assign({},it,patch):it;});});}
  function delPdfItem(key){setPdfItens(function(arr){return arr.filter(function(it){return it.key!==key;});});}
  function escolherMedPdf(key,m){setPdfItem(key,{medId:m.id,medNome:m.nome,busca:'',sugestoes:[]});setPdfFoco(null);}
  function toggleConciliadoPdf(key){setPdfItem(key,{conciliado:!pdfItens.find(function(it){return it.key===key;}).conciliado});}

  async function importarPDFNota(e){
    var file=e.target.files&&e.target.files[0];if(!file)return;
    if(!file.name.toLowerCase().endsWith('.pdf')){setPdfErro('Selecione um arquivo .pdf da nota fiscal.');e.target.value='';return;}
    setPdfErro('');setPdfOk('');setPdfProcessando(true);setPdfProgresso('Lendo o PDF...');
    var pdfLib=window.pdfjsLib;
    if(!pdfLib){setPdfErro('Biblioteca de leitura de PDF não carregada. Recarregue a página.');setPdfProcessando(false);setPdfProgresso('');return;}
    pdfLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    try{
      var buf=await file.arrayBuffer();
      var pdf=await pdfLib.getDocument({data:buf}).promise;
      var linhas=await _extrairLinhasPDF(pdf);
      // Nota escaneada (imagem, sem texto embutido): o pdf.js não extrai nada útil — cai pro OCR.
      var textoExtraido=linhas.join(' ').trim();
      if(textoExtraido.length<30){
        if(!window.Tesseract){setPdfErro('Este PDF parece ser uma imagem escaneada e a biblioteca de OCR não carregou. Recarregue a página e tente de novo.');setPdfProcessando(false);setPdfProgresso('');e.target.value='';return;}
        setPdfProgresso('PDF sem texto — lendo por OCR (pode demorar um pouco)...');
        linhas=await _ocrPaginasPDF(pdf,setPdfProgresso);
      }
      setPdfProgresso('Identificando medicamentos...');
      var parsed=_parsearPDFNotaConciliacao(linhas);
      if(parsed.itens.length===0){setPdfErro('Não foi possível identificar medicamentos no PDF. Confira o arquivo — você ainda pode conferir manualmente na seção acima.');setPdfProcessando(false);setPdfProgresso('');e.target.value='';return;}
      setPdfNumero(parsed.nNF);setPdfEmissao(parsed.dataEmissao);setPdfValor(parsed.valorTotal);
      setPdfItens(parsed.itens.map(function(it){
        // Mesmo matcher usado em Gerenciar Atas/Comparação (siglas + concentração, mais robusto que
        // busca simples): sugere os candidatos do cadastro mais parecidos com a descrição da nota.
        var candidatos=_matchItemMeds(it.descricao,medications,5);
        var top=candidatos[0];
        var med=(top&&top.score>=80)?top.m:null; // só auto-vincula com confiança alta; o resto fica pra revisão
        _pdfItSeq++;
        return{key:'pdfit'+_pdfItSeq,xProd:it.descricao,qtd:String(Math.round(it.qtd)),unidade:it.unidade,cean:it.cean||'',vUnit:it.vUnit||0,
          medId:med?med.id:'',medNome:med?med.nome:'',busca:'',lote:it.lote||'',validade:it.validade||'',conciliado:false,
          sugestoes:med?[]:candidatos.filter(function(x){return !med||x.m.id!==med.id;})};
      }));
      setPdfOk(parsed.itens.length+' item(ns) identificado(s) no PDF! Confira os vínculos, marque os conciliados e registre.');
      setTimeout(function(){setPdfOk('');},5000);
    }catch(ex){setPdfErro('Erro ao ler o PDF: '+((ex&&ex.message)?ex.message:ex));}
    setPdfProcessando(false);setPdfProgresso('');e.target.value='';
  }

  // Registra a nota importada: TODOS os itens vinculados a um medicamento entram no estoque (batch
  // atômico, mesmo padrão do Recebimento Físico); os marcados "conciliado" ficam OK, os demais viram
  // divergência (aparecem no Painel de Divergências) e desaparecem sozinhos quando o estoque zerar.
  async function registrarNotaImportada(){
    var validos=pdfItens.filter(function(it){return it.medId&&(parseFloat(it.qtd)||0)>0;});
    if(validos.length===0){setPdfErro('Vincule ao menos um item a um medicamento do cadastro antes de registrar.');return;}
    setPdfSaving(true);
    try{
      var now=new Date().toISOString();
      var batch=db.batch();
      var rows=validos.map(function(it){
        var qtdNum=Math.round(parseFloat(it.qtd))||0;
        var entryRef=db.collection('entries').doc();
        batch.set(entryRef,{
          criadoEm:now,date:pdfEmissao||todayStr(),autorId:user.uid||'',autorNome:user.name||'',autorCargo:user.role||'',autorColor:user.color||B,
          tipo:'entrada',medicamentoId:it.medId,medicamentoNome:it.medNome,quantidade:qtdNum,
          lote:(it.lote||'').trim(),validade:_normValidade((it.validade||'').trim()),ean:it.cean||'',
          observacao:'Nota Fiscal '+(pdfNumero||'(a verificar)')+' — importação PDF'+(it.conciliado?'':' (divergência: não conciliado na conferência)'),
          origemConciliacaoPDF:true
        });
        return{medicamentoId:it.medId,medicamentoNome:it.medNome,qtdRecebida:qtdNum,qtdFaturada:qtdNum,vUnit:it.vUnit||0,cean:it.cean||'',status:it.conciliado?'conciliado':'divergente',lote:(it.lote||'').trim(),justificativa:'',acaoTomada:'',origemPdf:true};
      });
      var concRef=db.collection('conciliacoes').doc();
      var statusGeral=_concStatusGeral(rows);
      batch.set(concRef,{recebimentoId:'',origem:'importacao_pdf',notaNumero:(pdfNumero||'').trim(),notaSerie:'',notaDataEmissao:pdfEmissao||'',fornecedor:(pdfForn||'').trim(),valorTotal:parseFloat(String(pdfValor||'').replace(',','.'))||0,anexoURL:'',itens:rows,statusGeral:statusGeral,criadoEm:now,criadoPor:user.name||'',criadoPorId:user.uid||''});
      await batch.commit();
      var nDiv=rows.filter(function(r){return r.status==='divergente';}).length;
      var puladas=pdfItens.length-validos.length;
      logAcao('nota_pdf_importada','Nota '+(pdfNumero||'(sem número)')+' importada via PDF — '+rows.length+' item(ns), '+nDiv+' divergência(s)'+(puladas>0?', '+puladas+' sem vínculo':''),null,concRef.id);
      setPdfOk('✅ Nota importada! '+rows.length+' item(ns) somados ao estoque'+(nDiv>0?' — '+nDiv+' não conciliado(s) em Divergências.':'.')+(puladas>0?' ⚠️ '+puladas+' item(ns) sem medicamento vinculado NÃO foram registrados.':''));
      setTimeout(function(){setPdfOk('');},6000);
      setPdfItens([]);setPdfNumero('');setPdfEmissao('');setPdfForn('');setPdfValor('');
    }catch(e){setPdfErro('Erro ao registrar: '+((e&&e.message)?e.message:e));}
    setPdfSaving(false);
  }

  var pendentes=recs.filter(function(r){return (r.status||'pendente')==='pendente';});

  async function conciliar(){
    if(!recSel){alert('Selecione o recebimento a conciliar.');return;}
    if(!notaNumero.trim()){alert('Informe o número da nota fiscal.');return;}
    var faturados=nfItens.filter(function(it){return it.medId&&(parseInt(it.qtd)||0)>0;}).map(function(it){return{medicamentoId:it.medId,medicamentoNome:it.medNome,quantidade:parseInt(it.qtd)||0,lote:(it.lote||'').trim(),validade:_normValidade((it.validade||'').trim())};});
    if(faturados.length===0){alert('Adicione ao menos um item da nota fiscal.');return;}
    var rec=recs.find(function(r){return r.id===recSel;});if(!rec){alert('Recebimento não encontrado.');return;}
    setSaving(true);
    try{
      var rows=conciliarRecebimentoNota(rec.itens||[],faturados);
      var statusGeral=_concStatusGeral(rows);
      var now=new Date().toISOString();
      // Ajuste de estoque: para cada divergência, cria entry de ajuste (entrada ou saída) com a diferença
      // entre nota fiscal e recebimento físico, para que o estoque reflita a nota.
      var ajusteEntries=[];
      for(var ri=0;ri<rows.length;ri++){
        var row=rows[ri];if(row.status==='conciliado')continue;
        var diff=row.qtdFaturada-row.qtdRecebida;// positivo=nota tem mais (precisa entrada), negativo=recebido demais (precisa saída)
        if(diff===0)continue;
        var ajObj={criadoEm:now,date:todayStr(),autorId:user.uid||'',autorNome:user.name||'',autorCargo:user.role||'',autorColor:user.color||B,
          medicamentoId:row.medicamentoId,medicamentoNome:row.medicamentoNome,
          tipo:diff>0?'entrada':'saida',quantidade:Math.abs(diff),
          lote:row.lote||'',validade:'',
          observacao:'Ajuste conciliação NF '+notaNumero.trim()+' — '+(diff>0?'entrada':'saída')+' de '+Math.abs(diff)+' un. (diferença nota × recebimento)',
          origemConciliacao:true,conciliacaoRef:'pendente'};
        var ajRef=await db.collection('entries').add(ajObj);
        ajusteEntries.push({idx:ri,entryId:ajRef.id,tipo:ajObj.tipo,quantidade:ajObj.quantidade});
        rows[ri].ajusteEntryId=ajRef.id;rows[ri].ajusteTipo=ajObj.tipo;rows[ri].ajusteQtd=ajObj.quantidade;
        rows[ri].divergenciaPendente=Math.abs(diff);rows[ri].divergenciaConsumida=0;
      }
      var concRef=await db.collection('conciliacoes').add({recebimentoId:recSel,notaNumero:notaNumero.trim(),notaSerie:notaSerie.trim(),notaDataEmissao:notaEmissao||'',fornecedor:fornecedor.trim()||rec.fornecedor||'',valorTotal:parseFloat(String(valorTotal).replace(',','.'))||0,anexoURL:anexo.trim(),itens:rows,statusGeral:statusGeral,criadoEm:now,criadoPor:user.name||'',criadoPorId:user.uid||''});
      // Atualiza os entries de ajuste com o id da conciliação
      for(var ai=0;ai<ajusteEntries.length;ai++){await db.collection('entries').doc(ajusteEntries[ai].entryId).update({conciliacaoRef:concRef.id}).catch(function(){});}
      var recStatus=statusGeral==='conciliado'?'conciliado':(statusGeral==='resolvido'?'resolvido':'divergencia');
      var recLabel=statusGeral==='conciliado'?'Conciliado':(statusGeral==='resolvido'?'Resolvido':'Divergência Aberta');
      await db.collection('recebimentos').doc(recSel).update({status:recStatus,statusLabel:recLabel,conciliacaoId:concRef.id,conciliadoEm:now,conciliadoPor:user.name||''});
      logAcao('conciliacao_criada','Conciliação '+concRef.id+' — NF '+notaNumero.trim()+' × receb '+recSel+' — '+rows.length+' item(ns)',rec.status||'pendente',recStatus);
      setConcAtual({id:concRef.id,recebimentoId:recSel,notaNumero:notaNumero.trim(),itens:rows,statusGeral:statusGeral});
      // limpa o formulário
      setNotaNumero('');setNotaSerie('');setNotaEmissao('');setFornecedor('');setValorTotal('');setAnexo('');setRecSel('');setNfItens([blankNfItem()]);setFocoItem(null);
    }catch(e){alert('Erro ao conciliar: '+((e&&e.message)?e.message:e));}
    setSaving(false);
  }

  // Resolver (ou marcar em análise) uma divergência; registra ação/justificativa; se todas resolvidas -> statusGeral 'resolvido'.
  // Nenhuma divergência é apagada — só recebe uma nova ação (histórico completo fica no item + no log de auditoria).
  async function resolver(idx,acao,justificativa){
    if(!concAtual)return;
    if(acao==='Registrar justificativa'&&!(justificativa||'').trim()){alert('Digite a justificativa antes de registrar.');return;}
    var antes=concAtual.itens[idx];
    var statusFluxoAntes=_concItemStatusFluxo(antes);
    var novos=concAtual.itens.map(function(it,i){
      if(i!==idx)return it;
      if(acao==='Marcar em análise')return Object.assign({},it,{emAnalise:true});
      return Object.assign({},it,{acaoTomada:acao,justificativa:(justificativa||it.justificativa||''),emAnalise:false});
    });
    var sg=_concStatusGeral(novos);
    var statusFluxoDepois=_concItemStatusFluxo(novos[idx]);
    try{
      await db.collection('conciliacoes').doc(concAtual.id).update({itens:novos,statusGeral:sg});
      if(sg==='resolvido'){await db.collection('recebimentos').doc(concAtual.recebimentoId).update({status:'resolvido',statusLabel:'Resolvido'});}
      logAcao('conciliacao_divergencia_resolvida','Conciliação '+concAtual.id+' — item '+(novos[idx].medicamentoNome||'')+' — ação: '+acao+(justificativa?' — just: '+justificativa:''),statusFluxoAntes,statusFluxoDepois);
      setConcAtual(Object.assign({},concAtual,{itens:novos,statusGeral:sg}));
    }catch(e){alert('Erro ao registrar: '+((e&&e.message)?e.message:e));}
  }

        <label style={{display:'block',cursor:pdfProcessando?'default':'pointer'}}>
          <div style={{border:'2px dashed #1351B4',borderRadius:10,padding:'16px',textAlign:'center',background:'#EFF6FF',marginBottom:8,opacity:pdfProcessando?0.6:1}}>

          </div>

        {pdfOk&&<div style={{background:'#DCFCE7',border:'1px solid #86EFAC',borderRadius:10,padding:'10px 12px',fontSize:13,color:'#059669',fontWeight:600,marginBottom:8}}>{pdfOk}</div>}
        {pdfErro&&<div style={{background:'#FEE2E2',border:'1px solid #FCA5A5',borderRadius:10,padding:'10px 12px',fontSize:13,color:'#DC2626',fontWeight:600,marginBottom:8}}>{pdfErro}</div>}

        {pdfItens.length>0&&<div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
            <div><label style={lbl}>Número da NF</label><input value={pdfNumero} onChange={function(e){setPdfNumero(e.target.value);}} placeholder="Ex: 12345" style={inp}/></div>
            <div><label style={lbl}>Data de emissão</label><input type="date" value={pdfEmissao} onChange={function(e){setPdfEmissao(e.target.value);}} style={inp}/></div>

          </div>

              var sug=(!it.medId&&it.busca.trim())?_fuzzyMeds(it.busca,medications,8):[];
              var statusBadge=it.medId?(it.conciliado?{txt:'✅ Conciliado',cor:'#059669',bg:'#DCFCE7'}:{txt:'⚠️ Não conciliado',cor:'#B45309',bg:'#FEF3C7'}):{txt:'❌ Sem vínculo',cor:'#DC2626',bg:'#FEE2E2'};
              return(<div key={it.key} style={{background:it.conciliado?'#F0FDF4':'#FFFBEB',borderRadius:12,padding:12,border:'1px solid '+(it.conciliado?'#BBF7D0':'#FDE68A')}}>

                  </div>
                  <button onClick={function(){delPdfItem(it.key);}} style={{background:'#FEE2E2',border:'none',borderRadius:8,width:28,height:28,cursor:'pointer',fontSize:13,color:'#DC2626',flexShrink:0}}>✕</button>
                </div>
                <div style={{marginBottom:8}}><span style={{display:'inline-block',fontSize:11,fontWeight:800,color:statusBadge.cor,background:statusBadge.bg,borderRadius:6,padding:'2px 8px'}}>{statusBadge.txt}</span></div>
                {it.medId?

                    {/* Sugestões automáticas (mesmo matcher de siglas+concentração usado em Gerenciar Atas/Comparação de Pedido) */}
                    {it.sugestoes&&it.sugestoes.length>0&&<div style={{marginBottom:8}}>
                      <div style={{fontSize:11,color:'#64748B',marginBottom:4}}>🔎 Parecidos no cadastro:</div>
                      <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                        {it.sugestoes.slice(0,4).map(function(x){return(<button key={x.m.id} onClick={function(){escolherMedPdf(it.key,x.m);}} style={{background:'#EFF6FF',border:'1px solid #BFDBFE',borderRadius:7,padding:'5px 10px',fontSize:11,color:B,fontWeight:600,cursor:'pointer'}}>{x.m.nome}</button>);})}

                      {pdfFoco===it.key&&sug.length>0&&<div style={{position:'absolute',top:'100%',left:0,right:0,background:'#fff',border:'1.5px solid #E2E8F0',borderRadius:10,marginTop:4,zIndex:20,maxHeight:200,overflowY:'auto',boxShadow:'0 8px 24px rgba(0,0,0,.12)'}}>
                        {sug.map(function(x){var m=x.m;return<button key={m.id} onClick={function(){escolherMedPdf(it.key,m);}} style={{width:'100%',textAlign:'left',padding:'10px 12px',border:'none',borderBottom:'1px solid #F1F5F9',background:'#fff',cursor:'pointer',fontSize:13,color:'#1E293B'}}>{m.nome}</button>;})}
                      </div>}
                      {pdfFoco===it.key&&it.busca.trim()&&sug.length===0&&<div style={{fontSize:11,color:'#94A3B8',marginTop:4}}>Nenhum medicamento encontrado no cadastro.</div>}
                    </div>
                  </div>}
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:8}}>
                  <div><label style={lbl}>Qtd</label><input type="number" min="1" inputMode="numeric" value={it.qtd} onChange={function(e){setPdfItem(it.key,{qtd:e.target.value.replace(/[^0-9]/g,'')});}} style={inp}/></div>
                  <div><label style={lbl}>Lote</label><input value={it.lote} onChange={function(e){setPdfItem(it.key,{lote:e.target.value});}} placeholder="Lote" style={inp}/></div>
                  <div><label style={lbl}>Validade</label><input value={it.validade} onChange={function(e){setPdfItem(it.key,{validade:e.target.value});}} placeholder="MM/AAAA" inputMode="numeric" style={inp}/></div>
                </div>
                <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
                  <input type="checkbox" checked={!!it.conciliado} onChange={function(){toggleConciliadoPdf(it.key);}} style={{width:18,height:18}}/>
                  <span style={{fontSize:13,fontWeight:700,color:it.conciliado?'#059669':'#B45309'}}>{it.conciliado?'✅ Conciliado — confere com a nota':'⚠️ Não conciliado — vai para Divergências'}</span>
                </label>
              </div>);
            })}
          </div>
          <button onClick={registrarNotaImportada} disabled={pdfSaving} style={{marginTop:12,width:'100%',padding:'14px',background:pdfSaving?'#94A3B8':'#0C6B3E',border:'none',borderRadius:12,color:'#fff',fontWeight:800,fontSize:15,cursor:pdfSaving?'default':'pointer'}}>{pdfSaving?'Registrando...':'✅ Registrar Nota Importada'}</button>
        </div>}

      <div style={{background:'#fff',borderRadius:16,padding:16,boxShadow:'0 2px 12px rgba(0,0,0,.06)',border:'1px solid #F1F5F9',marginBottom:16}}>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>

          <div><label style={lbl}>Série</label><input value={notaSerie} onChange={function(e){setNotaSerie(e.target.value);}} placeholder="Ex: 1" style={inp}/></div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
          <div><label style={lbl}>Data de emissão</label><input type="date" value={notaEmissao} onChange={function(e){setNotaEmissao(e.target.value);}} style={inp}/></div>
          <div><label style={lbl}>Valor total (R$)</label><input value={valorTotal} onChange={function(e){setValorTotal(e.target.value.replace(/[^0-9.,]/g,''));}} inputMode="decimal" placeholder="0,00" style={inp}/></div>

        <div style={{marginBottom:10}}><label style={lbl}>Anexo (URL do PDF/XML, opcional)</label><input value={anexo} onChange={function(e){setAnexo(e.target.value);}} placeholder="Cole o link do PDF/XML (opcional)" style={inp}/></div>
        <div data-tour="conc-selecionar-receb" style={{marginBottom:4}}><label style={lbl}>Recebimento a vincular * <span style={{fontWeight:500,color:'#94A3B8'}}>(só pendentes)</span></label>
          <select value={recSel} onChange={function(e){setRecSel(e.target.value);}} style={Object.assign({},inp,{background:'#fff'})}>
            <option value="">Selecione um recebimento pendente...</option>
            {pendentes.map(function(r){return<option key={r.id} value={r.id}>{fD(r.data)} · {r.fornecedor||'—'} · {(r.itens||[]).length} item(ns)</option>;})}
          </select>
          {pendentes.length===0&&<div style={{fontSize:11,color:'#94A3B8',marginTop:4}}>Nenhum recebimento pendente de conciliação.</div>}
        </div>

      <div style={{background:'#fff',borderRadius:16,padding:16,boxShadow:'0 2px 12px rgba(0,0,0,.06)',border:'1px solid #F1F5F9',marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:14,color:'#334155',marginBottom:10}}>Itens da nota fiscal</div>

          {nfItens.map(function(it,idx){

                  {focoItem===it.key&&sug.length>0&&<div style={{position:'absolute',top:'100%',left:0,right:0,background:'#fff',border:'1.5px solid #E2E8F0',borderRadius:10,marginTop:4,zIndex:20,maxHeight:200,overflowY:'auto',boxShadow:'0 8px 24px rgba(0,0,0,.12)'}}>

              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>

              </div>
            </div>);
          })}
        </div>
        <button onClick={addNf} style={{marginTop:10,width:'100%',padding:'11px',background:'#EFF6FF',border:'1.5px dashed #BFDBFE',borderRadius:10,color:B,fontWeight:700,fontSize:13,cursor:'pointer'}}>+ Adicionar item</button>
        <button data-tour="conc-conciliar" onClick={conciliar} disabled={saving} style={{marginTop:12,width:'100%',padding:'14px',background:saving?'#94A3B8':B,border:'none',borderRadius:12,color:'#fff',fontWeight:800,fontSize:15,cursor:saving?'default':'pointer'}}>{saving?'Conciliando...':'🔍 Conciliar'}</button>
      </div>

      {/* RESULTADO DA CONCILIAÇÃO */}
      {concAtual&&(function(){var gi=_concGeralInfo(concAtual.statusGeral);return(
        <div style={{background:'#fff',borderRadius:16,padding:16,boxShadow:'0 2px 12px rgba(0,0,0,.06)',border:'1px solid #F1F5F9',marginBottom:16}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4,flexWrap:'wrap',gap:8}}>
            <div style={{fontWeight:800,fontSize:15,color:'#1E293B'}}>Resultado da conciliação</div>

  // Auditoria: toda ação loga usuário/data/hora/ação + valor anterior/novo. logs_acesso NUNCA é apagado.
  function logAcao(acao,detalhe,valorAnterior,valorNovo){

  }
  function setItem(key,patch){setItens(function(arr){return arr.map(function(it){return it.key===key?Object.assign({},it,patch):it;});});}
  function addItem(){setItens(function(arr){return arr.concat([blankItem()]);});}
  function delItem(key){setItens(function(arr){return arr.length<=1?arr:arr.filter(function(it){return it.key!==key;});});}
  function escolherMed(key,m){setItem(key,{medId:m.id,medNome:m.nome,busca:''});setFocoItem(null);}
  // Cadastro rápido (Mudança 2): abre o formulário já com o nome digitado na busca do item.
  function abrirNovoMed(key){var it=itens.find(function(x){return x.key===key;});setNovoMedKey(key);setNmNome(it&&it.busca?it.busca.trim():'');setNmTipo('medicamento');setNmMin('');setNmEan('');}
  function salvarNovoMed(){
    var nome=(nmNome||'').trim();
    if(!nome){alert('Informe o nome do medicamento.');return;}
    setNmSaving(true);
    db.collection('medicamentos').add({nome:nome,ean:(nmEan||'').trim(),minEstoque:parseInt(nmMin)||0,categoria:nmTipo,criadoEm:new Date().toISOString(),criadoPor:user.name||''})
      .then(function(ref){

        setNovoMedKey(null);setNmNome('');setNmEan('');setNmMin('');setNmTipo('medicamento');setNmSaving(false);
      }).catch(function(e){alert('Erro ao cadastrar medicamento: '+((e&&e.message)||e));setNmSaving(false);});

  // Confirmação antes de finalizar (Mudança 3): valida e abre o modal; só finaliza no "Confirmar".
  function pedirConfirmacaoFinalizar(){
    var validos=itens.filter(function(it){return it.medId&&(parseInt(it.qtd)||0)>0;});
    if(validos.length===0){alert('Adicione ao menos um medicamento com quantidade.');return;}
    setConfirmFin(true);
  }

  async function finalizar(){
    var validos=itens.filter(function(it){return it.medId&&(parseInt(it.qtd)||0)>0;});
    if(validos.length===0){alert('Adicione ao menos um medicamento com quantidade.');return;}
    setSaving(true);
    console.group('%c📦 finalizar() Recebimento','background:#1351B4;color:#fff;padding:3px 8px;border-radius:4px;font-weight:bold');
    console.log('Fornecedor:',fornecedor.trim(),'| Itens:',validos.length,'| Data:',data);
    try{
      var now=new Date().toISOString();
      // BATCH ATÔMICO — SÓ o dado crítico: as entries (movimento de estoque) + o doc do recebimento.
      // Regra de ouro: o único jeito de as entries não subirem o estoque é o batch inteiro falhar, e
      // o batch só contém escritas que SEMPRE são permitidas (add de entries + add do recebimento).
      //
      // POR QUE loteAtual/validadeAtual saíram do batch: no #41 eu tinha posto batch.update() nos
      // medicamentos DENTRO deste batch. Mas update() FALHA se o doc do medicamento não existir (deletado,
      // id órfão, cache stale). Como o batch é atômico, esse update falho DERRUBAVA TODAS as entries junto
      // — bastava UM item do recebimento referenciar um med problemático pra NENHUM item subir o estoque.
      // Agora o update do cadastro é best-effort DEPOIS do commit (com .catch) — cosmético, nunca bloqueia.
      var batch=db.batch();
      var recRef=db.collection('recebimentos').doc();  // gera id sem escrever ainda
      var recId=recRef.id;
      var itensComEntry=[];
      var lotesParaAtualizar=[];
      for(var i=0;i<validos.length;i++){
        var it=validos[i];
        var medCad=medications.find(function(m){return m.id===it.medId;});
        var catMed=(medCad&&medCad.categoria)||'medicamento';
        var qtdNum=parseInt(it.qtd)||0;
        var loteTrim=(it.lote||'').trim();
        var valNorm=_normValidade((it.validade||'').trim());
        var entryRef=db.collection('entries').doc();
        var entryObj={
          criadoEm:now,date:data,autorId:user.uid||'',autorNome:user.name||user.email||'',
          autorCargo:user.role||'',autorColor:user.color||B,
          tipo:'entrada',medicamentoId:it.medId,medicamentoNome:it.medNome,
          quantidade:qtdNum,lote:loteTrim,validade:valNorm,
          observacao:'Recebimento — '+fornecedor.trim(),
          origemRecebimento:true,recebimentoId:recId,categoriaMed:catMed
        };
        for(var _k in entryObj)if(entryObj[_k]===undefined)delete entryObj[_k];
        batch.set(entryRef,entryObj);
        console.log('  →',it.medNome,'| qtd',qtdNum,'| lote',loteTrim||'—','| val',valNorm||'—','| entryId',entryRef.id);
        itensComEntry.push({medicamentoId:it.medId,medicamentoNome:it.medNome,quantidade:qtdNum,lote:loteTrim,validade:valNorm,observacao:(it.obs||'').trim(),entryId:entryRef.id});
        if(loteTrim&&valNorm)lotesParaAtualizar.push({medId:it.medId,lote:loteTrim,validade:valNorm});
      }
      // Doc do recebimento JÁ COM os entryIds preenchidos (não precisa de update depois).
      batch.set(recRef,{data:data,fornecedor:fornecedor.trim(),responsavel:(responsavel||user.name||'').trim(),responsavelId:user.uid||'',status:'pendente',statusLabel:'Pendente de Conciliação Fiscal',totalItens:validos.length,itens:itensComEntry,criadoEm:now,criadoPor:user.name||'',criadoPorId:user.uid||''});
      console.log('Committing batch: '+validos.length+' entries + 1 recebimento (updates de cadastro ficam FORA do batch)...');
      await batch.commit();
      console.log('%c✅ Batch commitado com SUCESSO — estoque atualizado. Recebimento: '+recId,'color:#0C6B3E;font-weight:bold');
      // Best-effort (fora do batch): atualiza loteAtual/validadeAtual do cadastro (LIFO). Se falhar (med
      // deletado etc.), NÃO afeta o estoque — a entry já foi criada. Cada update é isolado com .catch.
      lotesParaAtualizar.forEach(function(x){db.collection('medicamentos').doc(x.medId).update({loteAtual:x.lote,validadeAtual:x.validade}).catch(function(err){console.warn('loteAtual não atualizado p/',x.medId,'(cosmético, estoque OK):',err&&err.message);});});
      console.groupEnd();
      logAcao('recebimento_criado','Recebimento '+recId+' — forn: '+fornecedor.trim()+' — '+validos.length+' item(ns) — resp: '+(responsavel||user.name||''),null,'pendente');
      setFornecedor('');setResponsavel(user.name||'');setData(todayStr());setItens([blankItem()]);setFocoItem(null);
      setOk('✅ Recebimento finalizado — estoque atualizado e disponível para dispensação.');
      setTimeout(function(){setOk('');},4500);
    }catch(e){
      console.error('%c❌ Batch FALHOU — nada foi escrito','color:#DC2626;font-weight:bold',e);
      console.log('  code:',(e&&e.code)||'(sem code)','| message:',(e&&e.message)||String(e));
      console.groupEnd();
      alert('Erro ao finalizar recebimento: '+((e&&e.message)?e.message:e)+'\n\n(Abra F12 → Console pra ver os detalhes. Nada foi salvo — pode tentar de novo.)');
    }
    setSaving(false);
  }

  async function cancelar(){
    var just=(cancelJust||'').trim();
    if(just.length<5){alert('A justificativa é obrigatória (mín. 5 caracteres).');return;}
    var rec=cancelRec;if(!rec)return;
    setCancelSaving(true);
    try{
      var now=new Date().toISOString();
      // BATCH ATÔMICO: se qualquer op falhar, NADA é commitado. Antes: loop sequencial com await por item;
      // se um estorno falhasse, o catch pegava e o update({status:'cancelado'}) NUNCA era chamado,
      // deixando o recebimento marcado como "pendente" mesmo depois do usuário clicar "Cancelar".
      var batch=db.batch();
      var itens=rec.itens||[];
      for(var i=0;i<itens.length;i++){
        var it=itens[i];
        // Sanitiza cada entry: filtra qualquer undefined pra não repetir "Unsupported field value: undefined".
        var entryObj={tipo:'saida',medicamentoId:it.medicamentoId||'',medicamentoNome:it.medicamentoNome||'',quantidade:parseInt(it.quantidade)||0,lote:it.lote||'',validade:it.validade||'',observacao:'Estorno de recebimento cancelado — '+(rec.fornecedor||''),isAjuste:true,estornoRecebimento:true,recebimentoId:rec.id,criadoEm:now,date:todayStr(),autorId:user.uid||'',autorNome:user.name||'',autorCargo:user.role||'',autorColor:user.color||B};
        for(var _k in entryObj)if(entryObj[_k]===undefined)delete entryObj[_k];
        batch.set(db.collection('entries').doc(),entryObj);
      }
      batch.update(db.collection('recebimentos').doc(rec.id),{status:'cancelado',statusLabel:'Cancelado',justificativaCancelamento:just,canceladoEm:now,canceladoPor:user.name||'',canceladoPorId:user.uid||''});
      await batch.commit();
      logAcao('recebimento_cancelado','Recebimento '+rec.id+' — forn: '+(rec.fornecedor||'')+' — estorno de '+itens.length+' item(ns) — motivo: '+just,rec.status||'pendente','cancelado');
      setCancelRec(null);setCancelJust('');setDetalhe(null);
    }catch(e){alert('Erro ao cancelar: '+((e&&e.message)?e.message:e));}
    setCancelSaving(false);
  }
  // Duplicar recebimento: pré-preenche o formulário de novo recebimento com os itens de um existente
  // (inclusive cancelado), pra economizar digitação e recuperar recebimentos perdidos por erro.
  // Não copia o status/id — o usuário só clica "Finalizar" pra criar um novo recebimento independente.
  function duplicar(rec){
    if(!rec)return;
    setFornecedor(rec.fornecedor||'');
    setResponsavel(user.name||'');// responsável do novo recebimento é quem está duplicando
    setData(todayStr());// data padrão hoje (o usuário pode ajustar)
    var novos=(rec.itens||[]).map(function(it){_recSeq++;return{key:'it'+_recSeq,medId:it.medicamentoId||'',medNome:it.medicamentoNome||'',busca:'',qtd:String(it.quantidade||''),lote:it.lote||'',validade:it.validade||'',obs:it.observacao||''};});
    setItens(novos.length?novos:[blankItem()]);
    setFocoItem(null);setDetalhe(null);setAba('fisico');
    setOk('📋 Formulário pré-preenchido a partir do recebimento anterior. Revise e clique em "Finalizar" para salvar.');
    setTimeout(function(){setOk('');},6000);
    // Rola pro topo do formulário
    setTimeout(function(){try{window.scrollTo({top:0,behavior:'smooth'});}catch(_){window.scrollTo(0,0);}},50);
  }

  // ── Verificação e recuperação de estoque ─────────────────────────────
  // Consulta o Firestore DIRETO (autoritativo, não depende da janela de 3 dias do App) para descobrir
  // itens de recebimento que nunca viraram entrada no estoque (batch parcial de bugs anteriores).
  async function verificarRecebimentos(){
    setVerif({loading:true});
    try{
      var recsSnap=await db.collection('recebimentos').limit(1000).get();
      var ativos=[];recsSnap.forEach(function(d){var o={id:d.id};var data=d.data();for(var k in data)o[k]=data[k];if((o.status||'pendente')!=='cancelado')ativos.push(o);});
      var entSnap=await db.collection('entries').where('origemRecebimento','==',true).get();
      var porRec={};// recebimentoId -> { medicamentoId: qtdSomada }
      entSnap.forEach(function(d){var e=d.data();if(!e.recebimentoId||e.tipo!=='entrada')return;if(!porRec[e.recebimentoId])porRec[e.recebimentoId]={};porRec[e.recebimentoId][e.medicamentoId]=(porRec[e.recebimentoId][e.medicamentoId]||0)+(Number(e.quantidade)||0);});
      var faltantes=[];
      ativos.forEach(function(r){
        (r.itens||[]).forEach(function(it){
          if(!it.medicamentoId)return;
          var jaTem=porRec[r.id]&&porRec[r.id][it.medicamentoId];
          if(!jaTem)faltantes.push({recId:r.id,fornecedor:r.fornecedor||'',data:r.data||'',medicamentoId:it.medicamentoId,medicamentoNome:it.medicamentoNome||'?',quantidade:parseInt(it.quantidade)||0,lote:it.lote||'',validade:it.validade||''});
        });
      });
      setVerif({faltantes:faltantes,totalRec:ativos.length});
    }catch(e){setVerif({erro:(e&&e.message)||String(e)});}
  }
  async function recuperarFaltantes(){
    var f=(verif&&verif.faltantes)||[];if(!f.length)return;
    setVerif(Object.assign({},verif,{recuperando:true}));
    try{
      var now=new Date().toISOString();var CHUNK=400;var criadas=0;
      for(var ci=0;ci<f.length;ci+=CHUNK){
        var batch=db.batch();
        f.slice(ci,ci+CHUNK).forEach(function(x){
          var medCad=medications.find(function(m){return m.id===x.medicamentoId;});
          var catMed=(medCad&&medCad.categoria)||'medicamento';
          var obj={criadoEm:now,date:x.data||todayStr(),autorId:user.uid||'',autorNome:user.name||'(recuperação)',autorCargo:user.role||'',autorColor:user.color||B,tipo:'entrada',medicamentoId:x.medicamentoId,medicamentoNome:x.medicamentoNome,quantidade:x.quantidade,lote:x.lote||'',validade:x.validade||'',observacao:'Recebimento — '+(x.fornecedor||'')+' (recuperação de entrada perdida)',origemRecebimento:true,recebimentoId:x.recId,categoriaMed:catMed};
          for(var _k in obj)if(obj[_k]===undefined)delete obj[_k];
          batch.set(db.collection('entries').doc(),obj);
        });
        await batch.commit();
        criadas+=f.slice(ci,ci+CHUNK).length;
      }
      logAcao('recebimento_recuperado','Recuperação de '+criadas+' entrada(s) de estoque perdida(s) em recebimentos',null,null);
      setVerif({recuperado:criadas});
    }catch(e){setVerif(Object.assign({},verif,{erro:(e&&e.message)||String(e),recuperando:false}));}
  }

  var listaFiltrada=recs.filter(function(r){
    if(fDe&&(r.data||'')<fDe)return false;
    if(fAte&&(r.data||'')>fAte)return false;
    if(fForn&&!(r.fornecedor||'').toLowerCase().includes(fForn.toLowerCase()))return false;
    if(fStatus!=='todos'&&(r.status||'pendente')!==fStatus)return false;

  });

      {aba==='notas'&&<ImportarNotas user={user} medications={medications} stock={stock}/>}

      {aba==='fisico'&&<div>

        <div style={{fontWeight:800,fontSize:15,color:'#1E293B',marginBottom:12}}>Novo recebimento</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
          <div><label style={lbl}>📅 Data do recebimento</label><input type="date" value={data} max={todayStr()} onChange={function(e){setData(e.target.value);}} style={inp}/></div>
          <div><label style={lbl}>Fornecedor (opcional)</label><input value={fornecedor} onChange={function(e){setFornecedor(e.target.value);}} placeholder="Nome do fornecedor" style={inp}/></div>

        <div style={{fontWeight:700,fontSize:13,color:'#334155',marginBottom:8}}>Medicamentos recebidos</div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {itens.map(function(it,idx){
            var sug=(!it.medId&&it.busca.trim())?_fuzzyMeds(it.busca,medications,8):[];
            return(<div key={it.key} style={{background:'#F8FAFC',borderRadius:12,padding:12,border:'1px solid #E2E8F0'}}>

                  <button onClick={function(){setItem(it.key,{medId:'',medNome:'',busca:''});setFocoItem(it.key);}} style={{background:'#fff',border:'1px solid #BFDBFE',borderRadius:8,padding:'4px 10px',fontSize:11,color:B,cursor:'pointer',fontWeight:600}}>Trocar</button>
                </div>
                :<div style={{position:'relative',marginBottom:8}}>

            <div style={{borderTop:'1px solid #F1F5F9',paddingTop:14,display:'flex',flexDirection:'column',gap:8}}>

          <div style={{fontWeight:800,fontSize:17,color:'#DC2626',marginBottom:6}}>Cancelar recebimento</div>

          <textarea value={cancelJust} onChange={function(e){setCancelJust(e.target.value);}} rows={3} placeholder="Justificativa do cancelamento..." style={{width:'100%',padding:'12px',borderRadius:10,border:'1.5px solid #FECACA',fontSize:13,resize:'none',boxSizing:'border-box',marginBottom:12}}/>

      {/* MODAL — resultado da verificação/recuperação de estoque */}

            <div style={{textAlign:'center'}}>
              <div style={{fontSize:44,marginBottom:8}}>✅</div>
              <div style={{fontWeight:800,fontSize:17,color:'#0C6B3E',marginBottom:6}}>{verif.recuperado} entrada(s) recuperada(s)!</div>
              <div style={{fontSize:13,color:'#64748B',marginBottom:18}}>O estoque foi atualizado. Os medicamentos que faltavam já devem aparecer na aba Estoque com o saldo correto.</div>
              <button onClick={function(){setVerif(null);}} style={{width:'100%',padding:'12px',background:'#0C6B3E',border:'none',borderRadius:10,color:'#fff',fontWeight:700,fontSize:14,cursor:'pointer'}}>Concluído</button>
            </div>
          :(verif.faltantes&&verif.faltantes.length===0)?
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:44,marginBottom:8}}>✅</div>
              <div style={{fontWeight:800,fontSize:17,color:'#0C6B3E',marginBottom:6}}>Tudo certo!</div>
              <div style={{fontSize:13,color:'#64748B',marginBottom:18}}>Todos os {verif.totalRec} recebimento(s) ativos têm suas entradas no estoque. Nada a recuperar.</div>
              <div style={{fontSize:12,color:'#94A3B8',marginBottom:16,background:'#F8FAFC',borderRadius:8,padding:'10px 12px',textAlign:'left'}}>Se mesmo assim um medicamento não aparece com o saldo esperado na aba Estoque, pode ser que ele esteja cadastrado em <strong>outra categoria</strong> (confira o filtro de categoria) ou com <strong>nome ligeiramente diferente</strong>. Me avise qual medicamento pra eu investigar.</div>
              <button onClick={function(){setVerif(null);}} className="bs" style={{width:'100%',padding:'11px'}}>Fechar</button>
            </div>
          :
            <div>
              <div style={{fontWeight:800,fontSize:16,color:'#B45309',marginBottom:4}}>⚠️ {verif.faltantes.length} item(ns) sem entrada no estoque</div>
              <div style={{fontSize:12,color:'#64748B',marginBottom:12}}>Estes itens foram cadastrados em recebimentos mas nunca creditaram o estoque (bug de salvamento anterior). Clique em recuperar pra criar as entradas — o estoque será atualizado.</div>
              <div style={{maxHeight:300,overflowY:'auto',border:'1px solid #E2E8F0',borderRadius:10,marginBottom:14}}>
                {verif.faltantes.map(function(x,i){return(
                  <div key={i} style={{padding:'9px 12px',borderBottom:i<verif.faltantes.length-1?'1px solid #F1F5F9':'none',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:700,color:'#1E293B'}}>{x.medicamentoNome}</div>
                      <div style={{fontSize:10,color:'#94A3B8'}}>{x.fornecedor||'—'} · {fD(x.data)}{x.lote?' · Lote '+x.lote:''}{x.validade?' · Val '+x.validade:''}</div>
                    </div>
                    <span style={{fontSize:13,fontWeight:800,color:'#0C6B3E',whiteSpace:'nowrap'}}>+{x.quantidade}</span>
                  </div>);
                })}
              </div>
              <div style={{display:'flex',gap:8}}>
                <button onClick={function(){setVerif(null);}} disabled={verif.recuperando} className="bs" style={{flex:1,padding:'12px'}}>Fechar</button>
                <button onClick={recuperarFaltantes} disabled={verif.recuperando} style={{flex:2,padding:'12px',background:verif.recuperando?'#94A3B8':'#0C6B3E',border:'none',borderRadius:10,color:'#fff',fontWeight:700,fontSize:14,cursor:'pointer'}}>{verif.recuperando?'⏳ Recuperando...':'✅ Recuperar '+verif.faltantes.length+' entrada(s)'}</button>
              </div>
            </div>
          }
        </div>
      </div>}
    </div>
  );
}

// ===== Aba de Pacientes (controlados): lista + busca + histórico de saídas vinculadas =====
function TabPacientes(props){
  var user=props.user;
  var podeExcluir=user.role==='tecnico'||user.role==='gestor';
  var _pacientes=useState([]);var pacientes=_pacientes[0];var setPacientes=_pacientes[1];
  var _saidas=useState([]);var saidas=_saidas[0];var setSaidas=_saidas[1];
  var _busca=useState('');var busca=_busca[0];var setBusca=_busca[1];
  var _fDe=useState('');var fDe=_fDe[0];var setFDe=_fDe[1];
  var _fAte=useState('');var fAte=_fAte[0];var setFAte=_fAte[1];
  var _sel=useState(null);var sel=_sel[0];var setSel=_sel[1];
  var _showNovo=useState(false);var showNovo=_showNovo[0];var setShowNovo=_showNovo[1];
  var _novoNome=useState('');var novoNome=_novoNome[0];var setNovoNome=_novoNome[1];
  var _novoSaving=useState(false);var novoSaving=_novoSaving[0];var setNovoSaving=_novoSaving[1];
  var _novoErro=useState('');var novoErro=_novoErro[0];var setNovoErro=_novoErro[1];

  useEffect(function(){
    var u1=db.collection('pacientes_controlados').onSnapshot(function(snap){
      var arr=[];snap.forEach(function(d){arr.push(Object.assign({id:d.id},d.data()));});
      arr.sort(function(a,b){return (a.nome||'').localeCompare(b.nome||'');});
      setPacientes(arr);
    },function(){});
    var u2=db.collection('saidas_controladas').orderBy('criadoEm','desc').limit(1000).onSnapshot(function(snap){
      setSaidas(snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}));
    },function(){});
    return function(){try{u1();}catch(e){}try{u2();}catch(e){}};
  },[]);

  function saidasDe(pacienteId){
    return saidas.filter(function(s){
      if(s.pacienteId!==pacienteId)return false;
      if(fDe&&(s.dataSaida||'')<fDe)return false;
      if(fAte&&(s.dataSaida||'')>fAte)return false;
      return true;
    }).sort(function(a,b){return (b.dataSaida||'').localeCompare(a.dataSaida||'')||(b.criadoEm||'').localeCompare(a.criadoEm||'');});
  }

  // Mostra TODOS os pacientes cadastrados — com histórico de saída primeiro (mais recente primeiro),
  // depois os sem nenhuma saída ainda (ordem alfabética).
  var q=busca.trim().toLowerCase();

function checkShift(u){if(shiftChecked)return;setShiftChecked(true);autoFecharPlantoesAntigos();var today=todayStr();var role=u.role;if(role==='gestor'||role==='tecnico'){setIsGuest(false);db.collection('plantoes').doc(today).get().then(function(snap){if(snap.exists&&snap.data().ativo!==false){var p=snap.data();setPlantao(p);setShiftId(today);}else{setPlantao(null);setShiftId(null);}}).catch(function(){});return;}if(!isShiftTime()){setIsGuest(true);return;}var leftKey='fc_shift_saiu_'+today;var encKey='fc_shift_enc_'+today;var leftToday=localStorage.getItem(encKey)||localStorage.getItem(leftKey);if(leftToday){db.collection('plantoes').doc(today).get().then(function(snap){if(snap.exists&&snap.data().ativo!==false){var p=snap.data();setPlantao(p);setShiftId(today);var readicionado=false;if(p.iniciadoPor===u.uid){readicionado=true;}else if(p.equipe){for(var j=0;j<p.equipe.length;j++){if(p.equipe[j].id===u.uid&&p.equipe[j].status==='confirmado'){readicionado=true;break;}}}if(readicionado){localStorage.removeItem(leftKey);localStorage.removeItem(encKey);setIsGuest(false);}else{setIsGuest(true);}}else{setIsGuest(true);}}).catch(function(){setIsGuest(true);});return;}db.collection('plantao_convites').where('para','==',u.uid).where('status','==','pendente').get().then(function(invSnap){var todayInvite=null;for(var i=0;i<invSnap.docs.length;i++){var d=invSnap.docs[i].data();if(d.data===today){var o={id:invSnap.docs[i].id};for(var k in d)o[k]=d[k];todayInvite=o;break;}}if(todayInvite){setPendingInvite(todayInvite);return;}db.collection('plantoes').doc(today).get().then(function(snap){if(snap.exists&&snap.data().ativo!==false){var p=snap.data();setPlantao(p);setShiftId(today);var inTeam=false;

function aprovarEntradaPlantao(sol){var hoje=todayStr();var novoMembro={id:sol.de,nome:sol.deNome,cargo:sol.deCargo,color:sol.deColor,status:'confirmado'};var equipeAtual=plantao?plantao.equipe||[]:[];var jaEsta=equipeAtual.some(function(m){return m.id===sol.de;});var novaEquipe=jaEsta?equipeAtual:equipeAtual.concat([novoMembro]);db.collection('plantoes').doc(hoje).update({equipe:novaEquipe}).then(function(){db.collection('plantao_solicitacoes').doc(sol.id).update({status:'aprovado'});if(plantao){var p={};for(var k in plantao)p[k]=plantao[k];p.equipe=novaEquipe;setPlantao(p);}playSound('success');});}

function addSolicitacao(data){var obj={medicamentoId:data.medicamentoId,medicamentoNome:data.medicamentoNome,ean:data.ean||'',tipo:data.tipo,quantidade:data.quantidade,lote:data.lote||'',validade:_normValidade(data.validade||''),observacao:data.observação||'',solicitanteId:user.uid,solicitanteNome:user.name,solicitanteCargo:user.role,solicitanteColor:user.color||B,status:'pendente',criadoEm:new Date().toISOString(),origem:'convidado'};return db.collection('solicitacoes').add(obj);}
function addEntry(data){try{var obj={criadoEm:new Date().toISOString(),date:todayStr(),autorId:user.uid,autorNome:user.name||user.email,autorCargo:user.role||'',autorColor:user.color||B};for(var k in data)obj[k]=data[k];if(obj.quantidade!==undefined)obj.quantidade=Number(obj.quantidade)||0;
  if(obj.validade)obj.validade=_normValidade(obj.validade);// normaliza MM/AA -> MM/AAAA
  // Defesa contra "Unsupported field value: undefined" — remove qualquer campo com valor undefined que
  // um chamador tenha deixado passar (ex.: categoriaMed vindo de um cadastro antigo sem categoria).
  for(var _k in obj)if(obj[_k]===undefined)delete obj[_k];
  var promise=db.collection('entries').add(obj);
  // Bug: medicamentos com entradas de Recebimento (que trazem lote/validade) apareciam com "Sem lote/
  // validade no cadastro — atribuir" no TabEstoque, porque loteAtual/validadeAtual no doc do medicamento
  // nunca eram atualizados por entrada. Correção: em toda entrada com lote+validade preenchidos, atualiza
  // o cadastro. LIFO (último lote recebido vira o "atual"). NÃO afeta o cálculo FEFO da saída — este só
  // olha as ENTRIES (entrada - saída por lote), não o loteAtual/validadeAtual do cadastro.
  if(obj.tipo==='entrada'&&obj.medicamentoId&&obj.lote&&obj.validade&&!obj.origemConferencia&&obj.divergenciaTipo!=='nota'){
    promise=promise.then(function(ref){
      db.collection('medicamentos').doc(obj.medicamentoId).update({loteAtual:obj.lote,validadeAtual:obj.validade}).catch(function(){});
      return ref;
    });
  }
  // Se for saída real, verificar se há divergência de substituição vinculada
  if(obj.tipo==='saida'&&obj.medicamentoId&&!obj.ficticioDiv){
    promise=promise.then(function(ref){
      // Buscar divergências do tipo substituição onde este med é o 'real'
      return db.collection('divergencias')
        .where('realMedId','==',obj.medicamentoId)
        .where('tipo','==','substituicao')
        .get().then(function(snap){
          if(snap.empty)return ref;
          var espelhos=[];
          snap.docs.forEach(function(doc){
            if(doc.data().status==='encerrada')return;
            var div=doc.data();
            // Gerar saída fictícia do medicamento da nota
            var ficObj={criadoEm:new Date().toISOString(),date:todayStr(),
              autorId:user.uid,autorNome:user.name||user.email,autorCargo:user.role||'',autorColor:user.color||B,
              medicamentoId:div.notaMedId,medicamentoNome:div.notaMedNome,
              tipo:'saida',quantidade:obj.quantidade,
              lote:'',validade:'',
              obs:'[FICTÍCIO] Espelho de saída de '+obj.medicamentoNome+' — Div. NF '+(div.nfNumero||''),
              ficticioDiv:true,divId:doc.id,divOrigMedId:obj.medicamentoId
            };
            espelhos.push(
              db.collection('entries').add(ficObj).then(function(){
                // Atualizar total de saídas fictícias na divergência
                return db.collection('divergencias').doc(doc.id).update({
                  saidaFicticiaTotal:(div.saidaFicticiaTotal||0)+obj.quantidade
                });
              })
            );
          });
          return Promise.all(espelhos).then(function(){return ref;});
        }).catch(function(){return ref;});
    });
  }
  if(obj.tipo==='saida'&&obj.medicamentoId){
    promise=promise.then(function(ref){
      var novoEst=(stock[obj.medicamentoId]||0)-(obj.quantidade||0);
      if(novoEst<=0){
        db.collection('medicamentos').doc(obj.medicamentoId).update({loteAtual:'',validadeAtual:''}).catch(function(){});
      }
      return ref;
    });
  }
  return promise;
}catch(e){console.error('addEntry erro:',e);return Promise.reject(e);}}
