<!doctype html>
<html lang="pt-BR">
<head>

<title>FarmaControl · sem conexão</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#EEF2F7;color:#1E293B;font-family:'Segoe UI',system-ui,sans-serif;padding:24px;text-align:center}
.c{max-width:360px}.i{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;background:linear-gradient(135deg,#0A2D6E,#1351B4);color:#fff;font:800 24px 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;letter-spacing:-.03em;display:flex;align-items:center;justify-content:center}
h1{font-size:20px;margin:0 0 8px}p{color:#475569;line-height:1.5;margin:0 0 18px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px 22px;background:#1351B4;color:#fff;cursor:pointer}
</style>
</head>
<body><div class="c"><div class="i">FC</div><h1>Sem conexão com a internet</h1><p>O FarmaControl precisa de internet para mostrar o estoque. Quando o sinal voltar, toque no botão para abrir de novo.</p><button type="button" onclick="location.reload()">Tentar de novo</button></div></body>
